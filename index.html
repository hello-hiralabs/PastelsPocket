    '<div class="track mx-auto max-w-[286px]" style="height:16px">'+
      '<div class="fill" style="width:'+pct+'%;background-color:#A3C79B"></div></div>'+
    '<p class="hand text-[12.5px] text-[#6E9668] mt-2">'+esc(tf('{0}% dari total wishlist {1}',Math.round(pct),rpS(target)))+'</p>'+
  '</section>';

  if(db.goals.length && ui.sortMode){
    html+='<section class="paper p-4 mb-4" style="background:#FFFDFA;border-color:#F7E7B8">'+
      cardHead(t('Atur Urutan'),'clamp','#F7E7B8','📋',
        '<button data-act="sort-done" class="hand text-[11.5px] font-bold px-3 py-1 rounded-full" style="background:#EAF5E2;border:2px solid #A3C79B;color:#6E9668">'+t('Selesai')+'</button>')+
      '<p class="text-[12px] text-soft mb-3 -mt-1">'+t('Susun celengan sesuai prioritas kamu. Yang paling penting taruh di atas ✨')+'</p>'+
      db.goals.map((g,gi)=>{
        const k=kindOf(g.e);
        const p=num(g.target)>0?clamp(num(g.saved)/num(g.target)*100,0,100):0;
        return '<div class="sortrow flex items-center gap-2.5 p-2.5 mb-2">'+
          '<span class="hand font-bold text-[12px] w-5 text-center text-soft">'+(gi+1)+'</span>'+
          stk(g.e,{size:38,ic:23,tone:k.tone,fb:k.f})+
          '<div class="flex-1 min-w-0">'+
            '<p class="hand font-bold text-[13.5px] truncate leading-tight">'+esc(g.name||t('Wishlist kamu apa?'))+'</p>'+
            '<p class="text-[10.5px] text-soft">'+esc(kName(k))+' · '+Math.round(p)+'%</p></div>'+
          '<div class="flex gap-1 shrink-0">'+
            '<button data-act="goal-up" data-id="'+g.id+'" aria-label="Naikkan" class="sortbtn"'+(gi===0?' disabled':'')+'>▲</button>'+
            '<button data-act="goal-down" data-id="'+g.id+'" aria-label="Turunkan" class="sortbtn"'+(gi===db.goals.length-1?' disabled':'')+'>▼</button>'+
          '</div></div>';
      }).join('')+
    '</section>';
  } else if(db.goals.length){
    if(db.goals.length>1){
      html+='<button data-act="sort-on" class="w-full py-2.5 mb-4 rounded-2xl bg-white hand font-bold text-[13px] text-soft flex items-center justify-center gap-1.5 active:scale-[.98] transition" style="border:2.5px solid #F3E7EA;box-shadow:0 3px 0 #FBF0F4">'+
        '<span class="text-[13px]">⇅</span> '+t('Atur Urutan')+'</button>';
    }
    db.goals.forEach((g,gi)=>{
      const p=num(g.target)>0?clamp(num(g.saved)/num(g.target)*100,0,100):0;
      const k=kindOf(g.e), tone=k.tone;
      const kurang=Math.max(0,num(g.target)-num(g.saved));
      const done=p>=100;
      const gf=k.f;
      html+=
      '<section class="paper tape p-4 pt-5 mb-4" style="'+tapeStyle('goal',(20+gi*6)+'px',70,(gi%2?4:-5))+';background:'+k.soft+';border-color:'+k.tone+'88">'+
        '<div class="flex items-center gap-3 mb-3">'+
          '<button data-act="goal-emoji" data-id="'+g.id+'" aria-label="Sticker" class="stk-press shrink-0">'+
            stk(g.e,{size:52,ic:31,tone:tone,fb:gf})+'</button>'+
          '<div class="flex-1 min-w-0">'+
            '<input type="text" data-field="goal:'+g.id+':name" value="'+esc(g.name)+'" placeholder="'+t('Wishlist kamu apa?')+'" class="flatfield hand font-bold text-[17px]">'+
            '<p class="text-[11px] font-bold mt-1" style="color:'+k.dark+'">'+esc(kName(k))+'</p>'+
            '<p class="text-[11.5px] text-soft">'+esc(done?t('Udah full! Saatnya checkout 🎉'):tf('Kurang {0} lagi, semangat!',rpS(kurang)))+'</p>'+
          '</div>'+
          '<button data-act="del-goal" data-id="'+g.id+'" aria-label="Hapus" class="w-7 h-7 grid place-items-center text-[#CBBCC0] font-bold text-[17px] shrink-0">×</button>'+
        '</div>'+
        '<div class="flex items-end justify-between mb-1.5">'+
          '<span class="text-[13px]"><b class="money font-extrabold" data-live="gs:'+g.id+'">'+rpS(g.saved)+'</b> <span class="text-soft">/ '+rpS(g.target)+'</span></span>'+
          '<span class="hand font-bold text-[18px]" data-live="gp:'+g.id+'">'+Math.round(p)+'%</span>'+
        '</div>'+
        '<div class="track relative" style="height:18px">'+
          '<div class="fill" data-live="gb:'+g.id+'" style="width:'+p+'%;background-color:'+k.solid+'"></div>'+
          '<span class="absolute top-1/2 -translate-y-1/2 transition-all" style="left:calc('+p+'% - 11px)">'+
            ico(done?'party-popper':'sparkles',16,done?'🎉':'✨')+'</span>'+
        '</div>'+
        '<div class="grid grid-cols-2 gap-2 mt-3">'+
          '<label class="block"><span class="hand block text-[11px] text-soft mb-1">'+t('Targetnya')+'</span>'+
            '<input type="text" inputmode="numeric" data-money="1" data-field="goal:'+g.id+':target" value="'+fmt(g.target)+'" class="field !py-2 text-[13px] text-right money font-bold"></label>'+
          '<label class="block"><span class="hand block text-[11px] text-soft mb-1">'+t('Sudah ada')+'</span>'+
            '<input type="text" inputmode="numeric" data-money="1" data-field="goal:'+g.id+':saved" value="'+fmt(g.saved)+'" class="field !py-2 text-[13px] text-right money font-bold"></label>'+
        '</div>'+
        '<button data-act="fill-goal" data-id="'+g.id+'" class="clay mt-3.5 w-full py-3 hand font-bold text-[15px]" style="'+clayVars(k)+'">'+t('Yuk Isi Celengan 💖')+'</button>'+
      '</section>';
    });
  } else {
    html+='<section class="paper p-7 text-center mb-4">'+
      '<div class="inline-block mb-3">'+stk('honey-pot',{size:70,ic:42,tone:'#EFDCD1',rot:-4,fb:'🫙'})+'</div>'+
      '<p class="hand text-[15px] font-bold mb-1">'+t('Belum ada celengan nih')+'</p>'+
      '<p class="text-[12.5px] text-soft">'+t('Bikin satu wishlist dulu yuk, biar nabungnya ada tujuannya 💖')+'</p></section>';
  }

  /* Jembatan ke amplop: alokasi bulan ini vs yang sudah benar-benar disetor.
     Sengaja butuh satu ketukan — alokasi itu rencana, setoran itu uang. */
  const alokasi=envNom('save',sums(mkNow()).masuk);
  const tersetor=envSpent(mkNow(),'save');
  const sisaAlok=Math.max(0,alokasi-tersetor);
  if(alokasi>0){
    html+='<section class="paper tape p-4 pt-5 mb-4" style="'+tapeStyle('main','24px',78,-4)+';background:#FFFAEA;border-color:#F7E7B8">'+
      cardHead(t('Celengan Impian 💰'),'money-bag','#F7E7B8','💰')+
      '<p class="hand text-[12.5px] font-bold mb-0.5" style="color:#786557">'+esc(tf('Alokasi amplop celengan bulan ini {0}',rp(alokasi)))+'</p>'+
      '<p class="text-[11.5px] text-soft mb-3">'+esc(tf('Belum disetor ke celengan: {0}',rp(sisaAlok)))+'</p>'+
      (sisaAlok>0
        ? '<button data-act="setor-alokasi" class="clay clay-gold w-full py-3 hand font-bold text-[14.5px]">'+t('Setor Alokasi ke Celengan')+'</button>'
        : '<p class="hand text-[12.5px] text-center" style="color:#5D7C58">'+t('Alokasi celengan sudah tersetor semua ✨')+'</p>')+

    pill('money-bag','💰',t('Ketabung'),s.nabung,'#F1F8EC','#D8E8D4',-2)+
    pill('cherry-blossom','🌸',t('Sisa Dompet'),s.sisa,'#FDF5F8','#EBE0EF',3)+
  '</div>';

  html+='<button data-act="share" class="clay w-full py-3.5 mb-5 hand font-bold text-[15.5px]">'+t('Share ke IG Story 📤')+'</button>';

  const per={};
  M.tx.forEach(x=>{ if(x.cat==='celengan') return; per[x.cat]=(per[x.cat]||0)+num(x.amount); });
  const rows=Object.keys(per).map(k=>({k,v:per[k]})).sort((a,b)=>b.v-a.v);
  let catHtml='';
  if(rows.length){
    const max=rows[0].v;
    rows.forEach(r=>{
      const c=catOf(r.k);
      catHtml+='<div class="flex items-center gap-2.5 py-2">'+
        stk(c.i,{size:38,ic:22,tone:c.c,fb:c.f})+
        '<div class="flex-1 min-w-0">'+
          '<div class="flex justify-between mb-1"><span class="hand text-[13.5px] font-semibold">'+esc(cName(c))+'</span>'+
          '<span class="text-[12.5px] font-extrabold money">'+rpS(r.v)+'</span></div>'+
          '<div class="track" style="height:9px"><div class="fill" style="width:'+(r.v/max*100)+'%;background-color:'+c.s+'"></div></div>'+
        '</div></div>';
    });
  } else catHtml='<p class="hand text-[13px] text-soft text-center py-4">'+t('Bulan ini masih bersih, belum ada catatan 🌱')+'</p>';
  html+='<section class="paper tape p-4 pt-5 mb-5" style="'+tapeStyle('main','26px',80,-5)+'">'+
    cardHead(t('Duitmu Lari ke Mana? 👀'),'chart-increasing','#FFD9E4','📊')+catHtml+'</section>';

  const dim=daysIn(mk), first=new Date(num(mk.slice(0,4)),num(mk.slice(5,7))-1,1).getDay();
  const dayTot={};
  M.tx.forEach(x=>{ if(x.cat==='celengan') return; const d=num(x.date.slice(8,10)); dayTot[d]=(dayTot[d]||0)+num(x.amount); });
  const maxD=Math.max(1,...Object.values(dayTot));
  let cal='<div class="grid grid-cols-7 gap-1.5 mb-2">'+HARI_S().map(h=>'<span class="hand text-[10px] text-soft text-center font-bold">'+h+'</span>').join('')+'</div>'+
    '<div class="grid grid-cols-7 gap-1.5">';
  for(let i=0;i<first;i++) cal+='<span></span>';
  for(let d=1;d<=dim;d++){
    const v=dayTot[d]||0, a=v>0?.18+(v/maxD)*.72:0;
    const isToday=mk===mkNow()&&d===new Date().getDate();
    cal+='<div class="aspect-square rounded-[13px] grid place-items-center text-[11px] font-extrabold" '+
      'style="background:'+(v>0?'rgba(255,158,178,'+a.toFixed(2)+')':'#FDF6F9')+';color:'+(a>.55?'#fff':'#B4A3AE')+
      ';border:2px solid '+(isToday?'#FF9EAA':'transparent')+'" title="'+rp(v)+'">'+d+'</div>';
  }
  cal+='</div>';
  html+='<section class="paper tape p-4 pt-5 mb-5" style="'+tapeStyle('goal','30px',74,4)+'">'+
    cardHead(t('Kalender Jajan 📅'),'spiral-calendar','#E6DCEE','📅',
      '<span class="hand text-[11px] text-soft">'+t('makin pink = makin boros')+'</span>')+cal+'</section>';

  html+='<section class="paper tape p-4 pt-5 mb-3" style="'+tapeStyle('main','24px',72,-4)+'">'+
    cardHead(t('Cerita Bulan Ini'),'notebook-with-decorative-cover','#FCE9B8','📔')+
    storyList(storyItems(mk))+'</section>';

  return html;
}

/* ======== src/story.js ======== */
/* =========================================================
   16. STORY CARD 9:16
   ---------------------------------------------------------
   Zona tetap (lihat docs/kartu-story.md):
     A  60- 330  pita, judul, tanggal
     B 340- 790  panggung kucing 800x450
     C 800- 960  label + angka besar
     D 980-1184  tiga kotak ringkasan
     E 1240-1460 kutipan
     F 1500-1620 nama + jumlah stiker
     G 1700-1850 cap jempol + watermark

   Urutan gambar: latar -> panggung -> stiker -> SELURUH teks.
   Karena stiker selalu digambar sebelum teks, dia tidak akan
   pernah bisa menutupi angkanya — jadi tidak perlu ada area
   terlarang buat pengguna.
   ========================================================= */

const W = 1080, H = 1920;
const SX = 156, SY = 340, SW = 800, SH = 450;   /* panggung kucing */

/* ---------------------------------------------------------
   SVG -> <img> supaya bisa masuk canvas.
   encodeURIComponent, BUKAN btoa: nama ras kucing mengandung
   karakter non-ASCII dan btoa akan melempar error.
   --------------------------------------------------------- */
function svgToImage(svg, batas){
  return new Promise((res, rej) => {
    const img = new Image();
    const jam = setTimeout(() => rej(new Error('timeout')), batas || 1500);
    img.onload  = () => { clearTimeout(jam); res(img); };
    img.onerror = () => { clearTimeout(jam); rej(new Error('gagal muat')); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

/* panggung kucing, dipisah supaya kegagalannya tidak menghentikan kartu */
async function stageImage(st){
  try{
    return await svgToImage(catStageSVG(st, db.profile.cat, SW, SH, true));
  }catch(e){
    console.warn('[Pastels] panggung kucing gagal, pakai wajah cadangan:', e && e.message);
    return null;
  }
}

async function buildStoryCanvas(){
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const HD = (w, s) => w + ' ' + s + 'px "Shantell Sans", cursive';
  const PJ = (w, s) => w + ' ' + s + 'px "Plus Jakarta Sans", sans-serif';
  const rr = (a, b, w, h, r) => { x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); };

  /* Pasang font, lalu kecilkan kalau teksnya lebih lebar dari jatahnya.
     Ukuran font di kanvas TIDAK boleh dipatok buta: kalau Shantell Sans
     gagal dimuat, font cadangan bisa jauh lebih lebar dan labelnya
     tumpah keluar kotak. Lebar teks hampir lurus terhadap ukuran font,
     jadi satu kali ukur sudah cukup. */
  const setFit = (mk, weight, size, txt, maxW) => {
    x.font = mk(weight, size);
    const w = x.measureText(txt).width;
    if(w > maxW) x.font = mk(weight, Math.max(11, Math.floor(size * maxW / w)));
  };

  const s = sums(mkNow()), jatah = allowance(), spent = spentOn(today());
  const left = Math.max(0, jatah - spent);
  const st = catState(left, jatah);
  const d = new Date(), nama = db.profile.name || t('Bestie');

  /* panggungnya dimuat duluan: sisa fungsi ini sinkron semua */
  const panggung = await stageImage(st);

  /* ---------- kertas jurnal ---------- */
  x.fillStyle = '#FFFDF9'; x.fillRect(0, 0, W, H);
  const glow = x.createLinearGradient(0, 0, W, H);
  glow.addColorStop(0,'rgba(255,192,211,.42)'); glow.addColorStop(.5,'rgba(255,243,205,.45)'); glow.addColorStop(1,'rgba(226,240,217,.55)');
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,176,199,.26)';
  for(let py=30; py<H; py+=44) for(let px=(Math.round(py/44)%2?22:0)+16; px<W; px+=44){ x.beginPath(); x.arc(px,py,4,0,6.29); x.fill(); }
  x.strokeStyle = 'rgba(232,216,232,.60)'; x.lineWidth = 2.5;
  for(let ly=300; ly<H-140; ly+=58){ x.beginPath(); x.moveTo(150,ly); x.lineTo(W-70,ly); x.stroke(); }
  x.strokeStyle = 'rgba(255,192,211,.75)'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(150,180); x.lineTo(150,H-120); x.stroke();
  [430,960,1490].forEach(hy => {
    x.fillStyle = '#FFF7F9'; x.beginPath(); x.arc(86,hy,26,0,6.29); x.fill();
    x.strokeStyle = 'rgba(255,176,199,.55)'; x.lineWidth = 3.5; x.stroke();
  });

  /* ---------- washi ---------- */
  const w = WMAP[db.washi.main] || WASHI[0];
  const drawTape = (cx, cy, tw, th, rot) => {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    x.fillStyle = w.tone; x.globalAlpha = .92; x.fillRect(-tw/2,-th/2,tw,th);
    x.globalAlpha = 1;
    x.save(); x.beginPath(); x.rect(-tw/2,-th/2,tw,th); x.clip();
    if(w.pat === 'stripe'){ x.fillStyle = 'rgba(255,255,255,.6)';
      for(let i=-tw;i<tw;i+=26){ x.save(); x.translate(i,0); x.rotate(-.7); x.fillRect(0,-th,11,th*3); x.restore(); } }
    else if(w.pat === 'grid'){ x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 3;
      for(let i=-tw/2;i<tw/2;i+=22){ x.beginPath(); x.moveTo(i,-th/2); x.lineTo(i,th/2); x.stroke(); }
      for(let j=-th/2;j<th/2;j+=22){ x.beginPath(); x.moveTo(-tw/2,j); x.lineTo(tw/2,j); x.stroke(); } }
    else { x.fillStyle = 'rgba(255,255,255,.72)';
      for(let i=-tw/2;i<tw/2;i+=30) for(let j=-th/2;j<th/2;j+=30){ x.beginPath(); x.arc(i+15,j+15,6,0,6.29); x.fill(); } }
    x.restore();
    x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(-tw/2,-th/2,tw,6);
    x.restore();
  };
  drawTape(540, 168, 540, 86, -0.055);
  drawTape(958, 268, 200, 52, 0.42);

  /* ---------- B. panggung kucing ---------- */
  x.save();
  x.shadowColor = 'rgba(190,130,155,.22)'; x.shadowBlur = 26; x.shadowOffsetY = 10;
  x.fillStyle = '#FFFDFB'; rr(SX-14, SY-14, SW+28, SH+28, 44); x.fill();
  x.restore();

  x.save(); rr(SX, SY, SW, SH, 32); x.clip();
  if(panggung) x.drawImage(panggung, SX, SY, SW, SH);
  else wajahCadangan(x, SX + SW/2, SY + SH/2, 128, st);
  x.restore();

  x.strokeStyle = '#F6E7ED'; x.lineWidth = 6; rr(SX, SY, SW, SH, 32); x.stroke();
  drawTape(SX + 128, SY - 2, 246, 54, -0.10);   /* foto yang ditempel */

  /* ---------- stiker tempel ---------- */
  const pal = stickerPal();
  autoTempel(today() + '|' + db.profile.cat + '|' + db.washi.main, 5)
    .forEach(tp => drawSticker(x, tp.s, tp.x * W, tp.y * H, 110 * tp.z, tp.r, pal));

  /* ---------- A. judul ---------- */
  x.textAlign = 'center';
  const judul = t('Jurnal Jajan Harianku ✨');
  x.fillStyle = '#5A4E4D'; setFit(HD, 700, 64, judul, 840);
  x.fillText(judul, 556, 262);
  const tgl = d.getDate() + ' ' + BULAN()[d.getMonth()] + ' ' + d.getFullYear();
  x.fillStyle = '#B79FAC'; setFit(PJ, 600, 38, tgl, 700);
  x.fillText(tgl, 556, 326);

  /* ---------- C. angka utama ---------- */
  x.fillStyle = '#7E7271'; setFit(HD, 600, 42, t('jatah hari ini'), 700);
  x.fillText(t('jatah hari ini'), 556, 848);
  const besar = rp(left);
  x.fillStyle = '#FF8299'; setFit(PJ, 800, 124, besar, 880);
  x.fillText(besar, 556, 962);

  /* ---------- D. tiga kotak ---------- */
  const box = (cx, cy, label, val, bg, br) => {
    x.save(); x.shadowColor = 'rgba(190,130,155,.18)'; x.shadowBlur = 18; x.shadowOffsetY = 7;
    x.fillStyle = bg; rr(cx-142, cy, 284, 204, 42); x.fill(); x.restore();
    x.strokeStyle = br; x.lineWidth = 5; rr(cx-142, cy, 284, 204, 42); x.stroke();
    x.textAlign = 'center';
    x.fillStyle = '#7E7271'; setFit(HD, 600, 31, label, 248); x.fillText(label, cx, cy+70);
    x.fillStyle = '#5A4E4D'; setFit(PJ, 800, 46, val, 248);   x.fillText(val, cx, cy+140);
  };
  box(258, 990, t('total jajan kepake'), rpS(spent), '#FFF1F5', '#FBD5E2');
  box(556, 990, t('streak'), tf('🔥 {0} hari', num(db.streak.count)), '#FFF8DC', '#F7E7B8');
  box(854, 990, t('sisa dompet'), rpS(wantsLeft()), '#F1F8EC', '#D3E7C6');

  /* ---------- E. kutipan ---------- */
  const q = QUOTES()[(d.getDate() + d.getMonth()) % QUOTES().length];
  x.save(); x.translate(556, 1340); x.rotate(-0.014);
  x.fillStyle = '#FFF7D9'; rr(-390, -118, 780, 236, 48); x.fill();
  x.strokeStyle = '#F7E7B8'; x.lineWidth = 5; rr(-390, -118, 780, 236, 48); x.stroke();
  x.fillStyle = '#7A6A62'; x.textAlign = 'center';
  /* kutipan dibungkus sendiri, jadi yang diukur kata terpanjangnya:
     satu kata yang lebih lebar dari kotak tidak bisa diselamatkan
     pembungkusan baris */
  const terpanjang = q.split(' ').reduce((a, b) => a.length > b.length ? a : b, '');
  setFit(HD, 600, 41, terpanjang, 640);
  const words = q.split(' '); let line = '', ly = -34;
  words.forEach(wd => { if(x.measureText(line+wd+' ').width > 640){ x.fillText(line.trim(), 0, ly); line = wd+' '; ly += 58; } else line += wd+' '; });
  x.fillText(line.trim(), 0, ly);
  x.restore();

  /* ---------- F & G. identitas + watermark ---------- */
  x.textAlign = 'center';
  const baris = nama + ' · ' + tf('{0} Stiker Kekumpul', Object.keys(db.badges).length);
  x.fillStyle = '#7E7271'; setFit(PJ, 600, 33, baris, 780);
  x.fillText(baris, 556, 1560);

  drawSticker(x, 'paw', 906, 1668, 104, -0.22,
    { a:'#A3C79B', b:'#A3C79B', c:'#A3C79B', ink:'#A3C79B', putih:'#A3C79B' }, .22);

  const cap = t('Logged with Pastels : Your Pocket Bestie 🌸');
  x.fillStyle = '#A66172'; x.textAlign = 'center'; setFit(HD, 700, 36, cap, 860);
  x.globalAlpha = .88; x.fillText(cap, 556, 1806); x.globalAlpha = 1;

  return cv;
}

/* ---------------------------------------------------------
   Wajah bulat yang lama, sekarang cuma dipakai kalau panggung
   kucing gagal dimuat. Kartu yang terbit dengan wajah
   sederhana jauh lebih baik daripada tombol Share yang
   menggantung.
   --------------------------------------------------------- */
function wajahCadangan(x, fx, fy, fr, st){
  x.fillStyle = st === 'box' ? '#FFE9EE' : (st === 'watch' ? '#FDF3DC' : '#EFF7E8');
  x.fillRect(SX, SY, SW, SH);
  x.fillStyle = st === 'box' ? '#FFCFD8' : (st === 'watch' ? '#FCE9B8' : '#D3E7C6');
  x.beginPath(); x.arc(fx, fy, fr, 0, 6.29); x.fill();
  x.strokeStyle = '#fff'; x.lineWidth = 13; x.stroke();
  x.fillStyle = '#5A4E4D';
  x.beginPath(); x.arc(fx-44, fy-18, 13, 0, 6.29); x.fill();
  x.beginPath(); x.arc(fx+44, fy-18, 13, 0, 6.29); x.fill();
  x.fillStyle = 'rgba(255,158,178,.55)';
  x.beginPath(); x.ellipse(fx-76, fy+27, 24, 16, 0, 0, 6.29); x.fill();
  x.beginPath(); x.ellipse(fx+76, fy+27, 24, 16, 0, 0, 6.29); x.fill();
  x.strokeStyle = '#5A4E4D'; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath();
  if(st === 'box') x.arc(fx, fy+76, 37, Math.PI*1.15, Math.PI*1.85);
  else x.arc(fx, fy+32, 37, Math.PI*.15, Math.PI*.85);
  x.stroke();
}

function dataURLtoBlob(u){
  const p = u.split(','), b = atob(p[1]), n = b.length, arr = new Uint8Array(n);
  for(let i=0;i<n;i++) arr[i] = b.charCodeAt(i);
  return new Blob([arr], {type:'image/png'});
}

/* Perbarui seluruh angka kartu Amplop di tempat.
   Tidak memakai render() supaya kursor di kotak yang sedang diketik tidak lepas. */
function refreshEnv(kecuali){
  const mk=mkNow(), masuk=sums(mk).masuk;
  ENVS.forEach(e=>{
    const alloc=envNom(e.k,masuk), used=envSpent(mk,e.k);
    const ip=document.querySelector('[data-live="envpct:'+e.k+'"]');
    const inn=document.querySelector('[data-live="envnom:'+e.k+'"]');
    const bar=document.querySelector('[data-live="envbar:'+e.k+'"]');
    const us=document.querySelector('[data-live="envused:'+e.k+'"]');
    if(ip && ip!==kecuali) ip.value=num(db.env[e.k].pct);
    if(inn && inn!==kecuali) inn.value=fmt(alloc);
    if(bar){
      const pc=alloc>0?clamp(used/alloc*100,0,100):(used>0?100:0);
      bar.style.width=pc+'%';
      bar.style.backgroundColor=(alloc>0&&used>alloc)?'#FF8299':e.solid;
    }
    if(us) us.textContent=tf('Kepake {0} dari {1}',rpS(used),rpS(alloc));
  });
  const tot=document.querySelector('[data-live="envtotal"]');
  if(tot){ const s2=envPctSum(); tot.textContent=tf('Total amplop {0}% dari cuan masuk',s2);
    tot.classList.toggle('text-soft',s2===100); }
  refresh();
}

      save(); render(); break;
    }

    /* Pindahkan alokasi amplop celengan jadi setoran nyata,
       dibagi ke tiap celengan sesuai sisa kebutuhannya. */
    case 'setor-alokasi': {
      const mk=mkNow();
      const sisa=Math.max(0,envNom('save',sums(mk).masuk)-envSpent(mk,'save'));
      if(sisa<=0){ toast(t('Alokasi celengan sudah tersetor semua ✨')); break; }
      if(!db.goals.length){ toast(t('Belum ada celengan buat disetori')); break; }
      const butuh=db.goals.map(g=>Math.max(0,num(g.target)-num(g.saved)));
      const totalButuh=butuh.reduce((x,y)=>x+y,0);
      let terbagi=0, n=0;
      db.goals.forEach((g,i)=>{
        /* proporsional ke sisa kebutuhan; kalau semua sudah penuh, bagi rata */
        const bagian=totalButuh>0 ? Math.floor(sisa*butuh[i]/totalButuh/100)*100
                                  : Math.floor(sisa/db.goals.length/100)*100;
        if(bagian<=0) return;
        g.saved=sanitizeAmount(num(g.saved)+bagian);
        MO(mk).tx.push({id:uid(),date:today(),cat:'celengan',goal:g.id,amount:bagian,
          note:'Setor alokasi amplop',h:new Date().getHours()});
        terbagi+=bagian; n++;
      });
      if(!n){ toast(t('Alokasi celengan sudah tersetor semua ✨')); break; }
      collectRewards(); save(); render();
      if(!flushQueue()) toast(tf('{0} dibagi ke {1} celengan 💖',rp(terbagi),n));
      break;
    }

    case 'add-goal': {
      const used=db.goals.map(g=>g.e);
      const pick=GOAL_KINDS.filter(k=>used.indexOf(k.i)<0)[0]||GOAL_KINDS[db.goals.length%GOAL_KINDS.length];
      db.goals.push({id:uid(),name:'',e:pick.i,target:0,saved:0,tone:db.goals.length});
      collectRewards(); save(); render(); flushQueue(); break;
    }
    case 'del-goal': db.goals=db.goals.filter(g=>g.id!==d.id); if(db.goals.length<2) ui.sortMode=false; save(); render(); break;
    case 'sort-on': ui.sortMode=true; render(); window.scrollTo(0,0); break;
    case 'sort-done': ui.sortMode=false; save(); render(); toast(t('Urutan celengan udah kesimpen ✨')); break;
    case 'goal-up': case 'goal-down': {
      const i=db.goals.findIndex(g=>g.id===d.id); if(i<0) break;
      const j=a==='goal-up'?i-1:i+1;
      if(j<0||j>=db.goals.length) break;
      const tmp=db.goals[i]; db.goals[i]=db.goals[j]; db.goals[j]=tmp;
      save(); render(); break;
    }
    case 'goal-emoji': emojiSheet(d.id); break;
    case 'set-emoji': { const g=db.goals.find(x=>x.id===d.id); if(g) g.e=d.e; save(); closeSheet(); render(); break; }
    case 'fill-goal': fillGoalSheet(d.id); break;

    case 'save-fill': {
      const amount=num(digits($('#ga')?$('#ga').value:''));
      if(amount<=0){ toast(t('Mau nabung berapa nih? 💰')); return; }
      const g=db.goals.find(x=>x.id===d.id); if(!g) break;
      const before=num(g.target)>0?num(g.saved)/num(g.target)*100:0;
      g.saved=num(g.saved)+amount;
      MO(mkNow()).tx.push({id:uid(),date:today(),cat:'celengan',goal:g.id,amount,note:'Isi celengan '+(g.name||'impian'),h:new Date().getHours()});
      touchStreak(); collectRewards();
      save(); closeSheet(); render();
      const after=num(g.target)>0?num(g.saved)/num(g.target)*100:0;
      if(!flushQueue()){
        let pesan=tf('Selangkah lagi menuju {0}. Proud of you! 💖',g.name||t('Impian'));
        let icon='money-bag', fb='💰';
        if(after>=100){ pesan=tf('Celengan {0} udah full! Saatnya checkout 🎉',g.name||''); icon='party-popper'; fb='🎉'; }
        else if(before<50&&after>=50){ pesan=tf('Setengah jalan! Tinggal {0} lagi. Bisa banget kamu 💪',rpS(Math.max(0,num(g.target)-num(g.saved)))); icon='glowing-star'; fb='🌟'; }
        celebrate(tf('Gokil! Celenganmu nambah {0} 💖',rp(amount)),pesan,icon,fb,after>=50);
      }
      break;
    }

    case 'badge': badgeSheet(d.id); break;
    case 'share': storySheet(); break;
    case 'save-img': {
      const img=$('#storyImg'); if(!img) break;
      const blob0=dataURLtoBlob(img.src);
      const file0=new File([blob0],'pastels-story-'+today()+'.png',{type:'image/png'});
      /* di iPhone, unduhan blob cuma kebuka di tab baru. Lembar Share iOS
         punya "Save Image" jadi lebih pas buat simpan ke galeri. */
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
      if(isIOS && navigator.canShare && navigator.canShare({files:[file0]})){
        navigator.share({ files:[file0] }).catch(()=>toast(t('Tahan gambarnya terus pilih Save ya 🌸')));
        break;
      }
      try{
        const u=URL.createObjectURL(blob0);
        const a2=document.createElement('a'); a2.href=u; a2.download='pastels-story-'+today()+'.png';
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(()=>URL.revokeObjectURL(u),4000);
        toast(t('Udah kesimpen! Cek galeri kamu 💕'));
      }catch(e){ toast(t('Tahan gambarnya terus pilih Save ya 🌸')); }
      break;
    }
    case 'share-img': {
      const img=$('#storyImg'); if(!img) break;
      const blob=dataURLtoBlob(img.src);
      const file=new File([blob],'pastels-story-'+today()+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],text:t('Lagi rajin catat jajan pakai Pastels 🎀')}).catch(()=>{});
      } else if(navigator.clipboard&&window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
          .then(()=>toast(t('Udah kesalin! Tinggal paste 💕'))).catch(()=>toast(t('Tahan gambarnya terus pilih Copy ya 🌸')));
      } else toast(t('Tahan gambarnya terus pilih Share ya 🌸'));
      break;
    }

    case 'step': {
      const y=num(ui.mk.slice(0,4)); let m=num(ui.mk.slice(5,7))+num(d.d), yy=y;
      if(m<1){m=12;yy--;} if(m>12){m=1;yy++;}
      ui.mk=yy+'-'+pad2(m); render(); break;
    }

    case 'set-ava': db.profile.ava=d.e; save(); closeSheet(); render(); settingsSheet(); break;
    case 'export': {
      try{
        const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
        const u=URL.createObjectURL(b);
        const a2=document.createElement('a'); a2.href=u; a2.download='pastels-backup-'+today()+'.json';
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(()=>URL.revokeObjectURL(u),4000);
        toast(t('Backup-nya udah keunduh 💾'));
      }catch(e){ toast(t('Yah, gagal keunduh 🥲')); }
      break;
    }
    case 'import': $('#importFile').click(); break;
      sheet('<div class="text-center pb-2">'+
        '<div class="inline-block mb-3">'+stk('pleading-face',{size:76,ic:46,tone:'#FFD9E4',rot:-4,fb:'🥺'})+'</div>'+
        '<h2 class="hand font-bold text-[20px] mb-1">'+t('Yakin mau reset semua? 🥺')+'</h2>'+
        '<p class="text-[13px] text-soft mb-5 px-3">'+t('Semua catatan, celengan, sama stiker kamu bakal hilang. Backup dulu kalau masih sayang.')+'</p>'+
        '<div class="flex gap-2">'+
          '<button data-act="close" class="flex-1 py-3.5 rounded-2xl bg-white hand font-bold text-[15px]" style="border:2.5px solid #F3E7EA;box-shadow:0 3px 0 #FBF0F4">'+t('Nggak jadi')+'</button>'+
          '<button data-act="reset-ok" class="flex-1 py-3.5 rounded-2xl hand font-bold text-[15px]" style="background:#FFC0D3;box-shadow:0 4px 0 #FFAEC2">'+t('Iya, hapus')+'</button>'+
        '</div></div>');
      break;
    case 'reset-ok':
      /* blank(), BUKAN seed(): dulu tombol ini menulis ulang data contohnya,
         jadi "hapus semua" justru mengembalikan yang mau dihapus */
      pasangData(blank()); closeSheet(); render();
      toast(t('Oke, mulai dari nol lagi 🌱')); break;

    /* ---- pilihan awal & data contoh ---- */
    case 'mulai-kosong': closeSheet(); toast(t('Siap! Catat jajan pertamamu ya 🌱')); break;
    case 'pakai-contoh':
      pasangData(seed()); closeSheet(); render();
      toast(t('Data contoh dimuat, tinggal lihat-lihat 👀')); break;
    case 'demo-ask':
      sheet('<div class="text-center pb-2">'+
        '<div class="inline-block mb-3">'+stk('eyes',{size:72,ic:44,tone:'#F7E7B8',rot:-4,fb:'👀'})+'</div>'+
        '<h2 class="hand font-bold text-[20px] mb-1">'+t('Muat data contoh?')+'</h2>'+
        '<p class="text-[13px] text-soft mb-5 px-3">'+t('Semua isi aplikasi sekarang bakal diganti sama dua bulan catatan contoh.')+'</p>'+
        '<div class="flex gap-2">'+
          '<button data-act="close" class="flex-1 py-3.5 rounded-2xl bg-white hand font-bold text-[15px]" style="border:2.5px solid #F3E7EA;box-shadow:0 3px 0 #FBF0F4">'+t('Nggak jadi')+'</button>'+
          '<button data-act="pakai-contoh" class="flex-1 py-3.5 rounded-2xl hand font-bold text-[15px]" style="background:#F7E7B8;box-shadow:0 4px 0 #EFDFB4">'+t('Iya, muat contoh')+'</button>'+
        '</div></div>');
      break;
  }
});

/* ---------------- Input ---------------- */
document.addEventListener('input',function(ev){
  const el=ev.target; if(!el.dataset) return;
  if(el.dataset.money==='1'){
    const atEnd=el.selectionStart===el.value.length;
    const f=clampDigits(el.value)?fmt(clampDigits(el.value)):'';
    if(f!==el.value){ el.value=f; if(atEnd){ try{ el.setSelectionRange(f.length,f.length); }catch(e){} } }
  }
  const field=el.dataset.field; if(!field) return;
  const v=el.dataset.money==='1'?sanitizeAmount(el.value):el.value;
  const p=field.split(':');
  if(p[0]==='q'){
    ui.q=el.value;
    /* render ulang ditunda, lalu fokus & caret dikembalikan ke kotak cari
       supaya mengetik tidak terputus */
    clearTimeout(qTimer);
    qTimer=setTimeout(()=>{
      const pos=el.selectionStart;
      render();
      const box=$('#qbox');
      if(box){ box.focus(); try{ box.setSelectionRange(pos,pos); }catch(e){} }
    },260);
    return;
  }
  if(p[0]==='rec'){
    const r=recFind(p[1]); if(!r) return;
    if(p[2]==='amount') r.amount=sanitizeAmount(el.value);
    else if(p[2]==='day') r.day=clamp(num(digits(el.value))||1,1,28);
    else if(p[2]==='label') r.label=String(v).slice(0,60);
    else if(p[2]==='cat') r.cat=v;
    save(); return;
  }
  if(p[0]==='env'){
    const e=db.env[p[1]]; if(!e) return;
    if(p[2]==='pct'){
      e.pct=clamp(num(digits(el.value)),0,100); e.nom=null;
      /* Dua amplop lain disesuaikan proporsional supaya total selalu 100%.
         Catatan: permintaan awalnya "kosongkan yang lain jadi 0", tapi itu
         membuat pengisian kedua menghapus yang pertama — tidak akan pernah
         bisa mengisi ketiganya. Auto-balance mencapai tujuan yang sama
         (total tak pernah lewat 100) tanpa masalah itu. */
      const lain=ENVS.filter(x=>x.k!==p[1]);
      const sisa=100-e.pct;
      const jum=lain.reduce((s2,x)=>s2+num(db.env[x.k].pct),0);
      lain.forEach((x,idx)=>{
        const en=db.env[x.k];
        en.nom=null;
        en.pct = jum>0 ? Math.round(sisa*num(en.pct)/jum)
                       : (idx===0 ? sisa : 0);
      });
      /* bulatkan selisih pembulatan ke amplop terakhir */
      const total=ENVS.reduce((s2,x)=>s2+num(db.env[x.k].pct),0);
      if(total!==100 && lain.length) db.env[lain[lain.length-1].k].pct += (100-total);
    }
    else { e.nom=sanitizeAmount(el.value); }
    save(); refreshEnv(el); return;
  }
  if(p[0]==='catenv'){
    if(!db.catEnv) db.catEnv={};
    db.catEnv[p[1]]=v;
    save(); render();
    const c=CATS.filter(x=>x.k===p[1])[0], e2=ENVS.filter(x=>x.k===v)[0];
    if(c&&e2) toast(tf('Kategori {0} pindah ke amplop {1}',cName(c),LANG==='en'?e2.en:e2.n));
    return;
  }
  else if(p[0]==='inc'){ const r=MO(mkNow()).income.find(x=>x.id===p[1]); if(r) r[p[2]]=p[2]==='amount'?num(v):v; }
  else if(p[0]==='goal'){ const g=db.goals.find(x=>x.id===p[1]); if(g) g[p[2]]=(p[2]==='name')?v:num(v); }
  else if(p[0]==='name'){ db.profile.name=v; }
  save(); refresh();
});
document.addEventListener('focusout',function(ev){
  const el=ev.target;
  if(el.dataset&&el.dataset.money==='1'&&el.dataset.field) el.value=fmt(num(digits(el.value)));
},true);
document.addEventListener('change',function(ev){
  const el=ev.target;
  if(el.dataset && el.dataset.field && el.dataset.field.indexOf('rec:')===0){
    const p=el.dataset.field.split(':'), r=recFind(p[1]);
    if(r && p[2]==='cat'){ r.cat=el.value; save(); recurringSheet(); }
    return;
  }
  if(el.id==='importFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){
      const res=safeParseBackup(r.result);
      if(!res.ok){
        /* sebutkan alasannya, jangan cuma "gagal" — pengguna butuh tahu
           apakah salah pilih berkas atau berkasnya memang rusak */
        toast(tf('Backup gagal dipulihkan: {0}',res.error));
        el.value=''; return;
      }
      const cadangan=db;                       /* simpan yang lama dulu */
      try{
        setDb(migrate(res.data)); ui.mk=mkNow(); filterReset();
        save();
        closeSheet(); render(); toast(t('Yeay, data kamu balik lagi 💕'));
      }catch(e){
        setDb(cadangan); render();             /* kembalikan kalau migrasi gagal */
        toast(tf('Backup gagal dipulihkan: {0}',String(e&&e.message||e)));
      }
      el.value='';
    };
    r.onerror=function(){ toast(t('Yah, filenya gagal kebaca 🥲')); el.value=''; };
    r.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.type!=='date'){ ev.preventDefault(); ev.target.blur(); }
  if(ev.key==='Escape'&&!$('#modal').classList.contains('hidden')) closeSheet();
});

/* =========================================================
   ENTRY POINT
   Urutannya penting: data dimuat -> tagihan berulang
   dijalankan -> hadiah dihitung -> baru dirender.
   ========================================================= */








function boot(){
  initUi();
  setDb(load());
  MO(ui.mk);

  const rec = applyRecurring();

  /* hadiah yang sudah terpenuhi oleh data awal dianggap sudah dibuka,
     supaya pengguna baru tidak dihujani pop-up di detik pertama */
  collectRewards(); clearQueue();

  save();
  render();

  if(rec.count){
    setTimeout(() => toast(tf('{0} tagihan otomatis dicatat 🧾', rec.count)), 900);
  }
  if(perdana){
    /* perangkat ini belum punya data apa pun -> tawarkan pilihannya,
       jangan diam-diam mengisi dengan data contoh */
    setTimeout(selamatDatangSheet, 420);
  } else {
    /* Perangkat lama: kalau penyimpanannya cloud, tarik data server di
       latar belakang. load() sengaja sinkron dan memakai cache lokal
       supaya boot tidak menunggu jaringan; tanpa panggilan ini data
       server tidak pernah sampai kecuali penggunanya login ulang. */
    hydrateFromCloud(next => { setDb(next); render(); });
  }

  markSvgFilterSupport();
  window.addEventListener('load', iconFallback);
  daftarkanSW();
  console.info('[Pastels] siap · penyimpanan:', DS.adapter.id);
}

boot();

/* =========================================================
   SERVICE WORKER
   Hanya jalan di https (atau localhost). Dari file:// dilewati
   supaya tidak melempar error saat dev.html dibuka langsung.
   ========================================================= */
function daftarkanSW(){
  if(!('serviceWorker' in navigator)) return;
  const aman = location.protocol === 'https:' || location.hostname === 'localhost';
  if(!aman) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.info('[Pastels] offline siap'))
      .catch(e => console.warn('[Pastels] service worker gagal:', e && e.message));
  });
}

})();
