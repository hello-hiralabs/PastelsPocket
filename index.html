<!DOCTYPE html>

<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      milk:'#FFFDF9', card:'#FFFDFB', edge:'#F3E7EA', ink:'#5A4E4D', soft:'#8C7F7E',
      berry:'#FF9EAA', blush:'#FFC0D3', matcha:'#E2F0D9', leaf:'#A3C79B', butter:'#FFF3CD', lav:'#E8D8E8'
    },
    fontFamily: {
      hand: ['"Shantell Sans"','"Comic Sans MS"','cursive'],

<style>
  :root{
    --ink:#5A4E4D; --edge:#F3E7EA; --soft:#8C7F7E;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
  }
  html{ -webkit-text-size-adjust:100%; }

  body{
    background-color:#FFFDF9;
    background-image:
      radial-gradient(circle at 62% 10%, rgba(255,192,211,.30) 0, transparent 26%),
      radial-gradient(circle at 8% 88%, rgba(226,240,217,.55) 0, transparent 24%),
      radial-gradient(circle, rgba(255,176,199,.26) 1.3px, transparent 1.4px),
      linear-gradient(rgba(232,216,232,.55) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 22px 22px, 100% 30px;
    background-attachment: fixed, fixed, fixed, fixed;
    color:#5A4E4D;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  input, select, textarea, button{ font-size:16px; color:var(--ink); font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2.5px solid #FF9EAA; outline-offset:1px; border-radius:12px;
  }
  /* input nominal besar: harus boleh menyusut di dalam flex */
  /* Kolom nominal besar.
     Yang bikin kelihatan "terpotong" bukan input-nya, tapi outline fokus:
     dia digambar di luar kotak input, lalu kena clip oleh overflow:hidden
     milik pembungkusnya, jadi cuma sisa potongan sudutnya yang muncul.
     Solusinya: outline input dimatikan, cincin fokus dipindah ke
     pembungkus pakai :focus-within, jadi tidak ada yang bisa mengkliping. */
  .bigamt{ min-width:0; width:100%; flex:1 1 0%; }
  .bigamt:focus-visible, .bigamt:focus{ outline:none; box-shadow:none; }
  .amtbox{ min-width:0; border-radius:14px; padding:2px 6px; margin:-2px -6px;
    transition:box-shadow .16s ease, background-color .16s ease; }
  .amtbox:focus-within{ box-shadow:0 0 0 2.5px #FF9EAA; background:rgba(255,255,255,.45); }
  /* tombol kategori: tinggi seragam walau labelnya dua baris */
  .catbtn{ min-height:86px; justify-content:flex-start; }
  ::placeholder{ color:#C6B6BA; }
  .money{ font-variant-numeric:tabular-nums; letter-spacing:-.4px; }
  .hand{ font-family:'Shantell Sans','Comic Sans MS',cursive; }

  /* ---------- Efek STIKER untuk ikon ---------- */
  .stk{
    display:inline-grid; place-items:center; flex:none;
    background:#fff;
    border:2.5px solid var(--tone,#FFD9E4);
    box-shadow: 0 3px 0 var(--tone,#FFD9E4), 0 7px 14px rgba(200,150,175,.18);
    transform: rotate(var(--rot,0deg));
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .stk iconify-icon{ display:block; line-height:0; }
  button:active > .stk, .stk-press:active .stk{ transform: rotate(var(--rot,0deg)) scale(.9); }

  /* ---------- Kartu kertas ---------- */
  .paper{
    position:relative; background:#fff;
    border:2px solid #F1E4E8; border-radius:26px;
    box-shadow: 0 4px 0 #FBF0F4, 0 10px 24px rgba(197,150,170,.12);
  }
  .ruled{
    background-image: repeating-linear-gradient(transparent 0 27px, #F6E7ED 27px 28px);
    background-position: 0 6px;
  }

  /* ---------- Washi tape (motif dari variabel --tape) ---------- */
  .tape{ position:relative; }
  .tape::before{
    content:""; position:absolute; z-index:2;
    top:-13px; left:var(--tx,24px);
    width:var(--tw,92px); height:26px;
    transform: rotate(var(--tr,-6deg));
    background: var(--tape, linear-gradient(rgba(255,224,138,.95), rgba(255,247,220,.92)));
    opacity:.9;
    box-shadow:0 2px 5px rgba(200,150,175,.16);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3px, #000 calc(100% - 3px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 3px, #000 calc(100% - 3px), transparent 100%);
  }
  .swatch{ height:30px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 2px 5px rgba(150,110,130,.16); }

  /* ---------- Gelembung bicara ---------- */
  .bubble{
    position:relative; background:#fff; border:2.5px solid #FFD9E4;
    border-radius:20px 20px 20px 6px; padding:.5rem .8rem;
    box-shadow:0 3px 0 #FFE7EE;
  }
  .bubble::after{
    content:""; position:absolute; left:-9px; bottom:6px;
    width:12px; height:12px; background:#fff;
    border-left:2.5px solid #FFD9E4; border-bottom:2.5px solid #FFD9E4;
    transform: rotate(45deg) skew(6deg,6deg); border-radius:0 0 0 4px;
  }

  /* ---------- Tombol clay ---------- */
  .clay{
    --c1:#FFB7C6; --c2:#FF8299; --c3:#E4718A;
    --cg:rgba(255,130,155,.40); --ci:rgba(206,92,118,.32); --ct:#fff;
    background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 82%);
    color:var(--ct); border-radius:999px;
    box-shadow:
      0 9px 0 var(--c3),
      0 18px 26px var(--cg),
      inset 0 4px 7px rgba(255,255,255,.62),
      inset 0 -7px 11px var(--ci);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .clay:active{
    transform: translateY(7px);
    box-shadow: 0 2px 0 var(--c3), 0 6px 12px var(--cg),
      inset 0 3px 6px rgba(255,255,255,.5), inset 0 -4px 8px var(--ci);
  }
  .clay-boing{ animation: boing .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes boing{ 0%{transform:translateY(7px) scale(.94)} 45%{transform:translateY(-5px) scale(1.06)} 100%{transform:translateY(0) scale(1)} }
  .clay-mint{ --c1:#C0DCB4; --c2:#A3C79B; --c3:#7FA878; --cg:rgba(140,180,155,.36); --ci:rgba(110,150,125,.30); --ct:#46593F; }
  .clay-gold{ --c1:#FBE7AE; --c2:#E8C665; --c3:#D9A845; --cg:rgba(220,180,100,.36); --ci:rgba(190,145,60,.30); --ct:#6B5220; }
  /* mode atur urutan */
  .sortrow{ background:#fff; border:2.5px solid #F1E4E8; border-radius:20px; box-shadow:0 3px 0 #FBF0F4; }
  .sortbtn{ width:34px; height:30px; display:grid; place-items:center; border-radius:11px;
    background:#FFFDFB; border:2px solid #F3E7EA; font-weight:800; font-size:13px; color:#8C7F7E;
    transition:transform .14s ease; }
  .sortbtn:active{ transform:scale(.88); }
  .sortbtn[disabled]{ opacity:.32; }

  /* ---------- Navigasi bawah ---------- */
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:.35rem 0 .1rem; }
  .navlab{ font-family:'Shantell Sans',cursive; font-size:10.5px; font-weight:700; color:#C4B2BE; transition:color .2s ease; }
  .navbox{
    width:46px; height:38px; display:grid; place-items:center; border-radius:15px;
    background:transparent; border:2.5px solid transparent;
    transition:all .24s cubic-bezier(.34,1.56,.64,1);
  }
  .navbtn[aria-current="page"] .navlab{ color:#E8788C; }
  .navbtn[aria-current="page"] .navbox{
    background:#fff; border-color:#FFD2E0; transform:translateY(-4px) rotate(-3deg);
    box-shadow:0 3px 0 #FFD2E0, 0 0 0 5px rgba(255,192,211,.28), 0 10px 18px rgba(255,158,178,.34);
  }
  .navbtn[aria-current="page"] iconify-icon{ filter: drop-shadow(0 2px 3px rgba(255,140,170,.45)); }

  /* ---------- Toggle bahasa ---------- */
  .langpill{
    display:flex; align-items:center; gap:2px; padding:3px;
    background:#fff; border:2.5px solid #E8D8E8; border-radius:999px;
    box-shadow:0 3px 0 #E8D8E8; transform:rotate(2deg);
  }
  .langpill button{
    display:flex; align-items:center; gap:3px;
    padding:.18rem .42rem; border-radius:999px;
    font-family:'Shantell Sans',cursive; font-weight:700; font-size:11px; color:#B4A9C4;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);
  }
  .langpill button[aria-pressed="true"]{ background:#FFEAF0; color:#E4718A; box-shadow:0 1px 0 #FFD2E0; }

  /* ---------- Elemen umum ---------- */
  .field{ background:#FFFDFB; border:2px solid #F3E7EA; border-radius:16px; padding:.55rem .8rem; width:100%; }
  .flatfield{ background:transparent; border:0; border-bottom:2.5px dotted #EDDCE3; border-radius:0; padding:.25rem 0; width:100%; }
  .track{ background:#FCF4F7; border-radius:999px; overflow:hidden; border:2px solid #fff; box-shadow:inset 0 1px 3px rgba(200,150,175,.14); }
  .fill{ height:100%; border-radius:999px; transition:width .55s cubic-bezier(.22,1,.36,1);
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.34) 0 6px, transparent 6px 13px); }
  .chip{ border:2px solid #F3E7EA; background:#FFFDFB; border-radius:999px; padding:.35rem .7rem; font-weight:700; font-size:12.5px; }
  .dashed{ border:2.5px dashed #EFDFE5; }
  .catbtn{ border:2.5px solid transparent; background:#FFFDFB; border-radius:20px; padding:.55rem .2rem;
    display:flex; flex-direction:column; align-items:center; gap:4px; transition:transform .16s ease, border-color .16s ease; }
  .catbtn:active{ transform:scale(.93); }
  .catbtn[aria-pressed="true"]{ border-color:#FF9EAA; background:#FFF4F7; box-shadow:0 3px 0 #FFD2E0; }

  .sheet{ animation:up .32s cubic-bezier(.22,1,.36,1); }
  @keyframes up{ from{ transform:translateY(38px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  .pop{ animation:pop .38s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{ from{ transform:scale(.78) rotate(-8deg); opacity:0 } to{ transform:scale(1) rotate(0); opacity:1 } }
  .hop{ animation:hop 3.6s ease-in-out infinite; }
  @keyframes hop{ 0%,72%,100%{ transform:translateY(0) } 80%{ transform:translateY(-6px) } 88%{ transform:translateY(0) } 93%{ transform:translateY(-3px) } }
  .locked{ filter:grayscale(1) opacity(.4); }
  /* ---------- animasi kucing & kamarnya ---------- */
  .cs-svg{ display:block; width:100%; height:auto; }
  .cs-svg *{ transform-box:fill-box; }
  .cs-breathe{ transform-origin:50% 100%; animation:csBreathe 4.4s ease-in-out infinite; }
  .cs-breathe-fast{ transform-origin:50% 100%; animation:csBreathe 1.5s ease-in-out infinite; }
  @keyframes csBreathe{ 0%,100%{ transform:scale(1,1) } 50%{ transform:scale(1.018,1.05) } }
  .cs-tail{ transform-origin:4% 88%; animation:csTail 3.6s ease-in-out infinite; }
  .cs-tail-slow{ transform-origin:4% 88%; animation:csTail 5.8s ease-in-out infinite; }
  .cs-tail-flick{ transform-origin:6% 92%; animation:csFlick .8s ease-in-out infinite; }
  @keyframes csTail{ 0%,100%{ transform:rotate(-4deg) } 50%{ transform:rotate(7deg) } }
  @keyframes csFlick{ 0%,100%{ transform:rotate(-11deg) } 50%{ transform:rotate(14deg) } }
  .cs-blink{ transform-origin:50% 55%; animation:csBlink 5.2s ease-in-out infinite; }
  .cs-blink-2{ animation-delay:.1s }
  @keyframes csBlink{ 0%,88%,100%{ transform:scaleY(1) } 93%{ transform:scaleY(.08) } 97%{ transform:scaleY(1) } }
  .cs-pupil{ animation:csPupil 4.2s ease-in-out infinite; }
  @keyframes csPupil{ 0%,64%,100%{ transform:translateX(0) } 72%{ transform:translateX(1.7px) }
    82%{ transform:translateX(-1.7px) } 92%{ transform:translateX(0) } }
  .cs-ear{ transform-origin:50% 100%; animation:csEar 5.8s ease-in-out infinite; }
  .cs-ear-2{ animation-delay:.35s }
  @keyframes csEar{ 0%,84%,100%{ transform:rotate(0) } 88%{ transform:rotate(-11deg) }
    92%{ transform:rotate(4deg) } 96%{ transform:rotate(0) } }
  .cs-knead{ transform-origin:50% 100%; animation:csKnead 1.25s ease-in-out infinite; }
  .cs-knead-2{ animation-delay:.62s }
  @keyframes csKnead{ 0%,100%{ transform:translateY(0) rotate(0) } 50%{ transform:translateY(-2.6px) rotate(-3deg) } }
  .cs-groom{ transform-origin:50% 88%; animation:csGroom 9s ease-in-out infinite; }
  @keyframes csGroom{ 0%,60%,100%{ transform:rotate(0) translate(0,0) }
    67%{ transform:rotate(-15deg) translate(1px,4px) }
    73%{ transform:rotate(-8deg) translate(1px,2px) }
    79%{ transform:rotate(-15deg) translate(1px,4px) }
    88%{ transform:rotate(0) translate(0,0) } }
  .cs-z{ opacity:0; animation:csZ 3.9s ease-out infinite; }
  .cs-z-2{ animation-delay:1.3s } .cs-z-3{ animation-delay:2.6s }
  @keyframes csZ{ 0%{ opacity:0; transform:translate(0,2px) scale(.6) rotate(-6deg) }
    18%{ opacity:.95 } 70%{ opacity:.5 }
    100%{ opacity:0; transform:translate(9px,-22px) scale(1.25) rotate(10deg) } }
  .cs-bob{ animation:csBob 4.6s ease-in-out infinite; }
  .cs-bob-2{ animation:csBob 5.4s ease-in-out infinite; animation-delay:.8s }
  @keyframes csBob{ 0%,100%{ transform:translateY(0) rotate(-2deg) } 50%{ transform:translateY(-5px) rotate(2.5deg) } }
  .cs-glow{ animation:csGlow 4.4s ease-in-out infinite; }
  @keyframes csGlow{ 0%,100%{ opacity:.3 } 50%{ opacity:.62 } }
  .cs-twinkle{ animation:csTwinkle 2.8s ease-in-out infinite; }
  .cs-twinkle-2{ animation-delay:.9s } .cs-twinkle-3{ animation-delay:1.8s }
  @keyframes csTwinkle{ 0%,100%{ opacity:.38 } 50%{ opacity:1 } }
  .cs-steam{ opacity:0; animation:csSteam 3.4s ease-out infinite; }
  .cs-steam-2{ animation-delay:1.1s } .cs-steam-3{ animation-delay:2.2s }
  @keyframes csSteam{ 0%{ opacity:0; transform:translateY(2px) scaleX(.7) }
    25%{ opacity:.75 } 100%{ opacity:0; transform:translateY(-14px) scaleX(1.3) } }
  .cs-peek{ transform-origin:50% 100%; animation:csPeek 5.4s ease-in-out infinite; }
  @keyframes csPeek{ 0%,100%{ transform:translateY(4px) } 14%{ transform:translateY(-3px) }
    46%{ transform:translateY(-4px) } 60%{ transform:translateY(4px) } }
  .cs-shiver{ animation:csShiver 1.4s ease-in-out infinite; }
  @keyframes csShiver{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-.9px) } 75%{ transform:translateX(.9px) } }
  .cs-drop{ opacity:0; animation:csDrop 3.2s ease-in infinite; }
  @keyframes csDrop{ 0%{ opacity:0; transform:translateY(-3px) scale(.6) } 20%{ opacity:.9 }
    70%{ opacity:.9; transform:translateY(6px) scale(1) } 100%{ opacity:0; transform:translateY(10px) scale(.9) } }
  .cs-dust{ opacity:0; animation:csDust 7s linear infinite; }
  .cs-dust-2{ animation-delay:2.4s } .cs-dust-3{ animation-delay:4.8s }
  @keyframes csDust{ 0%{ opacity:0; transform:translate(0,0) } 20%{ opacity:.5 }
    80%{ opacity:.32 } 100%{ opacity:0; transform:translate(-10px,-20px) } }
  .cs-tick{ transform-origin:50% 100%; animation:csTick 12s steps(12) infinite; }
  @keyframes csTick{ from{ transform:rotate(0) } to{ transform:rotate(360deg) } }
  .hide-scroll::-webkit-scrollbar{ display:none; }
  .hide-scroll{ -ms-overflow-style:none; scrollbar-width:none; }

  /* transisi halus saat ganti bahasa */
  #hdr, #view, #nav{ transition: opacity .17s ease, transform .17s ease; }
  body.langswap #hdr, body.langswap #view, body.langswap #nav{ opacity:.15; transform:translateY(4px); }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body class="antialiased">

<div class="mx-auto w-full max-w-[480px] min-h-screen">
  <header id="hdr" style="padding-top:calc(var(--st) + 12px)" class="sticky top-0 z-30 px-4 pb-3 bg-[#FFFDF9]/90 backdrop-blur-xl border-b-2 border-[#F6E7ED]"></header>
  <main id="view" class="px-4 pt-5" style="padding-bottom:calc(var(--sb) + 138px)"></main>
</div>

<div id="fabWrap" class="fixed left-1/2 -translate-x-1/2 z-40" style="bottom:calc(var(--sb) + 92px)">
  <button id="fab" data-act="fab" class="clay px-6 h-[56px] flex items-center gap-2.5 hand font-bold text-[16px]">
    <span id="fabIcon"></span> <span id="fabText"></span>
  </button>
</div>

<nav id="nav" style="padding-bottom:calc(var(--sb) + 6px)"
  class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 px-2 pt-1.5 bg-white/95 backdrop-blur-xl border-t-2 border-[#F6E7ED] flex"></nav>

<div id="modal" class="fixed inset-0 z-50 hidden"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[70] hidden" style="bottom:calc(var(--sb) + 162px)"></div>
<canvas id="confetti" class="fixed inset-0 z-[80] pointer-events-none hidden"></canvas>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>

function t(s){ return LANG==='en' ? (EN[s]!==undefined?EN[s]:s) : s; }
function tf(s){
  let o=t(s);
  for(let i=1;i<arguments.length;i++) o=o.split('{'+(i-1)+'}').join(arguments[i]);
  return o;
}

function migrate(d){

    const M=d.months[k]||{};

    M.tx=Array.isArray(M.tx)?M.tx:[];
    M.tx.forEach(t2=>{t2.id=t2.id||uid();t2.amount=num(t2.amount);t2.cat=t2.cat||'lain';

  if(owned.indexOf('pink')<0) owned.push('pink');
  d.washi={ owned, main: WMAP[w.main]?w.main:'yellow', goal: WMAP[w.goal]?w.goal:'pink' };

  const ev=(d.env&&typeof d.env==='object')?d.env:{};

function touchStreak(){
  const d=today(), st=db.streak;
  if(st.last===d) return false;
  if(st.last&&dayDiff(st.last,d)===1) st.count=num(st.count)+1; else st.count=1;
  st.last=d; st.best=Math.max(num(st.best),st.count);
  return true;
}
function ctx(){
  return { txCount:txCountAll(), best:num(db.streak.best), streak:num(db.streak.count),
    goals:db.goals.length, maxPct:maxGoalPct(), saved:totalSaved(),
    iritDay:!!db.stats.iritDay, pagi:!!db.stats.pagi };
}
function checkBadges(c){
  c=c||ctx(); const fresh=[];
  BADGES.forEach(b=>{ if(!db.badges[b.id]&&b.t(c)){ db.badges[b.id]=today(); fresh.push(b); } });
  return fresh;
}
function washiMet(w,c){
  const nd=w.need; if(!nd) return true;
  if(nd.k==='streak')  return c.best>=nd.v;
  if(nd.k==='log')     return c.txCount>=nd.v;
  if(nd.k==='goal50')  return c.maxPct>=50;
  if(nd.k==='goal100') return c.maxPct>=100;
  if(nd.k==='saved')   return c.saved>=nd.v;
  return false;
}
function checkWashi(c){
  c=c||ctx(); const fresh=[];
  WASHI.forEach(w=>{
    if(db.washi.owned.indexOf(w.id)<0 && washiMet(w,c)){ db.washi.owned.push(w.id); fresh.push(w); }
  });
  return fresh;
}

let queue=[];
function collectRewards(){
  const c=ctx();
  queue = queue.concat(checkBadges(c).map(b=>({type:'badge',data:b})))
               .concat(checkWashi(c).map(w=>({type:'washi',data:w})));
}
function flushQueue(){
  if(!queue.length) return false;
  const it=queue.shift();
  if(it.type==='badge') celebrateBadge(it.data); else celebrateWashi(it.data);
  return true;
}

let confRAF=null;
function heartPath(x,s){
  x.beginPath(); x.moveTo(0,s*.32);
  x.bezierCurveTo(0,s*.05,-s*.5,-s*.1,-s*.5,-s*.35);
  x.bezierCurveTo(-s*.5,-s*.68,-s*.12,-s*.7,0,-s*.42);
  x.bezierCurveTo(s*.12,-s*.7,s*.5,-s*.68,s*.5,-s*.35);
  x.bezierCurveTo(s*.5,-s*.1,0,s*.05,0,s*.32);
  x.closePath();
}
function starPath(x,s){
  x.beginPath();
  for(let i=0;i<10;i++){
    const r=(i%2?s*.22:s*.55), a=(Math.PI/5)*i-Math.PI/2;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();
}
function confetti(strong){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'), x=cv.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2), W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(dpr,0,0,dpr,0,0); cv.classList.remove('hidden');
  const cols=['#FF9EAA','#FFC0D3','#A3C79B','#F5D96B','#E8D8E8','#93AEC2','#FFFFFF','#F2D7B6'];
  const N=strong?120:72, P=[];
  for(let i=0;i<N;i++){
    const r=Math.random();
    P.push({ x:W*(.14+Math.random()*.72), y:H*(.34+Math.random()*.12),
      vx:(Math.random()-.5)*8, vy:-(6+Math.random()*8.5), g:.27+Math.random()*.12,
      s:9+Math.random()*11, r:Math.random()*6.28, vr:(Math.random()-.5)*.3,
      c:cols[(Math.random()*cols.length)|0], shape: r<.34?'heart':(r<.6?'star':'tape') });
  }
  const t0=performance.now();
  cancelAnimationFrame(confRAF);
  (function frame(tm){
    const el=tm-t0;
    x.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=.995;
      const a=el>1250?Math.max(0,1-(el-1250)/720):1;
      x.save(); x.globalAlpha=a; x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
      if(p.shape==='heart') heartPath(x,p.s);
      else if(p.shape==='star') starPath(x,p.s);
      else { x.beginPath(); x.rect(-p.s*.3,-p.s*.5,p.s*.6,p.s); }
      x.fill(); x.restore();
    });
    if(el<2000) confRAF=requestAnimationFrame(frame);
    else { x.clearRect(0,0,W,H); cv.classList.add('hidden'); }
  })(t0);
}

function pth(d, fill, stroke, w, extra){
  return '<path d="' + d + '" fill="' + (fill || 'none') + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="' + (w || 2.2) + '" stroke-linecap="round" stroke-linejoin="round"' : '') +
    (extra || '') + '/>';
}
function strk(d, stroke, w, extra){
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2.2) +
    '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}
function n1(v){ return (Math.round(v * 10) / 10).toString(); }

/* Siluet berbulu: separuh atas elips dipecah jadi gelombang.
   amp = tinggi gelombang, jadi kucing gembul terlihat beda
   siluetnya dari kucing berbulu pendek.                      */
function blob(w, h, n, amp, bot){
  var P = function(t){ return [-w * Math.cos(Math.PI * t), -h * Math.sin(Math.PI * t)]; };
  var d = 'M' + n1(-w) + ' 0', i;
  for(i = 1; i <= n; i++){
    var t1 = i / n, tm = (i - .5) / n;
    var p1 = P(t1), pm = P(tm);
    var nx = pm[0] / (w * w), ny = pm[1] / (h * h);
    var len = Math.sqrt(nx * nx + ny * ny) || 1;
    d += ' Q' + n1(pm[0] + nx / len * amp) + ' ' + n1(pm[1] + ny / len * amp) +
         ' ' + n1(p1[0]) + ' ' + n1(p1[1]);
  }
  if(bot === 'round')    d += ' C' + n1(w * .94) + ' ' + n1(h * .6) + ' ' + n1(-w * .94) + ' ' + n1(h * .6) + ' ' + n1(-w) + ' 0';
  else if(bot === 'sag') d += ' Q0 ' + n1(h * .2) + ' ' + n1(-w) + ' 0';
  else                   d += ' L' + n1(-w) + ' 0';
  return d + ' Z';
}

/* warna kaki & ekor ikut corak: tuksedo putih, siam gelap */
function pawCol(C){ return C.mark === 'tuxedo' ? CAT_WHITE : (C.mark === 'point' ? C.point : C.fur); }
function tipCol(C){ return C.mark === 'point' ? C.point : C.fur; }

/* garis gerak ala stiker — dipakai saat kucing panik */
function motion(x, y, dir, n, col){
  var o = '', i;
  for(i = 0; i < n; i++)
    o += strk('M' + n1(x + dir * i * 2.5) + ' ' + n1(y + i * 5.5) + ' l' + n1(dir * 7) + ' ' + n1(-1.5),
      col, 1.9, ' opacity=".5"');
  return o;
}

/* =========================================================
   TELINGA — empat bentuk, dibedakan tinggi & lengkungnya
   ========================================================= */
function earPath(C, F, s){
  var hw = F.hw, hh = F.hh;
  var p = function(a, b){ return n1(s * hw * a) + ' ' + n1(hh * b); };
  if(C.ears === 'small')
    return 'M' + p(.18, -.88) + ' L' + p(.92, -1.22) + ' L' + p(.94, -.52) + ' Z';
  if(C.ears === 'big')
    return 'M' + p(.1, -.94) + ' L' + p(.74, -2.02) + ' L' + p(1.0, -.5) + ' Z';
  if(C.ears === 'fold')
    return 'M' + p(.2, -.86) + ' L' + p(.6, -1.34) + ' Q' + p(1.08, -1.3) + ' ' + p(.98, -.92) +
           ' L' + p(.96, -.5) + ' Z';
  return 'M' + p(.16, -.9) + ' L' + p(.78, -1.66) + ' L' + p(.98, -.52) + ' Z';
}
function catEars(C, F){
  var o = '', s, i;
  for(i = 0; i < 2; i++){
    s = i ? 1 : -1;
    var d = earPath(C, F, s);
    /* siam telinganya gelap, belang tiga sebelah kiri belang oranye */
    var col = C.mark === 'point' ? C.point : (C.mark === 'calico' && s < 0 ? C.patchA : C.fur);
    var bx = s * F.hw * .58, by = -F.hh * .72;
    o += '<g class="cs-ear' + (i ? ' cs-ear-2' : '') + '">' +
      pth(d, col, C.line, 2.1) +
      '<g transform="translate(' + n1(bx) + ',' + n1(by) + ') scale(.52) translate(' + n1(-bx) + ',' + n1(-by) + ')">' +
      pth(d, C.ear) + '</g></g>';
  }
  return o;
}

/* =========================================================
   MATA — besar ala stiker, dua kilau, pupil bulat atau sipit
   ========================================================= */
function catEyes(C, F, mode){
  var ex = F.hw * .44, ey = -F.hh * .04, r = F.er;
  var garis = (C.mark === 'solid' || C.mark === 'point') ? '#FFFDF9' : '#8C7F7E';
  var o = '', i;
  if(mode === 'tidur' || mode === 'senang'){
    for(i = 0; i < 2; i++){
      var s = i ? 1 : -1, cx = s * ex;
      var d = mode === 'tidur'
        ? 'M' + n1(cx - r * .78) + ' ' + n1(ey - 1) + ' q' + n1(r * .78) + ' ' + n1(r * .82) + ' ' + n1(r * 1.56) + ' 0'
        : 'M' + n1(cx - r * .78) + ' ' + n1(ey + 2) + ' q' + n1(r * .78) + ' ' + n1(-r * .95) + ' ' + n1(r * 1.56) + ' 0';
      o += '<g class="cs-blink' + (i ? ' cs-blink-2' : '') + '">' + strk(d, garis, 2.6) + '</g>';
    }
    o += '<ellipse cx="' + n1(-ex - r * .75) + '" cy="' + n1(ey + r * .75) + '" rx="' + n1(r * .55) + '" ry="' + n1(r * .34) + '" fill="' + C.ear + '" opacity=".6"/>';
    o += '<ellipse cx="' + n1(ex + r * .75) + '" cy="' + n1(ey + r * .75) + '" rx="' + n1(r * .55) + '" ry="' + n1(r * .34) + '" fill="' + C.ear + '" opacity=".6"/>';
    return o;
  }
  var cemas = mode === 'cemas';
  for(i = 0; i < 2; i++){
    var sg = i ? 1 : -1, x = sg * ex;
    var pr = C.pupil === 'slit'
      ? '<ellipse cx="' + n1(x) + '" cy="' + n1(ey) + '" rx="' + n1(r * .2) + '" ry="' + n1(r * .68) + '" fill="#241F1D"/>'
      : '<ellipse cx="' + n1(x) + '" cy="' + n1(ey) + '" rx="' + n1(r * .38) + '" ry="' + n1(r * .5) + '" fill="#241F1D"/>';
    o += '<g class="cs-blink' + (i ? ' cs-blink-2' : '') + '">' +
      '<circle cx="' + n1(x) + '" cy="' + n1(ey) + '" r="' + n1(r) + '" fill="#FFFDF9" stroke="' + C.line + '" stroke-width="1.8"/>' +
      '<g class="cs-pupil"><circle cx="' + n1(x) + '" cy="' + n1(ey) + '" r="' + n1(r * .8) + '" fill="' + C.eye + '"/>' + pr + '</g>' +
      '<circle cx="' + n1(x + r * .3) + '" cy="' + n1(ey - r * .42) + '" r="' + n1(r * .27) + '" fill="#fff"/>' +
      '<circle cx="' + n1(x - r * .38) + '" cy="' + n1(ey + r * .34) + '" r="' + n1(r * .15) + '" fill="#fff" opacity=".85"/>' +
      (cemas ? strk('M' + n1(x - r * 1.05) + ' ' + n1(ey - r * .8) + ' q' + n1(r * .55) + ' ' + n1(-r * .45) + ' ' + n1(r * 1.1) + ' ' + n1(r * .1), C.line, 1.9) : '') +
      '</g>';
  }
  return o;
}

/* =========================================================
   KEPALA — satu fungsi untuk semua pose, jadi mukanya konsisten
   ========================================================= */
function catHead(C, U, eyes){
  var F = FACE[C.face] || FACE.round;
  var hd = blob(F.hw, F.hh, C.fluff > 1.6 ? 7 : 6, C.fluff * .8, 'round');
  var cid = 'hd' + U + (csSeq++);
  var o = catEars(C, F) + pth(hd, C.fur, C.line, 2.2);

  /* corak muka, dipotong mengikuti bentuk kepala */
  var m = '';
  if(C.mark === 'tabby'){
    m += strk('M' + n1(-F.hw * .34) + ' ' + n1(-F.hh * .96) + ' v' + n1(F.hh * .34) +
              ' M0 ' + n1(-F.hh * 1.02) + ' v' + n1(F.hh * .36) +
              ' M' + n1(F.hw * .34) + ' ' + n1(-F.hh * .96) + ' v' + n1(F.hh * .34), C.shade, 2.4);
    m += pth('M' + n1(-F.hw * .5) + ' ' + n1(F.hh * .18) + ' q' + n1(F.hw * .5) + ' ' + n1(F.hh * .42) + ' ' + n1(F.hw) + ' 0' +
             ' q' + n1(-F.hw * .12) + ' ' + n1(F.hh * .44) + ' ' + n1(-F.hw * .5) + ' ' + n1(F.hh * .44) +
             ' q' + n1(-F.hw * .38) + ' 0 ' + n1(-F.hw * .5) + ' ' + n1(-F.hh * .44) + ' Z', C.fur2, '', 0, ' opacity=".6"');
  } else if(C.mark === 'tuxedo'){
    m += pth('M' + n1(-F.hw * .56) + ' ' + n1(F.hh * .1) + ' q' + n1(F.hw * .56) + ' ' + n1(F.hh * .5) + ' ' + n1(F.hw * 1.12) + ' 0' +
             ' q' + n1(-F.hw * .1) + ' ' + n1(F.hh * .56) + ' ' + n1(-F.hw * .56) + ' ' + n1(F.hh * .56) +
             ' q' + n1(-F.hw * .46) + ' 0 ' + n1(-F.hw * .56) + ' ' + n1(-F.hh * .56) + ' Z', CAT_WHITE);
    m += pth('M' + n1(-F.hw * .14) + ' ' + n1(-F.hh * 1.02) + ' q' + n1(F.hw * .14) + ' -2 ' + n1(F.hw * .28) + ' 0' +
             ' L' + n1(F.hw * .1) + ' ' + n1(F.hh * .12) + ' q' + n1(-F.hw * .1) + ' 2 ' + n1(-F.hw * .2) + ' 0 Z', CAT_WHITE);
  } else if(C.mark === 'point'){
    m += '<ellipse cx="0" cy="' + n1(F.hh * .2) + '" rx="' + n1(F.hw * .86) + '" ry="' + n1(F.hh * .74) + '" fill="' + C.point + '" opacity=".92"/>';
    m += '<ellipse cx="0" cy="' + n1(-F.hh * .12) + '" rx="' + n1(F.hw * 1.05) + '" ry="' + n1(F.hh * .42) + '" fill="' + C.point + '" opacity=".55"/>';
  } else if(C.mark === 'calico'){
    m += pth('M' + n1(-F.hw * 1.1) + ' ' + n1(-F.hh * 1.1) + ' q' + n1(F.hw * .9) + ' ' + n1(-F.hh * .1) + ' ' + n1(F.hw * .95) + ' ' + n1(F.hh * .55) +
             ' q' + n1(-F.hw * .5) + ' ' + n1(F.hh * .5) + ' ' + n1(-F.hw * 1.05) + ' ' + n1(F.hh * .1) + ' Z', C.patchA, '', 0, ' opacity=".95"');
    m += pth('M' + n1(F.hw * .42) + ' ' + n1(-F.hh * 1.16) + ' q' + n1(F.hw * .8) + ' ' + n1(F.hh * .3) + ' ' + n1(F.hw * .55) + ' ' + n1(F.hh * .82) +
             ' q' + n1(-F.hw * .55) + ' ' + n1(-F.hh * .1) + ' ' + n1(-F.hw * .55) + ' ' + n1(-F.hh * .82) + ' Z', C.patchB, '', 0, ' opacity=".95"');
  } else if(C.mark === 'plain'){
    m += pth('M' + n1(-F.hw * .5) + ' ' + n1(F.hh * .16) + ' q' + n1(F.hw * .5) + ' ' + n1(F.hh * .44) + ' ' + n1(F.hw) + ' 0' +
             ' q' + n1(-F.hw * .12) + ' ' + n1(F.hh * .46) + ' ' + n1(-F.hw * .5) + ' ' + n1(F.hh * .46) +
             ' q' + n1(-F.hw * .38) + ' 0 ' + n1(-F.hw * .5) + ' ' + n1(-F.hh * .46) + ' Z', C.fur2, '', 0, ' opacity=".75"');
  } else {
    m += strk('M' + n1(-F.hw * .62) + ' ' + n1(-F.hh * .76) + ' q' + n1(F.hw * .5) + ' ' + n1(-F.hh * .26) + ' ' + n1(F.hw * .95) + ' ' + n1(F.hh * .06), C.shade, 3, ' opacity=".5"');
  }
  if(m) o += '<clipPath id="' + cid + '"><path d="' + hd + '"/></clipPath>' +
             '<g clip-path="url(#' + cid + ')">' + m + '</g>';

  o += pth(hd, 'none', C.line, 2.2);
  o += catEyes(C, F, eyes);

  /* hidung, mulut, kumis */
  var ny = F.hh * .36;
  o += pth('M' + n1(-2.6) + ' ' + n1(ny) + ' L2.6 ' + n1(ny) + ' L0 ' + n1(ny + 2.8) + ' Z', C.nose);
  o += strk('M0 ' + n1(ny + 2.8) + ' q-3.6 3.6 -7 .8 M0 ' + n1(ny + 2.8) + ' q3.6 3.6 7 .8',
        C.mark === 'point' ? '#F0E4D6' : C.nose, 1.6);
  var wl = C.face === 'wedge' ? 13 : 11, wy = F.hh * .3;
  var wc = (C.mark === 'solid' || C.mark === 'point') ? '#FFFDF9' : C.line;
  o += strk('M' + n1(-F.hw * .8) + ' ' + n1(wy) + ' q-6 -1.5 -' + wl + ' -3' +
            ' M' + n1(-F.hw * .8) + ' ' + n1(wy + 4) + ' q-6 1 -' + wl + ' 3' +
            ' M' + n1(F.hw * .8) + ' ' + n1(wy) + ' q6 -1.5 ' + wl + ' -3' +
            ' M' + n1(F.hw * .8) + ' ' + n1(wy + 4) + ' q6 1 ' + wl + ' 3', wc, 1.3, ' opacity=".66"');
  return o;
}

/* =========================================================
   EKOR — enam jenis, tebal & lengkungnya beda-beda
   ========================================================= */
function catTail(C, w, h, pose){
  var t = C.tail, col = tipCol(C), lw = { plume:15, bushy:13, ring:10, tipped:10, point:9, whip:7 }[t] || 10;
  var d, ex, ey;
  if(pose === 'sprawl'){
    ex = w * 1.12; ey = -h * 1.3;
    d = 'M' + n1(w * .84) + ' ' + n1(-h * .2) + ' C' + n1(w * 1.55) + ' ' + n1(-h * .38) +
        ' ' + n1(w * 1.66) + ' ' + n1(-h * 1.0) + ' ' + n1(ex) + ' ' + n1(ey);
  } else if(pose === 'loaf'){
    ex = w * .06; ey = h * .3;
    d = 'M' + n1(w * .8) + ' ' + n1(-h * .12) + ' C' + n1(w * 1.42) + ' ' + n1(h * .2) +
        ' ' + n1(w * .7) + ' ' + n1(h * .48) + ' ' + n1(ex) + ' ' + n1(ey);
  } else {
    ex = w * 1.32; ey = -h * .72;
    d = 'M' + n1(w * .72) + ' ' + n1(h * .04) + ' C' + n1(w * 1.95) + ' ' + n1(h * .14) +
        ' ' + n1(w * 2.1) + ' ' + n1(-h * .44) + ' ' + n1(ex) + ' ' + n1(ey);
  }
  var o = strk(d, C.line, lw + 4) + strk(d, col, lw);
  if(t === 'ring'){
    o += strk(pose === 'loaf'
      ? 'M' + n1(w * 1.16) + ' ' + n1(h * .18) + ' l1 4 M' + n1(w * .82) + ' ' + n1(h * .4) + ' l1 4'
      : 'M' + n1(w * 1.3) + ' ' + n1(-h * .28) + ' l4 1.5 M' + n1(w * 1.48) + ' ' + n1(-h * .7) + ' l4 1',
      C.shade, 3.4);
  }
  if(t === 'tipped' || t === 'point'){
    o += '<circle cx="' + n1(ex) + '" cy="' + n1(ey) + '" r="' + n1(lw * .58) + '" fill="' +
      (t === 'tipped' ? CAT_WHITE : C.point) + '" stroke="' + C.line + '" stroke-width="2"/>';
  }
  if(t === 'plume' || t === 'bushy'){
    o += '<circle cx="' + n1(ex) + '" cy="' + n1(ey) + '" r="' + n1(lw * .72) + '" fill="' + col + '" stroke="' + C.line + '" stroke-width="2.1"/>';
  }
  return o;
}

/* =========================================================
   CORAK BADAN — dipotong mengikuti siluet tiap pose
   ========================================================= */
function catMarks(C, U, pose, body, w, h){
  var id = 'bd' + U + pose + (csSeq++), o = '';
  if(C.mark === 'tabby'){
    var i, k = 4;
    for(i = 0; i < k; i++){
      var x = -w * .58 + i * (w * 1.16 / (k - 1));
      o += strk('M' + n1(x) + ' ' + n1(-h * 1.02) + ' q' + n1(w * .1) + ' ' + n1(h * .34) + ' ' + n1(w * .02) + ' ' + n1(h * .6), C.shade, 3.6, ' opacity=".85"');
    }
  } else if(C.mark === 'tuxedo'){
    o += pth('M' + n1(-w * .5) + ' ' + n1(-h * .5) + ' q' + n1(w * .52) + ' ' + n1(-h * .24) + ' ' + n1(w * 1.02) + ' ' + n1(h * .06) +
             ' q' + n1(-w * .06) + ' ' + n1(h * .66) + ' ' + n1(-w * .52) + ' ' + n1(h * .7) +
             ' q' + n1(-w * .46) + ' ' + n1(-h * .06) + ' ' + n1(-w * .5) + ' ' + n1(-h * .76) + ' Z', CAT_WHITE, '', 0, ' opacity=".96"');
  } else if(C.mark === 'calico'){
    o += pth('M' + n1(-w * 1.05) + ' ' + n1(-h * .5) + ' q' + n1(w * .6) + ' ' + n1(-h * .55) + ' ' + n1(w * .95) + ' ' + n1(-h * .05) +
             ' q' + n1(-w * .35) + ' ' + n1(h * .6) + ' ' + n1(-w * .95) + ' ' + n1(h * .5) + ' Z', C.patchA, '', 0, ' opacity=".95"');
    o += pth('M' + n1(w * .18) + ' ' + n1(-h * 1.12) + ' q' + n1(w * .66) + ' ' + n1(h * .16) + ' ' + n1(w * .72) + ' ' + n1(h * .72) +
             ' q' + n1(-w * .6) + ' ' + n1(h * .24) + ' ' + n1(-w * .78) + ' ' + n1(-h * .34) + ' Z', C.patchB, '', 0, ' opacity=".95"');
    o += pth('M' + n1(-w * .3) + ' ' + n1(h * .34) + ' q' + n1(w * .3) + ' ' + n1(-h * .3) + ' ' + n1(w * .56) + ' ' + n1(h * .06) +
             ' q' + n1(-w * .2) + ' ' + n1(h * .3) + ' ' + n1(-w * .56) + ' ' + n1(-h * .06) + ' Z', C.patchA, '', 0, ' opacity=".8"');
  } else if(C.mark === 'point'){
    o += strk('M' + n1(-w * .7) + ' ' + n1(h * .12) + ' q' + n1(w * .7) + ' ' + n1(h * .3) + ' ' + n1(w * 1.4) + ' 0', C.shade, 3, ' opacity=".35"');
  } else if(C.mark === 'plain'){
    o += strk('M' + n1(-w * .66) + ' ' + n1(-h * .06) + ' q' + n1(w * .66) + ' ' + n1(h * .34) + ' ' + n1(w * 1.3) + ' ' + n1(-h * .04), C.fur2, 3.4, ' opacity=".85"');
  } else {
    o += strk('M' + n1(-w * .5) + ' ' + n1(-h * .94) + ' q' + n1(w * .6) + ' ' + n1(-h * .12) + ' ' + n1(w * 1.05) + ' ' + n1(h * .18), C.shade, 3.6, ' opacity=".5"');
  }
  return '<clipPath id="' + id + '"><path d="' + body + '"/></clipPath>' +
         '<g clip-path="url(#' + id + ')">' + o + '</g>';
}

/* =========================================================
   POSE — ukuran badan & posisi kepala ikut anatomi kucingnya
   ========================================================= */
function bodyGeom(C, pose){
  var B = BUILD[C.build] || BUILD.medium;
  if(pose === 'sprawl') return { w:B.bw * 1.28, h:B.bh * .78, bot:'sag',  n:7 };
  if(pose === 'loaf')   return { w:B.bw * 1.02, h:B.bh * .84, bot:'flat', n:7 };
  return { w:B.bw * .76, h:B.bh * 1.06, bot:'flat', n:6 };
}
function paw(C, x, y, r){
  return pth('M' + n1(x - r) + ' ' + n1(y) + ' q' + n1(r) + ' ' + n1(-r * 1.5) + ' ' + n1(r * 2) + ' 0' +
             ' q' + n1(-r * .1) + ' ' + n1(r * .9) + ' ' + n1(-r) + ' ' + n1(r * .9) +
             ' q' + n1(-r * .9) + ' 0 ' + n1(-r) + ' ' + n1(-r * .9) + ' Z', pawCol(C), C.line, 1.9);
}

function poseSprawl(C, U){
  var g = bodyGeom(C, 'sprawl'), F = FACE[C.face] || FACE.round;
  var body = blob(g.w, g.h, g.n, C.fluff, g.bot);
  var hx = -g.w + F.hw * .5, hy = -g.h * .46;
  var o = '<g class="cs-tail-slow">' + catTail(C, g.w, g.h, 'sprawl') + '</g>';
  o += '<g class="cs-breathe">' + pth(body, C.fur, C.line, 2.2) + catMarks(C, U, 'sprawl', body, g.w, g.h);
  o += '<g class="cs-knead">' + paw(C, -g.w * .28, g.h * .16, 8) + '</g>';
  o += '<g class="cs-knead cs-knead-2">' + paw(C, g.w * .06, g.h * .2, 8) + '</g>';
  o += '</g>';
  o += '<g transform="translate(' + n1(hx) + ',' + n1(hy) + ')">' + catHead(C, U, 'tidur') + '</g>';
  o += '<g fill="' + C.line + '" font-family="Shantell Sans, Comic Sans MS, cursive" font-weight="700" opacity=".85">' +
    '<text class="cs-z" x="' + n1(hx + 14) + '" y="' + n1(hy - 26) + '" font-size="11">z</text>' +
    '<text class="cs-z cs-z-2" x="' + n1(hx + 25) + '" y="' + n1(hy - 34) + '" font-size="14">z</text>' +
    '<text class="cs-z cs-z-3" x="' + n1(hx + 37) + '" y="' + n1(hy - 42) + '" font-size="17">z</text></g>';
  return o;
}

function poseLoaf(C, U){
  var g = bodyGeom(C, 'loaf'), F = FACE[C.face] || FACE.round;
  var body = blob(g.w, g.h, g.n, C.fluff, g.bot);
  var hx = -g.w * .34, hy = -g.h * .82;
  var o = '<g class="cs-tail">' + catTail(C, g.w, g.h, 'loaf') + '</g>';
  o += '<g class="cs-breathe">' + pth(body, C.fur, C.line, 2.2) + catMarks(C, U, 'loaf', body, g.w, g.h);
  o += paw(C, -g.w * .34, g.h * .04, 8.5) + paw(C, g.w * .06, g.h * .04, 8.5);
  o += '<g transform="translate(' + n1(hx) + ',' + n1(hy) + ')"><g class="cs-groom">' + catHead(C, U, 'senang') + '</g></g>';
  o += '</g>';
  return o;
}

function poseSit(C, U){
  var g = bodyGeom(C, 'sit'), F = FACE[C.face] || FACE.round;
  var body = blob(g.w, g.h, g.n, C.fluff, g.bot);
  var hy = -g.h - F.hh * .48;
  var o = '<g class="cs-tail-flick">' + catTail(C, g.w, g.h, 'sit') + '</g>';
  o += '<g class="cs-breathe-fast">' + pth(body, C.fur, C.line, 2.2) + catMarks(C, U, 'sit', body, g.w, g.h);
  o += paw(C, -g.w * .42, g.h * .02, 8.5) + paw(C, g.w * .42, g.h * .02, 8.5);
  o += '<g transform="translate(0,' + n1(hy) + ')">' + catHead(C, U, 'melek') + '</g>';
  o += '</g>';
  o += motion(g.w * 1.5, -g.h * .5, 1, 3, C.line);
  o += '<path class="cs-drop" d="M' + n1(g.w * .9) + ' ' + n1(hy - 12) + ' q3.4 5.4 0 7.4 q-3.4 -2 0 -7.4 z" fill="#93AEC2"/>';
  o += '<g transform="translate(' + n1(-g.w * 1.12) + ',' + n1(hy - 14) + ')"><g class="cs-bob">' +
    strk('M0 -6 V4', '#FF8299', 3) + '<circle cy="8" r="1.9" fill="#FF8299"/></g></g>';
  return o;
}

function posePeek(C, U){

/* =========================================================

   Latar kamar difilter (goyangan cat air), tapi kursi, kucing,
   dan mangkuk TIDAK — biar animasinya tetap ringan di iPhone.

var ROOM_FN = { susu:roomSusu, loteng:roomLoteng, kayu:roomKayu, teras:roomTeras, teh:roomTeh, roti:roomRoti };

function catScene(st, catId){
  if(['lux','chill','watch','box'].indexOf(st) < 0) st = 'chill';
  var C = catId ? catKind(catId) : catPicked();
  var R = ROOMS[C.room] || ROOMS.susu;
  var U = 'cs' + (++csSeq);
  var W = 320, H = 180, bg = '', fg = '';

  bg += (ROOM_FN[C.room] || roomSusu)(R, st, U);

  if(C.room !== 'teras'){
    bg += '<ellipse cx="162" cy="150" rx="112" ry="19" fill="' + R.tile + '" opacity=".8"/>' +
      '<ellipse cx="162" cy="150" rx="112" ry="19" fill="none" stroke="' + R.line + '" stroke-width="2.2"/>' +
      '<ellipse cx="162" cy="150" rx="86" ry="13" fill="none" stroke="' + R.line +
      '" stroke-width="1.6" stroke-dasharray="5 5" opacity=".5"/>';
  }
  bg += '<ellipse cx="162" cy="141" rx="66" ry="9" fill="' + R.line + '" opacity=".14"/>';

  var seat, cx = 160, cy = 104;
  if(R.seat === 'papasan'){ seat = seatPapasan(R, st); cx = 160; cy = 102; }
  else if(R.seat === 'pouf'){ seat = seatPouf(R, st); cx = 160; cy = 106; }
  else { var s = seatFor(R, st, U); seat = s.svg; cx = s.cx; cy = s.cy; }
  if(st === 'box' && (R.seat === 'papasan' || R.seat === 'pouf')) seat = '<g transform="translate(-24,0)">' + seat + '</g>';
  fg += seat;

  if(st === 'box'){
    fg += boxWithCat(C, R, U);
  } else {
    var pose = st === 'lux' ? poseSprawl : (st === 'chill' ? poseLoaf : poseSit);
    fg += '<g transform="translate(' + cx + ',' + cy + ')">' + pose(C, U) + '</g>';
  }
  fg += bowl(R, st);

  if(st !== 'box'){
    fg += '<g fill="' + R.line + '" opacity=".4">' +
      '<circle class="cs-dust" cx="88" cy="86" r="1.6"/>' +
      '<circle class="cs-dust cs-dust-2" cx="216" cy="74" r="1.4"/>' +
      '<circle class="cs-dust cs-dust-3" cx="178" cy="50" r="1.2"/></g>';
  }

  var tint = '';
  if(st === 'watch') tint = '<rect x="-12" y="-12" width="344" height="204" fill="#E8A55A" opacity=".13" style="mix-blend-mode:multiply"/>';
  if(st === 'box')   tint = '<rect x="-12" y="-12" width="344" height="204" fill="#808080" opacity=".42" style="mix-blend-mode:saturation"/>' +
                            '<rect x="-12" y="-12" width="344" height="204" fill="#7A7068" opacity=".1" style="mix-blend-mode:multiply"/>';
  if(st === 'lux')   tint = '<rect x="-12" y="-12" width="344" height="204" fill="url(#wm' + U + ')" opacity=".5"/>';

  var grain = '<rect x="-12" y="-12" width="344" height="204" filter="url(#gr' + U + ')" opacity="' +
    (R.dark ? '.22' : '.14') + '" style="mix-blend-mode:multiply"/>';

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="cs-svg" role="img" aria-label="' +
      esc(catQuote(st, C.id)) + '">' +
    '<defs>' +
      '<filter id="wb' + U + '" x="-8%" y="-8%" width="116%" height="116%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>' +
        '<feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter>' +
      '<filter id="gr' + U + '" x="0%" y="0%" width="100%" height="100%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3"/>' +
        '<feColorMatrix type="saturate" values="0"/></filter>' +
      '<pattern id="tl' + U + '" width="34" height="18" patternUnits="userSpaceOnUse">' +
        '<path d="M17 0 L34 9 L17 18 L0 9 Z" fill="' + R.tile + '" opacity=".6"/></pattern>' +
      '<radialGradient id="lg' + U + '">' +
        '<stop offset="0" stop-color="' + R.glow + '" stop-opacity="' + (R.dark ? '.85' : '.9') + '"/>' +
        '<stop offset="1" stop-color="' + R.glow + '" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="wm' + U + '" cx=".5" cy=".3" r=".8">' +
        '<stop offset="0" stop-color="#FFF6DE" stop-opacity=".55"/>' +
        '<stop offset="1" stop-color="#FFF6DE" stop-opacity="0"/></radialGradient>' +
      '<clipPath id="cp' + U + '"><rect x="0" y="0" width="' + W + '" height="' + H + '"/></clipPath>' +
    '</defs>' +
    '<g clip-path="url(#cp' + U + ')">' +
      '<g filter="url(#wb' + U + ')">' + bg + '</g>' +
      fg + tint + grain +
    '</g></svg>';
}

   9b. RIWAYAT BERTINGKAT & CERITA BULANAN
   ========================================================= */
/* jendela riwayat: 0 = 3 hari terakhir, 1 = seminggu, 2 = sebulan penuh */
const HIST_WIN=[3,7,9999];
function histAnchor(hmk){ return hmk===mkNow() ? today() : hmk+'-'+pad2(daysIn(hmk)); }
function histDates(hmk,lvl){
  const M=MO(hmk), by={};
  M.tx.forEach(x=>{(by[x.date]=by[x.date]||[]).push(x);});
  const all=Object.keys(by).sort().reverse();
  const win=HIST_WIN[clamp(lvl,0,2)], anchor=histAnchor(hmk);
  let shown=all.filter(ds=>dayDiff(ds,anchor)<win);
  /* kalau beberapa hari terakhir kosong, tetap tampilkan catatan terbaru */
  if(!shown.length && all.length) shown=all.slice(0, win===9999?all.length:Math.min(win,all.length));
  return { by, all, shown };
}
function prevMonthWithData(hmk){
  let y=num(hmk.slice(0,4)), m=num(hmk.slice(5,7));
  for(let i=0;i<24;i++){
    m--; if(m<1){ m=12; y--; }
    const k=y+'-'+pad2(m);
    if(db.months[k] && db.months[k].tx && db.months[k].tx.length) return k;
  }
  return null;
}
function storyItems(mk){
  const s=sums(mk), M=MO(mk);
  const per={}; M.tx.forEach(x=>{ if(x.cat==='celengan') return; per[x.cat]=(per[x.cat]||0)+num(x.amount); });
  const rows=Object.keys(per).map(k=>({k,v:per[k]})).sort((a,b)=>b.v-a.v);
  const dayTot={}; M.tx.forEach(x=>{ if(x.cat==='celengan') return; const d=num(x.date.slice(8,10)); dayTot[d]=(dayTot[d]||0)+num(x.amount); });
  const hariAda=Object.keys(dayTot).length, rata=hariAda?s.jajan/hariAda:0;
  const top=rows[0]?catOf(rows[0].k):null;
  const out=[];
  out.push({ i:s.sisa>=0?'glowing-star':'pensive-face', f:s.sisa>=0?'🌟':'🥲',
    h: s.sisa>=0 ? tf('Sisa dompet {0}, boleh banget dipindah ke celengan 💖',rpS(s.sisa))
                 : tf('Pengeluaran lebih gede {0} dari cuan masuk. Bulan depan kita fix ya 🥲',rpS(-s.sisa)) });
  if(top) out.push({ i:top.i, f:top.f, h:tf('Paling banyak kabur ke <b>{0}</b>, totalnya {1}.',esc(cName(top)),rpS(rows[0].v)) });
  out.push({ i:'spiral-calendar', f:'📅', h:tf('Kamu jajan di <b>{0} hari</b>, rata-rata {1} sekali jajan.',hariAda,rpS(rata)) });
  out.push({ i:'money-bag', f:'💰', h:tf('Yang masuk celengan {0} bulan ini.',rpS(s.nabung)) });
  return out;
}
function storyList(items){
  return '<ul>'+items.map(it=>'<li class="flex items-start gap-2.5 py-1.5">'+

}

/* tepi struk bergerigi · dir 1 = gigi ke atas, -1 = gigi ke bawah */
function zig(dir){
  const n=24, step=100/n, h=3;
  let pts = dir>0 ? '0,'+h : '0,0';
  for(let i=0;i<n;i++){
    const x=i*step;
    pts += ' '+(x+step/2).toFixed(2)+','+(dir>0?0:h);
    pts += ' '+(x+step).toFixed(2)+','+(dir>0?h:0);
  }
  pts += dir>0 ? ' 100,'+h : ' 100,0';
  return '<svg viewBox="0 0 100 '+h+'" preserveAspectRatio="none" aria-hidden="true" '+
    'style="display:block;width:100%;height:9px"><polygon points="'+pts+'" fill="#FFFDF7"/></svg>';
}
/* cap jempol kucing */
function pawStamp(size,color){
  const c=color||'#A3C79B';
  return '<svg viewBox="0 0 40 40" width="'+size+'" height="'+size+'" aria-hidden="true">'+
    '<ellipse cx="20" cy="26" rx="11" ry="9" fill="'+c+'"/>'+
    '<ellipse cx="9"  cy="15" rx="4.2" ry="5.2" fill="'+c+'"/>'+
    '<ellipse cx="16" cy="9"  rx="4.2" ry="5.4" fill="'+c+'"/>'+
    '<ellipse cx="24" cy="9"  rx="4.2" ry="5.4" fill="'+c+'"/>'+
    '<ellipse cx="31" cy="15" rx="4.2" ry="5.2" fill="'+c+'"/></svg>';
}

    '<div class="rounded-[22px] p-3.5" style="background:'+bg+';border:2px solid '+tone+'">'+

      '<p class="font-extrabold text-[17px] leading-tight money">'+rpS(val)+'</p></div>';
  html+='<div class="grid grid-cols-2 gap-3 mb-5">'+
    pill('purse','👛',t('Cuan Masuk'),s.masuk,'#F1F8EC','#D3E7C6',-3)+

    pill('money-bag','💰',t('Ketabung'),s.nabung,'#F1F8EC','#D8E8D4',-2)+
    pill('cherry-blossom','🌸',t('Sisa Dompet'),s.sisa,'#FDF5F8','#EBE0EF',3)+
  '</div>';

  html+='<button data-act="share" class="clay w-full py-3.5 mb-5 hand font-bold text-[15.5px]">'+t('Share ke IG Story 📤')+'</button>';

  const per={};
  M.tx.forEach(x=>{ if(x.cat==='celengan') return; per[x.cat]=(per[x.cat]||0)+num(x.amount); });
  const rows=Object.keys(per).map(k=>({k,v:per[k]})).sort((a,b)=>b.v-a.v);
  let catHtml='';
  if(rows.length){
    const max=rows[0].v;
    rows.forEach(r=>{
      const c=catOf(r.k);
      catHtml+='<div class="flex items-center gap-2.5 py-2">'+
        stk(c.i,{size:38,ic:22,tone:c.c,fb:c.f})+
        '<div class="flex-1 min-w-0">'+
          '<div class="flex justify-between mb-1"><span class="hand text-[13.5px] font-semibold">'+esc(cName(c))+'</span>'+
          '<span class="text-[12.5px] font-extrabold money">'+rpS(r.v)+'</span></div>'+
          '<div class="track" style="height:9px"><div class="fill" style="width:'+(r.v/max*100)+'%;background-color:'+c.s+'"></div></div>'+
        '</div></div>';
    });
  } else catHtml='<p class="hand text-[13px] text-soft text-center py-4">'+t('Bulan ini masih bersih, belum ada catatan 🌱')+'</p>';
  html+='<section class="paper tape p-4 pt-5 mb-5" style="'+tapeStyle('main','26px',80,-5)+'">'+
    cardHead(t('Duitmu Lari ke Mana? 👀'),'chart-increasing','#FFD9E4','📊')+catHtml+'</section>';

  const dim=daysIn(mk), first=new Date(num(mk.slice(0,4)),num(mk.slice(5,7))-1,1).getDay();
  const dayTot={};
  M.tx.forEach(x=>{ if(x.cat==='celengan') return; const d=num(x.date.slice(8,10)); dayTot[d]=(dayTot[d]||0)+num(x.amount); });
  const maxD=Math.max(1,...Object.values(dayTot));
  let cal='<div class="grid grid-cols-7 gap-1.5 mb-2">'+HARI_S().map(h=>'<span class="hand text-[10px] text-soft text-center font-bold">'+h+'</span>').join('')+'</div>'+
    '<div class="grid grid-cols-7 gap-1.5">';
  for(let i=0;i<first;i++) cal+='<span></span>';
  for(let d=1;d<=dim;d++){
    const v=dayTot[d]||0, a=v>0?.18+(v/maxD)*.72:0;
    const isToday=mk===mkNow()&&d===new Date().getDate();
    cal+='<div class="aspect-square rounded-[13px] grid place-items-center text-[11px] font-extrabold" '+
      'style="background:'+(v>0?'rgba(255,158,178,'+a.toFixed(2)+')':'#FDF6F9')+';color:'+(a>.55?'#fff':'#B4A3AE')+
      ';border:2px solid '+(isToday?'#FF9EAA':'transparent')+'" title="'+rp(v)+'">'+d+'</div>';
  }
  cal+='</div>';
  html+='<section class="paper tape p-4 pt-5 mb-5" style="'+tapeStyle('goal','30px',74,4)+'">'+
    cardHead(t('Kalender Jajan 📅'),'spiral-calendar','#E6DCEE','📅',
      '<span class="hand text-[11px] text-soft">'+t('makin pink = makin boros')+'</span>')+cal+'</section>';

  html+='<section class="paper tape p-4 pt-5 mb-3" style="'+tapeStyle('main','24px',72,-4)+'">'+
    cardHead(t('Cerita Bulan Ini'),'notebook-with-decorative-cover','#FCE9B8','📔')+
    storyList(storyItems(mk))+'</section>';

  return html;
}

function refresh(){
  const s=sums(mkNow()), jatah=allowance(), spent=spentOn(today());
  const set=(k,v)=>{const el=$('[data-live="'+k+'"]'); if(el) el.textContent=v;};
  set('masuk',rp(s.masuk));
  set('sisa',rpS(wantsLeft()));
  set('left',rp(Math.max(0,jatah-spent)));
  set('spent',tf('Kepake {0}',rpS(spent)));
  const cst=catState(Math.max(0,jatah-spent),jatah);
  set('kata',catQuote(cst));
  const sc=$('[data-live="scene"]');
  if(sc && sc.dataset.cur!==cst){ sc.dataset.cur=cst; sc.innerHTML=catScene(cst); }
  const bar=$('[data-live="bar"]');
  if(bar){ bar.style.width=(jatah>0?clamp(spent/jatah*100,0,100):(spent>0?100:0))+'%'; bar.style.backgroundColor=CAT_COL[cst]; }
  db.goals.forEach(g=>{
    const p=num(g.target)>0?clamp(num(g.saved)/num(g.target)*100,0,100):0;
    set('gs:'+g.id,rpS(g.saved));
    set('gp:'+g.id,Math.round(p)+'%');
    const b=$('[data-live="gb:'+g.id+'"]'); if(b) b.style.width=p+'%';
  });
}
function setLang(l){
  if(l===LANG) return;
  LANG=l;
  try{ localStorage.setItem(LKEY,l); }catch(e){}
  document.body.classList.add('langswap');
  setTimeout(()=>{ render(); document.body.classList.remove('langswap'); },170);
}

function buildStoryCanvas(){
  const W=1080, H=1920;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  const HD=(w,s)=>w+' '+s+'px "Shantell Sans", cursive';
  const PJ=(w,s)=>w+' '+s+'px "Plus Jakarta Sans", sans-serif';
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();};
  const heart=(cx,cy,s,col,rot)=>{
    x.save(); x.translate(cx,cy); x.rotate(rot||0); x.fillStyle=col;
    x.beginPath(); x.moveTo(0,s*.32);
    x.bezierCurveTo(0,s*.05,-s*.5,-s*.1,-s*.5,-s*.35);
    x.bezierCurveTo(-s*.5,-s*.68,-s*.12,-s*.7,0,-s*.42);
    x.bezierCurveTo(s*.12,-s*.7,s*.5,-s*.68,s*.5,-s*.35);
    x.bezierCurveTo(s*.5,-s*.1,0,s*.05,0,s*.32);
    x.closePath(); x.fill(); x.restore();
  };
  const star=(cx,cy,s,col,rot)=>{
    x.save(); x.translate(cx,cy); x.rotate(rot||0); x.fillStyle=col;
    x.beginPath();
    for(let i=0;i<10;i++){ const r=(i%2?s*.4:s), a=(Math.PI/5)*i-Math.PI/2;
      const px=Math.cos(a)*r, py=Math.sin(a)*r; i?x.lineTo(px,py):x.moveTo(px,py); }
    x.closePath(); x.fill(); x.restore();
  };
  const flower=(cx,cy,s,col,mid)=>{
    x.save(); x.translate(cx,cy); x.fillStyle=col;
    for(let i=0;i<5;i++){ x.save(); x.rotate(i*Math.PI*2/5);
      x.beginPath(); x.ellipse(0,-s*.62,s*.34,s*.6,0,0,6.29); x.fill(); x.restore(); }
    x.fillStyle=mid; x.beginPath(); x.arc(0,0,s*.28,0,6.29); x.fill(); x.restore();
  };

  /* kertas jurnal */
  x.fillStyle='#FFFDF9'; x.fillRect(0,0,W,H);
  const glow=x.createLinearGradient(0,0,W,H);
  glow.addColorStop(0,'rgba(255,192,211,.42)'); glow.addColorStop(.5,'rgba(255,243,205,.45)'); glow.addColorStop(1,'rgba(226,240,217,.55)');
  x.fillStyle=glow; x.fillRect(0,0,W,H);
  /* polka dot */
  x.fillStyle='rgba(255,176,199,.26)';
  for(let py=30;py<H;py+=44) for(let px=(Math.round(py/44)%2?22:0)+16;px<W;px+=44){ x.beginPath(); x.arc(px,py,4,0,6.29); x.fill(); }
  /* garis binder + margin + lubang jilid */
  x.strokeStyle='rgba(232,216,232,.60)'; x.lineWidth=2.5;
  for(let ly=300; ly<H-140; ly+=58){ x.beginPath(); x.moveTo(150,ly); x.lineTo(W-70,ly); x.stroke(); }
  x.strokeStyle='rgba(255,192,211,.75)'; x.lineWidth=3;
  x.beginPath(); x.moveTo(150,180); x.lineTo(150,H-120); x.stroke();
  [430,960,1490].forEach(hy=>{
    x.fillStyle='#FFF7F9'; x.beginPath(); x.arc(86,hy,26,0,6.29); x.fill();
    x.strokeStyle='rgba(255,176,199,.55)'; x.lineWidth=3.5; x.stroke();
  });

  /* washi tape miring sesuai motif pilihan */
  const w=WMAP[db.washi.main]||WASHI[0];
  const drawTape=(cx,cy,tw,th,rot)=>{
    x.save(); x.translate(cx,cy); x.rotate(rot);
    x.fillStyle=w.tone; x.globalAlpha=.92; x.fillRect(-tw/2,-th/2,tw,th);
    x.globalAlpha=1;
    x.save(); x.beginPath(); x.rect(-tw/2,-th/2,tw,th); x.clip();
    if(w.pat==='stripe'){ x.fillStyle='rgba(255,255,255,.6)';
      for(let i=-tw;i<tw;i+=26){ x.save(); x.translate(i,0); x.rotate(-.7); x.fillRect(0,-th,11,th*3); x.restore(); } }
    else if(w.pat==='grid'){ x.strokeStyle='rgba(255,255,255,.75)'; x.lineWidth=3;
      for(let i=-tw/2;i<tw/2;i+=22){ x.beginPath(); x.moveTo(i,-th/2); x.lineTo(i,th/2); x.stroke(); }
      for(let j=-th/2;j<th/2;j+=22){ x.beginPath(); x.moveTo(-tw/2,j); x.lineTo(tw/2,j); x.stroke(); } }
    else { x.fillStyle='rgba(255,255,255,.72)';
      for(let i=-tw/2;i<tw/2;i+=30) for(let j=-th/2;j<th/2;j+=30){ x.beginPath(); x.arc(i+15,j+15,6,0,6.29); x.fill(); } }
    x.restore();
    x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(-tw/2,-th/2,tw,6);
    x.restore();
  };
  drawTape(540,168,540,86,-0.055);
  drawTape(958,268,200,52,0.42);

  /* stiker kawaii di pojok */
  heart(120,206,86,'#FFB7C6',-0.22);
  star(986,1064,52,'#F5D96B',0.2);
  flower(112,1706,70,'#FFB9CC','#F5D96B');
  heart(972,1748,66,'#CDE6D5',0.3);
  star(148,1006,38,'#E3D2EC',-0.3);

  const s=sums(mkNow()), jatah=allowance(), spent=spentOn(today());
  const left=Math.max(0,jatah-spent);
  const d=new Date(), nama=db.profile.name||t('Bestie');

  /* judul jurnal */
  x.textAlign='center';
  x.fillStyle='#5A4E4D'; x.font=HD(700,64);
  x.fillText(t('Jurnal Jajan Harianku ✨'),556,262);
  x.fillStyle='#B79FAC'; x.font=PJ(600,38);
  x.fillText(d.getDate()+' '+BULAN()[d.getMonth()]+' '+d.getFullYear(),556,326);

  /* wajah kawaii */
  const fx=556, fy=520, fr=104;
  const over=spent>jatah, tight=!over&&spent>jatah*.75;
  x.fillStyle=over?'#FFCFD8':(tight?'#FCE9B8':'#D3E7C6');
  x.beginPath(); x.arc(fx,fy,fr,0,6.29); x.fill();
  x.strokeStyle='#fff'; x.lineWidth=11; x.stroke();
  x.fillStyle='#5A4E4D';
  x.beginPath(); x.arc(fx-36,fy-14,11,0,6.29); x.fill();
  x.beginPath(); x.arc(fx+36,fy-14,11,0,6.29); x.fill();
  x.fillStyle='rgba(255,158,178,.55)';
  x.beginPath(); x.ellipse(fx-62,fy+22,20,13,0,0,6.29); x.fill();
  x.beginPath(); x.ellipse(fx+62,fy+22,20,13,0,0,6.29); x.fill();
  x.strokeStyle='#5A4E4D'; x.lineWidth=8; x.lineCap='round'; x.beginPath();
  if(over) x.arc(fx,fy+62,30,Math.PI*1.15,Math.PI*1.85);
  else x.arc(fx,fy+26,30,Math.PI*.15,Math.PI*.85);
  x.stroke();

  /* angka utama */
  x.fillStyle='#8C7F7E'; x.font=HD(600,42); x.textAlign='center';
  x.fillText(t('jatah hari ini'),556,712);
  x.fillStyle='#FF8299'; x.font=PJ(800,124);
  x.fillText(rp(left),556,834);

  /* tiga kotak ringkasan */
  const box=(cx,cy,label,val,bg,br)=>{
    x.save(); x.shadowColor='rgba(190,130,155,.18)'; x.shadowBlur=18; x.shadowOffsetY=7;
    x.fillStyle=bg; rr(cx-142,cy,284,204,42); x.fill(); x.restore();
    x.strokeStyle=br; x.lineWidth=5; rr(cx-142,cy,284,204,42); x.stroke();
    x.fillStyle='#8C7F7E'; x.font=HD(600,31); x.textAlign='center'; x.fillText(label,cx,cy+70);
    x.fillStyle='#5A4E4D'; x.font=PJ(800,46); x.fillText(val,cx,cy+140);
  };
  box(258,904,t('total jajan kepake'),rpS(spent),'#FFF1F5','#FBD5E2');
  box(556,904,t('streak'),tf('🔥 {0} hari',num(db.streak.count)),'#FFF8DC','#F7E7B8');
  box(854,904,t('sisa dompet'),rpS(wantsLeft()),'#F1F8EC','#D3E7C6');

  /* kutipan */
  const q=QUOTES()[(d.getDate()+d.getMonth())%QUOTES().length];
  x.save(); x.translate(556,1330); x.rotate(-0.014);
  x.fillStyle='#FFF7D9'; rr(-390,-118,780,236,48); x.fill();
  x.strokeStyle='#F7E7B8'; x.lineWidth=5; rr(-390,-118,780,236,48); x.stroke();
  x.fillStyle='#7A6A62'; x.font=HD(600,41); x.textAlign='center';
  const words=q.split(' '); let line='', ly=-34;
  words.forEach(wd=>{ if(x.measureText(line+wd+' ').width>640){ x.fillText(line.trim(),0,ly); line=wd+' '; ly+=58; } else line+=wd+' '; });
  x.fillText(line.trim(),0,ly);
  x.restore();

  /* baris identitas + watermark */
  x.textAlign='center';
  x.fillStyle='#8C7F7E'; x.font=PJ(600,33);
  x.fillText(nama+' · '+tf('{0} Stiker Kekumpul',Object.keys(db.badges).length),556,1580);
  /* cap jempol kucing */
  x.save(); x.translate(900,1640); x.rotate(-.22); x.globalAlpha=.22; x.fillStyle='#A3C79B';
  x.beginPath(); x.ellipse(0,16,26,21,0,0,6.29); x.fill();
  [[-26,-9,10,12],[-12,-20,10,13],[8,-20,10,13],[22,-9,10,12]].forEach(t2=>{
    x.beginPath(); x.ellipse(t2[0],t2[1],t2[2],t2[3],0,0,6.29); x.fill(); });
  x.restore(); x.globalAlpha=1;
  x.fillStyle='#C9758A'; x.font=HD(700,36); x.textAlign='center';
  x.globalAlpha=.88; x.fillText(t('Logged with Pastels : Your Pocket Bestie 🌸'),556,1806); x.globalAlpha=1;
  return cv;
}

function dataURLtoBlob(u){
  const p=u.split(','), b=atob(p[1]), n=b.length, arr=new Uint8Array(n);
  for(let i=0;i<n;i++) arr[i]=b.charCodeAt(i);
  return new Blob([arr],{type:'image/png'});
}

document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;

  if(el.classList.contains('clay')){ el.classList.remove('clay-boing'); void el.offsetWidth; el.classList.add('clay-boing'); }

  switch(a){
    case 'lang': {
      const inSheet=!$('#modal').classList.contains('hidden');
      setLang(d.l);
      if(inSheet) setTimeout(()=>{ closeSheet(); settingsSheet(); },180);
      break;
    }
    case 'tab': ui.tab=d.tab; if(d.tab!=='save') ui.sortMode=false; render(); window.scrollTo(0,0); break;
    case 'hist-more': ui.histLvl=clamp(num(d.l),0,2); render(); break;
    case 'hist-less': ui.histLvl=0; render(); break;
    case 'hist-month': ui.hmk=d.mk; ui.histLvl=2; render(); break;
    case 'hist-now': ui.hmk=mkNow(); ui.histLvl=0; render(); break;
    case 'go-recap': ui.mk=d.mk; ui.tab='recap'; render(); window.scrollTo(0,0); break;
    case 'mascot': ui.mascot++; renderHeader(); iconFallback(); break;
    case 'settings': settingsSheet(); break;
    case 'close': closeSheet(); if(!flushQueue()) render(); break;
    case 'soon': toast(t('Oke siap, nanti dikabarin ya 💌')); break;
    case 'open-wardrobe': closeSheet(); ui.tab='badge'; render(); setTimeout(()=>{ const s=$$('section').filter(x=>x.textContent.indexOf(t('Lemari Washi Tape 🎀'))>=0)[0]; if(s) s.scrollIntoView({behavior:'smooth',block:'center'}); },120); break;

    case 'wear': {
      db.washi[d.slot]=d.id; save(); render();
      const w=WMAP[d.id];
      toast(LANG==='en' ? (wName(w)+' is on your '+(d.slot==='goal'?'fund cards':'main card')+' 🎀')
                        : ('Motif '+wName(w)+' dipasang di '+(d.slot==='goal'?'kartu celengan':'kartu utama')+' 🎀'));
      break;
    }
    case 'wear-washi': {
      db.washi.main=d.id; save(); closeSheet();
      if(!flushQueue()) render();
      toast(tf('Motif {0} udah dipasang di kartu utama 🎀',wName(WMAP[d.id])));
      break;
    }

    case 'kitty': catPickerSheet(); break;
    case 'set-kitty':
      db.profile.cat=d.id; save(); closeSheet(); render();
      toast(tf('{0} pindah ke kamar barunya 🐾',catKind(d.id).n)); break;
    case 'edit-limit': limitSheet(); break;
    case 'limit-save': {
      const v=num(digits($('#la')?$('#la').value:''));
      if(v<=0){ toast(t('Eh, nominalnya belum diisi 🥺')); return; }
      db.dayLimit[today()]=v; save(); closeSheet(); render();
      toast(tf('Limit hari ini jadi {0} ✨',rp(v))); break;
    }
    case 'limit-auto': delete db.dayLimit[today()]; save(); closeSheet(); render(); toast(t('Balik ke limit otomatis ✨')); break;
    case 'autosplit': {
      ENVS.forEach(e=>{ db.env[e.k].pct=e.def; db.env[e.k].nom=null; });
      save(); render(); toast(t('Amplop udah dibagi 50/30/20 ✨')); break;
    }
    case 'fab': ui.quick.amount=''; quickSheet(); break;
    case 'pick-cat': {
      ui.quick.cat=d.k;
      const cur=$('#qa'); ui.quick.amount=cur?digits(cur.value):'';
      const dt=$('#qd')?$('#qd').value:'', nt=$('#qn')?$('#qn').value:'';
      quickSheet();
      setTimeout(()=>{ if($('#qd')&&dt) $('#qd').value=dt; if($('#qn')&&nt) $('#qn').value=nt; },0);
      break;
    }
    case 'qplus': { const i=$('#qa'); if(i){ i.value=fmt(num(digits(i.value))+num(d.v)); i.focus(); } break; }
    case 'gplus': { const i=$('#ga'); if(i){ i.value=fmt(num(digits(i.value))+num(d.v)); i.focus(); } break; }

    case 'save-tx': {
      const amount=num(digits($('#qa')?$('#qa').value:''));
      if(amount<=0){ toast(t('Eh, nominalnya belum diisi 🥺')); return; }
      const date=($('#qd')&&$('#qd').value)||today();
      const note=($('#qn')&&$('#qn').value)||'';
      const mk=mkOf(date), lain=mk!==mkNow();
      MO(mk).tx.push({id:uid(),date,cat:ui.quick.cat,amount,note,h:new Date().getHours()});
      if(new Date().getHours()<9) db.stats.pagi=true;
      if(spentOn(date)>0&&spentOn(date)<=25000) db.stats.iritDay=true;
      const grew=touchStreak();
      collectRewards();
      ui.hmk=mk; ui.histLvl=lain?2:0;   /* biar catatan baru langsung kelihatan */
      save(); closeSheet(); render();
      const c=catOf(ui.quick.cat);
      if(!flushQueue()){
        const pesan=grew?tf('Streak kamu jadi {0} hari nih. Rajin banget sih! 🔥',db.streak.count)
                        :tf('Sip, jajanmu udah dicatat! Tetep stay on budget ya~ 🌸 Sisa jatah hari ini {0}.',rp(Math.max(0,allowance()-spentOn(today()))));
        celebrate(tf('Noted! {0} buat {1}',rp(amount),cName(c).toLowerCase()),
          lain?tf('Catatan ini masuk ke {0}. Cek di tab Rekap ya 📊',mkLabel(mk)):pesan,
          c.i, c.f, grew&&!lain);
      }
      break;
    }

    case 'add-inc': MO(mkNow()).income.push({id:uid(),date:today(),label:'',amount:0}); save(); render(); break;
    case 'del-inc': { const M=MO(mkNow()); M.income=M.income.filter(x=>x.id!==d.id); save(); render(); break; }
    case 'del-tx': {
      const M=MO(ui.tab==='recap'?ui.mk:(ui.hmk||mkNow()));
      const x2=M.tx.find(x=>x.id===d.id); if(!x2) break;
      if(x2.cat==='celengan'&&x2.goal){ const g=db.goals.find(x=>x.id===x2.goal); if(g) g.saved=Math.max(0,num(g.saved)-num(x2.amount)); }
      M.tx=M.tx.filter(x=>x.id!==d.id);
      save(); render(); break;
    }

    case 'add-goal': {
      const used=db.goals.map(g=>g.e);
      const pick=GOAL_KINDS.filter(k=>used.indexOf(k.i)<0)[0]||GOAL_KINDS[db.goals.length%GOAL_KINDS.length];
      db.goals.push({id:uid(),name:'',e:pick.i,target:0,saved:0,tone:db.goals.length});
      collectRewards(); save(); render(); flushQueue(); break;
    }
    case 'del-goal': db.goals=db.goals.filter(g=>g.id!==d.id); if(db.goals.length<2) ui.sortMode=false; save(); render(); break;
    case 'sort-on': ui.sortMode=true; render(); window.scrollTo(0,0); break;
    case 'sort-done': ui.sortMode=false; save(); render(); toast(t('Urutan celengan udah kesimpen ✨')); break;
    case 'goal-up': case 'goal-down': {
      const i=db.goals.findIndex(g=>g.id===d.id); if(i<0) break;
      const j=a==='goal-up'?i-1:i+1;
      if(j<0||j>=db.goals.length) break;
      const tmp=db.goals[i]; db.goals[i]=db.goals[j]; db.goals[j]=tmp;
      save(); render(); break;
    }
    case 'goal-emoji': emojiSheet(d.id); break;
    case 'set-emoji': { const g=db.goals.find(x=>x.id===d.id); if(g) g.e=d.e; save(); closeSheet(); render(); break; }
    case 'fill-goal': fillGoalSheet(d.id); break;

    case 'save-fill': {
      const amount=num(digits($('#ga')?$('#ga').value:''));
      if(amount<=0){ toast(t('Mau nabung berapa nih? 💰')); return; }
      const g=db.goals.find(x=>x.id===d.id); if(!g) break;
      const before=num(g.target)>0?num(g.saved)/num(g.target)*100:0;
      g.saved=num(g.saved)+amount;
      MO(mkNow()).tx.push({id:uid(),date:today(),cat:'celengan',goal:g.id,amount,note:'Isi celengan '+(g.name||'impian'),h:new Date().getHours()});
      touchStreak(); collectRewards();
      save(); closeSheet(); render();
      const after=num(g.target)>0?num(g.saved)/num(g.target)*100:0;
      if(!flushQueue()){
        let pesan=tf('Selangkah lagi menuju {0}. Proud of you! 💖',g.name||t('Impian'));
        let icon='money-bag', fb='💰';
        if(after>=100){ pesan=tf('Celengan {0} udah full! Saatnya checkout 🎉',g.name||''); icon='party-popper'; fb='🎉'; }
        else if(before<50&&after>=50){ pesan=tf('Setengah jalan! Tinggal {0} lagi. Bisa banget kamu 💪',rpS(Math.max(0,num(g.target)-num(g.saved)))); icon='glowing-star'; fb='🌟'; }
        celebrate(tf('Gokil! Celenganmu nambah {0} 💖',rp(amount)),pesan,icon,fb,after>=50);
      }
      break;
    }

    case 'badge': badgeSheet(d.id); break;
    case 'share': storySheet(); break;
    case 'save-img': {
      const img=$('#storyImg'); if(!img) break;
      const blob0=dataURLtoBlob(img.src);
      const file0=new File([blob0],'pastels-story-'+today()+'.png',{type:'image/png'});
      /* di iPhone, unduhan blob cuma kebuka di tab baru. Lembar Share iOS
         punya "Save Image" jadi lebih pas buat simpan ke galeri. */
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
      if(isIOS && navigator.canShare && navigator.canShare({files:[file0]})){
        navigator.share({ files:[file0] }).catch(()=>toast(t('Tahan gambarnya terus pilih Save ya 🌸')));
        break;
      }
      try{
        const u=URL.createObjectURL(blob0);
        const a2=document.createElement('a'); a2.href=u; a2.download='pastels-story-'+today()+'.png';
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(()=>URL.revokeObjectURL(u),4000);
        toast(t('Udah kesimpen! Cek galeri kamu 💕'));
      }catch(e){ toast(t('Tahan gambarnya terus pilih Save ya 🌸')); }
      break;
    }
    case 'share-img': {
      const img=$('#storyImg'); if(!img) break;
      const blob=dataURLtoBlob(img.src);
      const file=new File([blob],'pastels-story-'+today()+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],text:t('Lagi rajin catat jajan pakai Pastels 🎀')}).catch(()=>{});
      } else if(navigator.clipboard&&window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
          .then(()=>toast(t('Udah kesalin! Tinggal paste 💕'))).catch(()=>toast(t('Tahan gambarnya terus pilih Copy ya 🌸')));
      } else toast(t('Tahan gambarnya terus pilih Share ya 🌸'));
      break;
    }

    case 'step': {
      const y=num(ui.mk.slice(0,4)); let m=num(ui.mk.slice(5,7))+num(d.d), yy=y;
      if(m<1){m=12;yy--;} if(m>12){m=1;yy++;}
      ui.mk=yy+'-'+pad2(m); render(); break;
    }

    case 'set-ava': db.profile.ava=d.e; save(); closeSheet(); render(); settingsSheet(); break;
    case 'export': {
      try{
        const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
        const u=URL.createObjectURL(b);
        const a2=document.createElement('a'); a2.href=u; a2.download='pastels-backup-'+today()+'.json';
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(()=>URL.revokeObjectURL(u),4000);
        toast(t('Backup-nya udah keunduh 💾'));
      }catch(e){ toast(t('Yah, gagal keunduh 🥲')); }
      break;
    }
    case 'import': $('#importFile').click(); break;
    case 'reset-ask':
      sheet('<div class="text-center pb-2">'+
        '<div class="inline-block mb-3">'+stk('pleading-face',{size:76,ic:46,tone:'#FFD9E4',rot:-4,fb:'🥺'})+'</div>'+
        '<h2 class="hand font-bold text-[20px] mb-1">'+t('Yakin mau reset semua? 🥺')+'</h2>'+
        '<p class="text-[13px] text-soft mb-5 px-3">'+t('Semua catatan, celengan, sama stiker kamu bakal hilang. Backup dulu kalau masih sayang.')+'</p>'+
        '<div class="flex gap-2">'+
          '<button data-act="close" class="flex-1 py-3.5 rounded-2xl bg-white hand font-bold text-[15px]" style="border:2.5px solid #F3E7EA;box-shadow:0 3px 0 #FBF0F4">'+t('Nggak jadi')+'</button>'+
          '<button data-act="reset-ok" class="flex-1 py-3.5 rounded-2xl hand font-bold text-[15px]" style="background:#FFC0D3;box-shadow:0 4px 0 #FFAEC2">'+t('Iya, hapus')+'</button>'+
        '</div></div>');
      break;
    case 'reset-ok':
      db=seed(); ui.mk=mkNow(); queue=[]; collectRewards(); queue=[];
      try{ localStorage.setItem(LSKEY,JSON.stringify(db)); }catch(e){}
      closeSheet(); render(); toast(t('Oke, mulai dari nol lagi 🌱')); break;
  }
});

/* ---------------- Input ---------------- */
document.addEventListener('input',function(ev){
  const el=ev.target; if(!el.dataset) return;
  if(el.dataset.money==='1'){
    const atEnd=el.selectionStart===el.value.length;
    const f=digits(el.value)?fmt(digits(el.value)):'';
    if(f!==el.value){ el.value=f; if(atEnd){ try{ el.setSelectionRange(f.length,f.length); }catch(e){} } }
  }
  const field=el.dataset.field; if(!field) return;
  const v=el.dataset.money==='1'?num(digits(el.value)):el.value;
  const p=field.split(':');
  if(p[0]==='env'){
    const e=db.env[p[1]]; if(!e) return;
    if(p[2]==='pct'){ e.pct=clamp(num(digits(el.value)),0,100); e.nom=null; }
    else { e.nom=num(v); }
  }
  else if(p[0]==='inc'){ const r=MO(mkNow()).income.find(x=>x.id===p[1]); if(r) r[p[2]]=p[2]==='amount'?num(v):v; }
  else if(p[0]==='goal'){ const g=db.goals.find(x=>x.id===p[1]); if(g) g[p[2]]=(p[2]==='name')?v:num(v); }
  else if(p[0]==='name'){ db.profile.name=v; }
  save(); refresh();
});
document.addEventListener('focusout',function(ev){
  const el=ev.target;
  if(el.dataset&&el.dataset.money==='1'&&el.dataset.field) el.value=fmt(num(digits(el.value)));
},true);
document.addEventListener('change',function(ev){
  const el=ev.target;
  if(el.id==='importFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){
      try{
        db=migrate(JSON.parse(r.result)); ui.mk=mkNow();
        localStorage.setItem(LSKEY,JSON.stringify(db));
        closeSheet(); render(); toast(t('Yeay, data kamu balik lagi 💕'));
      }catch(e){ toast(t('Duh, filenya nggak kebaca. Pastiin file backup JSON ya 🥺')); }
      el.value='';
    };
    r.onerror=function(){ toast(t('Yah, filenya gagal kebaca 🥲')); el.value=''; };
    r.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.type!=='date'){ ev.preventDefault(); ev.target.blur(); }
  if(ev.key==='Escape'&&!$('#modal').classList.contains('hidden')) closeSheet();
});

/* ---------------- Mulai ---------------- */
db=load();
MO(ui.mk);
collectRewards(); queue=[];   /* hadiah dari data awal langsung dianggap kebuka */
save();
render();
window.addEventListener('load',iconFallback);
})();
</script>
