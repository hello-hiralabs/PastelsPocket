<style>
  :root{
    --ink:#5A4E4D; --edge:#F3E7EA; --soft:#7E7271;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
  }
  html{ -webkit-text-size-adjust:100%; }

  body{
    background-color:#FFFDF9;
    background-image:
      radial-gradient(circle at 62% 10%, rgba(255,192,211,.30) 0, transparent 26%),
      radial-gradient(circle at 8% 88%, rgba(226,240,217,.55) 0, transparent 24%),
      radial-gradient(circle, rgba(255,176,199,.26) 1.3px, transparent 1.4px),
      linear-gradient(rgba(232,216,232,.55) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 22px 22px, 100% 30px;
    background-attachment: fixed, fixed, fixed, fixed;
    color:#5A4E4D;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  input, select, textarea, button{ font-size:16px; color:var(--ink); font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2.5px solid #FF9EAA; outline-offset:1px; border-radius:12px;
  }
  /* input nominal besar: harus boleh menyusut di dalam flex */
  /* Kolom nominal besar.
     Yang bikin kelihatan "terpotong" bukan input-nya, tapi outline fokus:
     dia digambar di luar kotak input, lalu kena clip oleh overflow:hidden
     milik pembungkusnya, jadi cuma sisa potongan sudutnya yang muncul.

function t(s){ return LANG==='en' ? (EN[s]!==undefined?EN[s]:s) : s; }
function tf(s){
  let o=t(s);
  for(let i=1;i<arguments.length;i++) o=o.split('{'+(i-1)+'}').join(arguments[i]);
  return o;
}

/* tepi struk bergerigi · dir 1 = gigi ke atas, -1 = gigi ke bawah */
function zig(dir){
  const n=24, step=100/n, h=3;
  let pts = dir>0 ? '0,'+h : '0,0';
  for(let i=0;i<n;i++){
    const x=i*step;
    pts += ' '+(x+step/2).toFixed(2)+','+(dir>0?0:h);
    pts += ' '+(x+step).toFixed(2)+','+(dir>0?h:0);
  }
  pts += dir>0 ? ' 100,'+h : ' 100,0';
  return '<svg viewBox="0 0 100 '+h+'" preserveAspectRatio="none" aria-hidden="true" '+
    'style="display:block;width:100%;height:9px"><polygon points="'+pts+'" fill="#FFFDF7"/></svg>';
}

/* =========================================================
   SANITASI NOMINAL
   Batas 1 triliun. Di atas itu Number masih presisi, tapi
   Intl.NumberFormat jadi tidak enak dibaca di layar HP dan
   hampir pasti salah ketik.
   ========================================================= */
const AMOUNT_MAX = 1e12;
function sanitizeAmount(v){
  if(typeof v === 'number'){
    if(!isFinite(v)) return 0;
    return Math.min(Math.max(Math.round(v), 0), AMOUNT_MAX);
  }
  const d = String(v == null ? '' : v).replace(/[^\d]/g, '');
  if(!d) return 0;
  /* potong dari kiri: 15 digit sudah lewat batas, jangan sampai jadi Infinity */
  const n = Number(d.slice(0, 15));
  if(!isFinite(n)) return AMOUNT_MAX;
  return Math.min(n, AMOUNT_MAX);
}
/* dipakai oleh input: kembalikan string digit yang sudah dipangkas */
function clampDigits(s){
  const d = String(s == null ? '' : s).replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
  return d.slice(0, 13);
}

/* =========================================================
   PARSING BACKUP YANG AMAN
   JSON.parse melempar untuk teks rusak, tapi yang lebih sering
   terjadi adalah JSON valid dengan bentuk yang salah (misal
   file backup aplikasi lain). Keduanya harus ketahuan sebelum
   data pengguna ditimpa.
   ========================================================= */
const BACKUP_MAX_BYTES = 8 * 1024 * 1024;

function safeParseBackup(raw){
  if(typeof raw !== 'string' || !raw.trim())
    return { ok:false, code:'kosong', error:'Berkasnya kosong.' };
  if(raw.length > BACKUP_MAX_BYTES)
    return { ok:false, code:'kebesaran', error:'Berkasnya lebih dari 8 MB.' };

  let data;
  try{ data = JSON.parse(raw); }
  catch(e){
    const m = /position (\d+)/.exec(e.message || '');
    return { ok:false, code:'rusak',
      error:'Formatnya bukan JSON yang utuh' + (m ? ' (posisi ' + m[1] + ')' : '') + '.' };
  }
  if(!data || typeof data !== 'object' || Array.isArray(data))
    return { ok:false, code:'bukan-objek', error:'Isinya bukan objek data.' };

  /* tanda tangan minimal sebuah backup Pastels */
  const punyaBulan = data.months && typeof data.months === 'object' && !Array.isArray(data.months);
  const punyaProfil = data.profile && typeof data.profile === 'object';
  if(!punyaBulan && !punyaProfil)
    return { ok:false, code:'bukan-pastels', error:'Ini sepertinya bukan backup Pastels.' };

  if(punyaBulan){
    const kunci = Object.keys(data.months);
    const salah = kunci.filter(k => !/^\d{4}-\d{2}$/.test(k));
    if(salah.length)
      return { ok:false, code:'kunci-bulan',
        error:'Ada kunci bulan yang tidak wajar: ' + salah.slice(0,3).join(', ') + '.' };
  }
  return { ok:true, data:data };
}

/* =========================================================
   HAPTIC — getaran halus saat menekan tombol
   Catatan penting: navigator.vibrate TIDAK didukung Safari iOS
   sampai sekarang. Jadi di iPhone ini tidak berefek apa pun;
   yang menikmati cuma pengguna Android. Dibiarkan karena
   biayanya nol dan gagalnya aman.
   ========================================================= */
function hap(ms){
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(navigator && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 10);
  }catch(e){}
}

/* =========================================================
   PROBE FILTER SVG
   Sebagian browser seluler hemat daya mengabaikan
   feDisplacementMap. Yang bisa dideteksi andal hanyalah
   dukungan API-nya, bukan keputusan hemat dayanya — jadi
   adegan kucing juga diberi lapisan warna polos di
   belakangnya supaya tidak pernah kosong.
   ========================================================= */
function svgFilterSupported(){
  try{
    const el = document.createElementNS('http://www.w3.org/2000/svg','feDisplacementMap');
    return typeof SVGFEDisplacementMapElement !== 'undefined' &&
           el instanceof SVGFEDisplacementMapElement;
  }catch(e){ return false; }
}
function markSvgFilterSupport(){
  if(!svgFilterSupported()) document.documentElement.classList.add('no-svgfilter');
}

  function fill(key,dayCount,pocket,bonus){

    if(bonus) M.income.push({id:uid(),date:key+'-14',label:'Hasil freelance',amount:bonus});
    let i=0;
    for(let day=1;day<=dayCount;day++){

      for(let j=0;j<per;j++){

        M.tx.push({id:uid(),date:key+'-'+pad2(day),cat:it[0],amount:it[1],note:it[2],h:9+((i*3)%11)});
      }
    }
    return M;
  }
  d.months[pmk]=fill(pmk,daysIn(pmk),4500000,700000);
  d.months[mk]=fill(mk,Math.max(1,dnow),4500000,600000);
  d.months[mk].tx.push({id:uid(),date:mk+'-'+pad2(Math.max(1,dnow-3)),cat:'celengan',goal:d.goals[0].id,amount:150000,note:'Isi celengan Tiket Konser',h:20});

  d.streak={count:Math.min(2,dnow),best:2,last:today()};
  d.stats={pagi:false,iritDay:true};
  return d;
}

function fixIcon(v,def){
  if(!v) return def;

}
function migrate(d){
  if(!d||typeof d!=='object') return seed();
  d.v=2;
  d.profile=Object.assign({name:'',ava:'cat-face'},d.profile||{});
  d.profile.ava=fixIcon(d.profile.ava,'cat-face');
  d.profile.cat=CKMAP[d.profile.cat]?d.profile.cat:'mochi';
  d.months=(d.months&&typeof d.months==='object')?d.months:{};
  Object.keys(d.months).forEach(k=>{
    const M=d.months[k]||{};
    M.income=Array.isArray(M.income)?M.income:[];
    M.income.forEach(r=>{ r.id=r.id||uid(); r.amount=sanitizeAmount(r.amount); });
    M.tx=Array.isArray(M.tx)?M.tx:[];
    M.tx.forEach(t2=>{t2.id=t2.id||uid();t2.amount=sanitizeAmount(t2.amount);t2.cat=t2.cat||'lain';
      if(CAT_MIGRATE[t2.cat]) t2.cat=CAT_MIGRATE[t2.cat];
      t2.date=t2.date||k+'-01';});
    d.months[k]=M;
  });
  d.goals=Array.isArray(d.goals)?d.goals:[];
  d.goals.forEach(g=>{g.id=g.id||uid();g.target=sanitizeAmount(g.target);g.saved=sanitizeAmount(g.saved);
    g.e=fixIcon(g.e,'money-bag'); if(g.e==='pig-face') g.e='money-bag'; g.tone=num(g.tone);});
  d.streak=Object.assign({count:0,best:0,last:''},d.streak||{});
  d.badges=(d.badges&&typeof d.badges==='object')?d.badges:{};
  d.stats=Object.assign({pagi:false,iritDay:false},d.stats||{});
  /* washi wardrobe */
  const w=d.washi||{};
  let owned=Array.isArray(w.owned)?w.owned.filter(x=>WMAP[x]):[];
  if(owned.indexOf('yellow')<0) owned.unshift('yellow');
  if(owned.indexOf('pink')<0) owned.push('pink');
  d.washi={ owned, main: WMAP[w.main]?w.main:'yellow', goal: WMAP[w.goal]?w.goal:'pink' };
  /* amplop & limit harian */
  const ev=(d.env&&typeof d.env==='object')?d.env:{};
  d.env={};
  ENVS.forEach(e=>{
    const cur=ev[e.k]||{};
    d.env[e.k]={ pct: cur.pct==null?e.def:clamp(num(cur.pct),0,100),
                 nom: (cur.nom==null||cur.nom==='')?null:num(cur.nom) };
  });
  /* pemetaan kategori -> amplop; nilai asing dibuang ke bawaannya */
  const ce=(d.catEnv&&typeof d.catEnv==='object')?d.catEnv:{};
  d.catEnv={};
  CATS.forEach(c=>{
    const v=ce[c.k];
    d.catEnv[c.k]=(v==='bills'||v==='wants'||v==='save')?v:c.env;
  });
  d.dayLimit=(d.dayLimit&&typeof d.dayLimit==='object')?d.dayLimit:{};
  /* buang kunci tanggal yang tidak wajar supaya tidak mengacaukan limit harian */
  Object.keys(d.dayLimit).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || sanitizeAmount(d.dayLimit[k])<=0) delete d.dayLimit[k];
    else d.dayLimit[k]=sanitizeAmount(d.dayLimit[k]);
  });
  /* transaksi berulang */
  d.recurring=Array.isArray(d.recurring)?d.recurring:[];
  d.recurring=d.recurring.filter(r=>r&&typeof r==='object').map(r=>({
    id:r.id||uid(),
    label:typeof r.label==='string'?r.label.slice(0,60):'',
    amount:sanitizeAmount(r.amount),
    cat:CATS.some(c=>c.k===r.cat)?r.cat:'kos',
    day:clamp(num(r.day)||1,1,28),
    active:r.active!==false,
    lastRun:/^\d{4}-\d{2}$/.test(r.lastRun)?r.lastRun:''
  })).slice(0,40);
  return d;
}

/* =========================================================
   DATA SERVICE LAYER
   ---------------------------------------------------------
   Satu-satunya tempat aplikasi menyentuh penyimpanan.
   Seluruh kode lain cuma tahu tiga hal: load(), save(), DS.
   Menukar localStorage dengan Supabase/Firebase berarti
   menukar satu adapter, tanpa menyentuh view atau state.

/* ---------------------------------------------------------
   Kontrak adapter — semua adapter wajib menyediakan ini.
   read()  -> objek db mentah, atau null kalau kosong
   write(d)-> menyimpan, boleh async, boleh gagal
   ---------------------------------------------------------
   interface Adapter {
     id: string
     label: string
     read(): Promise<object|null> | object|null
     write(dbObject): Promise<void> | void
     signIn?(): Promise<User>
     signOut?(): Promise<void>
     user?(): object|null
   }
   --------------------------------------------------------- */

/* ---------- 1. Adapter lokal (dipakai sekarang) ---------- */
const LocalAdapter = {
  id: 'local',
  label: 'Lokal (browser ini)',
  labelEn: 'Local (this browser)',
  read(){
    let raw = null;
    try{ raw = localStorage.getItem(LSKEY); }
    catch(e){ console.warn('[DS] localStorage tidak bisa dibaca:', e && e.name); return null; }
    if(!raw) return null;
    const res = safeParseBackup(raw);
    if(!res.ok){
      /* data rusak: jangan dibuang, sisihkan supaya masih bisa diselamatkan manual */
      console.warn('[DS] data tersimpan rusak:', res.error);
      try{ localStorage.setItem(LSKEY + '-rusak-' + Date.now(), raw.slice(0, 500000)); }catch(e){}
      return null;
    }
    return res.data;
  },
  write(d){
    try{
      localStorage.setItem(LSKEY, JSON.stringify(d));
      return true;
    }catch(e){
      /* QuotaExceededError paling sering; beri pesan yang bisa ditindak */
      const penuh = e && (e.name === 'QuotaExceededError' || e.code === 22);
      toast(t(penuh ? 'Memori browsernya penuh, backup dulu yuk 🥲'
                    : 'Gagal menyimpan. Coba backup datamu 🥲'));
      return false;
    }
  },
  user(){ return null; }
};

/* ---------- 2. Adapter cloud (kerangka, belum aktif) ----------
   Cara mengaktifkan dengan Supabase:

   1) Tambahkan di <head> index.html:
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
      (garis miring di tag penutup sengaja di-escape: <\/script> utuh akan
       menutup tag <script> pembungkus saat berkas ini digabung jadi satu HTML)

   2) Buat tabel di Supabase (SQL editor):
      create table pastels_state (
        user_id uuid primary key references auth.users on delete cascade,
        payload jsonb not null,
        updated_at timestamptz default now()
      );
      alter table pastels_state enable row level security;
      create policy "pemilik saja" on pastels_state
        for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

   3) Isi SUPABASE_URL & SUPABASE_ANON_KEY di bawah, lalu
      DS.use('cloud').
   -------------------------------------------------------------- */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

const CloudAdapter = {
  id: 'cloud',
  label: 'Akun Google (sinkron)',
  labelEn: 'Google account (synced)',
  _sb: null,
  _user: null,
  ready(){
    return !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
  },
  client(){
    if(!this._sb && this.ready())
      this._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return this._sb;
  },
  async signIn(){
    const sb = this.client();
    if(!sb) throw new Error('cloud-belum-disetel');
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google' });
    if(error) throw error;
  },
  async signOut(){
    const sb = this.client();
    if(sb) await sb.auth.signOut();
    this._user = null;
  },
  user(){ return this._user; },
  async read(){
    const sb = this.client();
    if(!sb) return null;
    const { data: sesi } = await sb.auth.getUser();
    this._user = sesi && sesi.user ? sesi.user : null;
    if(!this._user) return null;
    const { data, error } = await sb.from('pastels_state')
      .select('payload').eq('user_id', this._user.id).maybeSingle();
    if(error){ console.warn('[DS] gagal baca cloud:', error.message); return null; }
    return data ? data.payload : null;
  },
  async write(d){
    const sb = this.client();
    if(!sb || !this._user) return false;
    const { error } = await sb.from('pastels_state')
      .upsert({ user_id: this._user.id, payload: d, updated_at: new Date().toISOString() });
    if(error){ console.warn('[DS] gagal tulis cloud:', error.message); return false; }
    return true;
  }
};

/* ---------- 3. Fasad ---------- */
const DS = {
  adapter: LocalAdapter,
  /* tulis ke cloud hanya kalau adapter cloud aktif; lokal selalu ditulis
     sebagai cache offline, jadi aplikasi tetap jalan tanpa jaringan */
  mirrorLocal: true,

  use(id){
    this.adapter = (id === 'cloud' && CloudAdapter.ready()) ? CloudAdapter : LocalAdapter;
    return this.adapter.id;
  },
  isCloud(){ return this.adapter.id === 'cloud'; },
  cloudAvailable(){ return CloudAdapter.ready(); },
  user(){ return this.adapter.user ? this.adapter.user() : null; },
  label(en){ return en ? (this.adapter.labelEn || this.adapter.label) : this.adapter.label; }
};

/* ---------- 4. API yang dipakai aplikasi ---------- */
/* true kalau tidak ada apa pun tersimpan di perangkat ini — dipakai
   boot() buat menawarkan pilihan mulai kosong atau lihat data contoh. */
let perdana = false;

function load(){
  let raw = null;
  try{ raw = DS.adapter.read(); }
  catch(e){ console.warn('[DS] read gagal:', e); raw = null; }
  /* adapter cloud mengembalikan Promise; boot tetap sinkron pakai cache lokal,
     lalu hydrate() menimpanya begitu data cloud sampai */
  if(raw && typeof raw.then === 'function') raw = LocalAdapter.read();
  if(!raw){ perdana = true; return blank(); }
  return migrate(raw);
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const snapshot = db;
    if(DS.mirrorLocal || !DS.isCloud()) LocalAdapter.write(snapshot);
    if(DS.isCloud()){
      Promise.resolve(DS.adapter.write(snapshot)).catch(e => console.warn('[DS] sync:', e));
    }
  }, 200);
}

/* dipanggil setelah login cloud: tarik data server, lalu render ulang */
async function hydrateFromCloud(onDone){
  if(!DS.isCloud()) return false;
  try{
    const remote = await CloudAdapter.read();
    if(remote){ onDone && onDone(migrate(remote)); return true; }
  }catch(e){ console.warn('[DS] hydrate gagal:', e); }
  return false;
}

/* =========================================================
   5. HITUNGAN
   ========================================================= */
function sums(mk){
  const M=MO(mk);
  const masuk=M.income.reduce((a,b)=>a+num(b.amount),0);
  let jajan=0,nabung=0;
  M.tx.forEach(x=>{ if(x.cat==='celengan') nabung+=num(x.amount); else jajan+=num(x.amount); });
  return { masuk, jajan, nabung, sisa:masuk-jajan-nabung };
}
/* Kategori mana masuk amplop mana. Pengguna boleh mengubahnya,
   jadi bacaan utamanya db.catEnv; CAT_ENV hanya nilai bawaan. */
function envOfCat(k){
  if(k==='celengan') return 'save';
  const m=db.catEnv||{};
  return (m[k]==='bills'||m[k]==='wants'||m[k]==='save') ? m[k] : (CAT_ENV[k]||'wants');
}

/* jatah jajan harian hanya dihitung dari kategori beramplop 'wants' */
function spentOn(ds){ return MO(mkOf(ds)).tx.reduce((a,x)=>a+((x.date===ds&&envOfCat(x.cat)==='wants')?num(x.amount):0),0); }
function envSpent(mk,k){ return MO(mk).tx.reduce((a,x)=>a+(envOfCat(x.cat)===k?num(x.amount):0),0); }
function envNom(k,masuk){
  const e=db.env[k]||{}; 
  if(e.nom!=null) return num(e.nom);
  if(masuk==null) masuk=sums(mkNow()).masuk;
  return round100(num(masuk)*num(e.pct)/100);
}
function envPctSum(){ return ENVS.reduce((a,e)=>a+num(db.env[e.k].pct),0); }
function wantsLeft(mk){ mk=mk||mkNow(); return envNom('wants',sums(mk).masuk)-envSpent(mk,'wants'); }
function daysLeft(){ const mk=mkNow(); return Math.max(1, daysIn(mk)-new Date().getDate()+1); }
function hasOverride(){ const v=db.dayLimit[today()]; return v!=null&&num(v)>0; }
function autoAllowance(){
  const mk=mkNow();
  return Math.max(0, round100((wantsLeft(mk)+spentOn(today()))/daysLeft()));
}
function allowance(){ return hasOverride() ? num(db.dayLimit[today()]) : autoAllowance(); }
function totalSaved(){ return db.goals.reduce((a,g)=>a+num(g.saved),0); }
function txCountAll(){ let c=0; Object.values(db.months).forEach(M=>M.tx.forEach(x=>{ if(x.cat!=='celengan') c++; })); return c; }
function maxGoalPct(){ const p=db.goals.map(g=>num(g.target)>0?num(g.saved)/num(g.target)*100:0); return p.length?Math.max.apply(null,p):0; }

/* =========================================================
   NOMINAL YANG SERING DIPAKAI
   Diambil dari riwayat pengguna sendiri, bukan angka tebakan.
   Dipakai jadi chip satu-ketuk di lembar Catat Jajan.
   ========================================================= */
function topAmounts(cat, n){
  const hitung = {};
  Object.keys(db.months).forEach(mk => {
    (db.months[mk].tx || []).forEach(x => {
      if(x.cat === 'celengan') return;
      if(cat && x.cat !== cat) return;
      const a = num(x.amount);
      if(a <= 0) return;
      /* dibulatkan ke ribuan supaya 22.000 dan 22.500 dianggap satu kebiasaan */
      const k = Math.round(a / 1000) * 1000;
      hitung[k] = (hitung[k] || 0) + 1;
    });
  });
  return Object.keys(hitung)
    .map(k => ({ amount: num(k), n: hitung[k] }))
    .filter(o => o.n >= 2)                 /* sekali pakai belum jadi kebiasaan */
    .sort((a, b) => b.n - a.n || b.amount - a.amount)
    .slice(0, n || 3);
}

/* =========================================================
   6. STREAK · STIKER · REWARD WASHI
   ========================================================= */
function touchStreak(){
  const d=today(), st=db.streak;
  if(st.last===d) return false;
  if(st.last&&dayDiff(st.last,d)===1) st.count=num(st.count)+1; else st.count=1;
  st.last=d; st.best=Math.max(num(st.best),st.count);
  return true;
}
function ctx(){
  return { txCount:txCountAll(), best:num(db.streak.best), streak:num(db.streak.count),
    goals:db.goals.length, maxPct:maxGoalPct(), saved:totalSaved(),
    iritDay:!!db.stats.iritDay, pagi:!!db.stats.pagi };
}
function checkBadges(c){
  c=c||ctx(); const fresh=[];
  BADGES.forEach(b=>{ if(!db.badges[b.id]&&b.t(c)){ db.badges[b.id]=today(); fresh.push(b); } });
  return fresh;
}
function washiMet(w,c){
  const nd=w.need; if(!nd) return true;
  if(nd.k==='streak')  return c.best>=nd.v;
  if(nd.k==='log')     return c.txCount>=nd.v;
  if(nd.k==='goal50')  return c.maxPct>=50;
  if(nd.k==='goal100') return c.maxPct>=100;
  if(nd.k==='saved')   return c.saved>=nd.v;
  return false;
}
function checkWashi(c){
  c=c||ctx(); const fresh=[];
  WASHI.forEach(w=>{
    if(db.washi.owned.indexOf(w.id)<0 && washiMet(w,c)){ db.washi.owned.push(w.id); fresh.push(w); }
  });
  return fresh;
}
/* satu antrean untuk semua hadiah */
let queue=[];
function collectRewards(){
  const c=ctx();
  queue = queue.concat(checkBadges(c).map(b=>({type:'badge',data:b})))
               .concat(checkWashi(c).map(w=>({type:'washi',data:w})));
}
function flushQueue(){
  if(!queue.length) return false;
  const it=queue.shift();
  if(it.type==='badge') celebrateBadge(it.data); else celebrateWashi(it.data);
  return true;
}

/* kosongkan antrean di tempat, jangan ditugaskan ulang dari luar modul */
function clearQueue(){ queue.length = 0; }

/* ======== src/recurring.js ======== */
/* =========================================================
   TRANSAKSI BERULANG
   ---------------------------------------------------------
   Satu entri = satu tagihan bulanan. Tiap bulan, saat aplikasi
   dibuka dan tanggalnya sudah lewat, entri dicatat sekali ke
   bulan itu. Penanda `lastRun` mencegah dobel, dan `rec`
   menandai transaksi supaya bisa dibedakan dari catatan manual.
   ========================================================= */



function recList(){
  if(!Array.isArray(db.recurring)) db.recurring = [];
  return db.recurring;
}

function recAdd(){
  const r = { id: uid(), label: '', amount: 0, cat: 'kos', day: 1, active: true, lastRun: '' };
  recList().push(r);
  return r;
}
function recDel(id){ db.recurring = recList().filter(r => r.id !== id); }
function recFind(id){ return recList().filter(r => r.id === id)[0]; }

function recNormalize(r){
  r.amount = sanitizeAmount(r.amount);
  r.day = clamp(num(r.day) || 1, 1, 28);      /* 28 supaya aman di Februari */
  if(!CATS.some(c => c.k === r.cat)) r.cat = 'kos';
  r.active = !!r.active;
  return r;
}

/* apakah entri sudah waktunya dicatat untuk bulan berjalan */
function recDue(r, mk, hariIni){
  if(!r.active) return false;
  if(sanitizeAmount(r.amount) <= 0) return false;
  if(r.lastRun === mk) return false;
  return clamp(num(r.day) || 1, 1, 28) <= hariIni;
}

/* dijalankan sekali saat boot dan setiap ganti bulan.
   Mengembalikan jumlah entri yang baru dicatat. */
function applyRecurring(){
  const mk = mkNow(), hariIni = new Date().getDate();
  const M = MO(mk);
  let n = 0, total = 0;
  recList().forEach(r => {
    recNormalize(r);
    if(!recDue(r, mk, hariIni)) return;
    /* jaring pengaman: kalau transaksi dengan penanda sama sudah ada, lewati */
    if(M.tx.some(x => x.rec === r.id && String(x.date).slice(0, 7) === mk)){ r.lastRun = mk; return; }
    M.tx.push({
      id: uid(), date: mk + '-' + pad2(clamp(num(r.day) || 1, 1, 28)),
      cat: r.cat, amount: sanitizeAmount(r.amount),
      note: r.label || '', h: 9, rec: r.id
    });
    r.lastRun = mk; n++; total += sanitizeAmount(r.amount);
  });
  return { count: n, total: total };
}

/* total komitmen bulanan, dipakai di ringkasan amplop */
function recMonthlyTotal(){
  return recList().reduce((a, r) => a + (r.active ? sanitizeAmount(r.amount) : 0), 0);
}

/* ======== src/csv.js ======== */
/* =========================================================
   EKSPOR CSV
   ---------------------------------------------------------
   Pemisah memakai titik koma karena Excel versi Indonesia
   membaca koma sebagai pemisah desimal. BOM UTF-8 dipasang
   supaya emoji dan huruf beraksen tidak jadi mojibake.
   ========================================================= */





const SEP = ';';

function cell(v){
  const s = String(v == null ? '' : v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function row(arr){ return arr.map(cell).join(SEP); }

function catName(k){
  if(k === 'celengan') return LANG === 'en' ? CELENGAN.en : CELENGAN.n;
  const c = CATS.filter(x => x.k === k)[0];
  return c ? (LANG === 'en' ? c.en : c.n) : k;

function monthCsv(mk){

    ? { h:'Pastels — monthly recap', per:'Period', in:'Money in', out:'Spent', sav:'Saved', left:'Left over',
        env:'Envelope', alloc:'Allocated', used:'Used', d:'Date', c:'Category', n:'Note', a:'Amount', k:'Type',

        income:'pemasukan', expense:'pengeluaran', saving:'celengan', auto:'otomatis', man:'manual', src:'Sumber', tx:'Transaksi' };

  const out = [];
  out.push(row([L.h]));
  out.push(row([L.per, mkLabel(mk)]));
  out.push('');
  out.push(row([L.in, s.masuk]));
  out.push(row([L.out, s.jajan]));
  out.push(row([L.sav, s.nabung]));
  out.push(row([L.left, s.sisa]));
  out.push('');
  out.push(row([L.env, L.alloc, L.used]));
  ['bills', 'wants', 'save'].forEach(k => {
    out.push(row([k, envNom(k, s.masuk), envSpent(mk, k)]));
  });
  out.push('');

  /* pemasukan */
  out.push(row([L.src, L.d, L.a]));
  M.income.forEach(r => out.push(row([r.label || '', r.date || '', num(r.amount)])));
  out.push('');

  /* transaksi */
  out.push(row([L.tx]));
  out.push(row([L.d, L.c, L.n, L.a, L.k, L.src]));
  M.tx.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach(x => {
    out.push(row([
      x.date, catName(x.cat), x.note || '', num(x.amount),
      x.cat === 'celengan' ? L.saving : L.expense,
      x.rec ? L.auto : L.man

  });
  return '\uFEFF' + out.join('\r\n') + '\r\n';
}

function filterActive(){

function filterReset(){ ui.q = ''; ui.fcat = ''; }

function norm(s){ return String(s == null ? '' : s).toLowerCase(); }

/* satu transaksi lolos filter? */
function txMatch(x){
  if(ui.fcat && x.cat !== ui.fcat) return false;
  const q = norm(ui.q).trim();
  if(!q) return true;
  const c = x.cat === 'celengan' ? CELENGAN : (CATS.filter(y => y.k === x.cat)[0] || {});
  const nama = LANG === 'en' ? (c.en || c.n || '') : (c.n || '');

  return norm(x.note).indexOf(q) >= 0 ||
         norm(nama).indexOf(q) >= 0 ||
         String(x.amount).indexOf(q.replace(/[^\d]/g, '')) >= 0 && /\d/.test(q);
}

/* =========================================================
   7. CONFETTI
   ========================================================= */
let confRAF=null;
function heartPath(x,s){
  x.beginPath(); x.moveTo(0,s*.32);
  x.bezierCurveTo(0,s*.05,-s*.5,-s*.1,-s*.5,-s*.35);
  x.bezierCurveTo(-s*.5,-s*.68,-s*.12,-s*.7,0,-s*.42);
  x.bezierCurveTo(s*.12,-s*.7,s*.5,-s*.68,s*.5,-s*.35);
  x.bezierCurveTo(s*.5,-s*.1,0,s*.05,0,s*.32);
  x.closePath();
}
function starPath(x,s){
  x.beginPath();
  for(let i=0;i<10;i++){
    const r=(i%2?s*.22:s*.55), a=(Math.PI/5)*i-Math.PI/2;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();
}
function confetti(strong){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'), x=cv.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2), W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(dpr,0,0,dpr,0,0); cv.classList.remove('hidden');
  const cols=['#FF9EAA','#FFC0D3','#A3C79B','#F5D96B','#E8D8E8','#93AEC2','#FFFFFF','#F2D7B6'];
  const N=strong?120:72, P=[];
  for(let i=0;i<N;i++){
    const r=Math.random();
    P.push({ x:W*(.14+Math.random()*.72), y:H*(.34+Math.random()*.12),
      vx:(Math.random()-.5)*8, vy:-(6+Math.random()*8.5), g:.27+Math.random()*.12,
      s:9+Math.random()*11, r:Math.random()*6.28, vr:(Math.random()-.5)*.3,
      c:cols[(Math.random()*cols.length)|0], shape: r<.34?'heart':(r<.6?'star':'tape') });
  }
  const t0=performance.now();
  cancelAnimationFrame(confRAF);
  (function frame(tm){
    const el=tm-t0;
    x.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=.995;
      const a=el>1250?Math.max(0,1-(el-1250)/720):1;
      x.save(); x.globalAlpha=a; x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
      if(p.shape==='heart') heartPath(x,p.s);
      else if(p.shape==='star') starPath(x,p.s);
      else { x.beginPath(); x.rect(-p.s*.3,-p.s*.5,p.s*.6,p.s); }
      x.fill(); x.restore();
    });
    if(el<2000) confRAF=requestAnimationFrame(frame);
    else { x.clearRect(0,0,W,H); cv.classList.add('hidden'); }
  })(t0);
}

/* ---------------------------------------------------------
   PALET
   --------------------------------------------------------- */
function hx(h){
  h = h.replace('#', '');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function mix(a, b, t){
  const A = hx(a), B = hx(b);
  const v = i => Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2, '0');
  return '#' + v(0) + v(1) + v(2);
}

function stickerPal(washiId){
  let w;
  try{ w = WMAP[washiId || db.washi.main]; }catch(e){}
  w = w || WASHI[0];
  const a = w.tone;
  return { a:a, b:mix(a, '#FFFFFF', .52), c:mix(a, '#5A4E4D', .34), ink:'#5A4E4D', putih:'#FFFDF9' };
}

/* ---------------------------------------------------------
   PENYAJI 1 — CANVAS
   --------------------------------------------------------- */
function drawSticker(x, id, cx, cy, size, rot, pal, alpha){
  const st = SMAP[id];
  if(!st || typeof Path2D === 'undefined') return false;
  pal = pal || stickerPal();
  const k = size / 24;

  x.save();
  x.translate(cx, cy);
  if(rot) x.rotate(rot);
  x.scale(k, k);
  x.translate(-12, -12);
  x.lineCap = 'round'; x.lineJoin = 'round';

  for(const seg of st.p){
    const col = pal[seg.c] || seg.c;
    const path = new Path2D(seg.d);
    x.globalAlpha = (seg.o == null ? 1 : seg.o) * (alpha == null ? 1 : alpha);
    if(seg.s){ x.strokeStyle = col; x.lineWidth = seg.s; x.stroke(path); }
    else { x.fillStyle = col; x.fill(path, seg.r || 'nonzero'); }
  }

  x.globalAlpha = 1;
  x.restore();
  return true;
}

/* ---------------------------------------------------------
   PENYAJI 2 — SVG (laci stiker & pratinjau editor nanti)
   --------------------------------------------------------- */
function stickerSVG(id, size, pal){
  const st = SMAP[id];
  if(!st) return '';
  pal = pal || stickerPal();
  let body = '';
  for(const seg of st.p){
    const col = pal[seg.c] || seg.c;
    body += '<path d="' + seg.d + '"' +
      (seg.s ? ' fill="none" stroke="' + col + '" stroke-width="' + seg.s +
               '" stroke-linecap="round" stroke-linejoin="round"'
             : ' fill="' + col + '"' + (seg.r ? ' fill-rule="' + seg.r + '"' : '')) +
      (seg.o == null ? '' : ' opacity="' + seg.o + '"') + '/>';
  }
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size +
    '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(sName(st)) + '">' +
    body + '</svg>';
}

/* ---------------------------------------------------------
   TATA LETAK OTOMATIS
   ---------------------------------------------------------
   Koordinat relatif 0-1, bukan piksel: angka yang sama nanti
   dipakai pratinjau HTML selebar apa pun dan kanvas 1080x1920.

   Titiknya di pinggir semua — bukan karena stiker dilarang
   menutupi angka (dia digambar sebelum teks, jadi tidak
   mungkin menutupi), tapi karena tengah kartu sudah penuh.
   --------------------------------------------------------- */
const SLOT = [
  { x:.10,  y:.085 }, { x:.90, y:.075 }, { x:.065, y:.30 }, { x:.935, y:.285 },
  { x:.075, y:.55  }, { x:.93, y:.545 }, { x:.085, y:.675 }, { x:.10,  y:.815 }
];

function hash(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* Deterministik per benih: kartu yang sama hari ini tidak berubah tiap
   kali dibuka, tapi besok susunannya lain sendiri. */
function autoTempel(seed, n){
  const own = ownedStickers();
  if(!own.length) return [];

  let s = hash(String(seed));
  const acak = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };

  const slot = SLOT.slice();
  const pool = own.slice();
  const out = [];
  n = Math.min(n || 5, slot.length);

  for(let i = 0; i < n; i++){
    const sl = slot.splice(Math.floor(acak() * slot.length), 1)[0];
    if(!pool.length) pool.push.apply(pool, own);
    const id = pool.splice(Math.floor(acak() * pool.length), 1)[0];
    out.push({ s:id, x:sl.x, y:sl.y, r:(acak() - .5) * .8, z:.78 + acak() * .5 });
  }
  return out;
}

/* =========================================================
   ALAT GAMBAR
   ========================================================= */
function pth(d, fill, stroke, w, extra){
  return '<path d="' + d + '" fill="' + (fill || 'none') + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="' + (w || 2.2) + '" stroke-linecap="round" stroke-linejoin="round"' : '') +
    (extra || '') + '/>';
}
function strk(d, stroke, w, extra){
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2.2) +
    '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}
function n1(v){ return (Math.round(v * 10) / 10).toString(); }

/* Siluet berbulu: separuh atas elips dipecah jadi gelombang.
   amp = tinggi gelombang, jadi kucing gembul terlihat beda
   siluetnya dari kucing berbulu pendek.                      */
function blob(w, h, n, amp, bot){
  var P = function(t){ return [-w * Math.cos(Math.PI * t), -h * Math.sin(Math.PI * t)]; };
  var d = 'M' + n1(-w) + ' 0', i;
  for(i = 1; i <= n; i++){
    var t1 = i / n, tm = (i - .5) / n;
    var p1 = P(t1), pm = P(tm);
    var nx = pm[0] / (w * w), ny = pm[1] / (h * h);
    var len = Math.sqrt(nx * nx + ny * ny) || 1;
    d += ' Q' + n1(pm[0] + nx / len * amp) + ' ' + n1(pm[1] + ny / len * amp) +
         ' ' + n1(p1[0]) + ' ' + n1(p1[1]);
  }
  if(bot === 'round')    d += ' C' + n1(w * .94) + ' ' + n1(h * .6) + ' ' + n1(-w * .94) + ' ' + n1(h * .6) + ' ' + n1(-w) + ' 0';
  else if(bot === 'sag') d += ' Q0 ' + n1(h * .2) + ' ' + n1(-w) + ' 0';
  else                   d += ' L' + n1(-w) + ' 0';
  return d + ' Z';
}

/* warna kaki & ekor ikut corak: tuksedo putih, siam gelap */
function pawCol(C){ return C.mark === 'tuxedo' ? CAT_WHITE : (C.mark === 'point' ? C.point : C.fur); }
function tipCol(C){ return C.mark === 'point' ? C.point : C.fur; }

/* garis gerak ala stiker — dipakai saat kucing panik */
function motion(x, y, dir, n, col){
  var o = '', i;
  for(i = 0; i < n; i++)
    o += strk('M' + n1(x + dir * i * 2.5) + ' ' + n1(y + i * 5.5) + ' l' + n1(dir * 7) + ' ' + n1(-1.5),
      col, 1.9, ' opacity=".5"');
  return o;
}

/* =========================================================
   TELINGA — empat bentuk, dibedakan tinggi & lengkungnya
   ========================================================= */
function earPath(C, F, s){
  var hw = F.hw, hh = F.hh;
  var p = function(a, b){ return n1(s * hw * a) + ' ' + n1(hh * b); };
  if(C.ears === 'small')
    return 'M' + p(.18, -.88) + ' L' + p(.92, -1.22) + ' L' + p(.94, -.52) + ' Z';
  if(C.ears === 'big')
    return 'M' + p(.1, -.94) + ' L' + p(.74, -2.02) + ' L' + p(1.0, -.5) + ' Z';
  if(C.ears === 'fold')
    return 'M' + p(.2, -.86) + ' L' + p(.6, -1.34) + ' Q' + p(1.08, -1.3) + ' ' + p(.98, -.92) +
           ' L' + p(.96, -.5) + ' Z';
  return 'M' + p(.16, -.9) + ' L' + p(.78, -1.66) + ' L' + p(.98, -.52) + ' Z';
}
function catEars(C, F){
  var o = '', s, i;
  for(i = 0; i < 2; i++){
    s = i ? 1 : -1;
    var d = earPath(C, F, s);
    /* siam telinganya gelap, belang tiga sebelah kiri belang oranye */
    var col = C.mark === 'point' ? C.point : (C.mark === 'calico' && s < 0 ? C.patchA : C.fur);
    var bx = s * F.hw * .58, by = -F.hh * .72;
    o += '<g class="cs-ear' + (i ? ' cs-ear-2' : '') + '">' +
      pth(d, col, C.line, 2.1) +
      '<g transform="translate(' + n1(bx) + ',' + n1(by) + ') scale(.52) translate(' + n1(-bx) + ',' + n1(-by) + ')">' +
      pth(d, C.ear) + '</g></g>';
  }
  return o;
}

/* =========================================================
   MATA — besar ala stiker, dua kilau, pupil bulat atau sipit
   ========================================================= */
function catEyes(C, F, mode){
  var ex = F.hw * .44, ey = -F.hh * .04, r = F.er;
  var garis = (C.mark === 'solid' || C.mark === 'point') ? '#FFFDF9' : '#7E7271';
  var o = '', i;
  if(mode === 'tidur' || mode === 'senang'){
    for(i = 0; i < 2; i++){
      var s = i ? 1 : -1, cx = s * ex;
      var d = mode === 'tidur'
        ? 'M' + n1(cx - r * .78) + ' ' + n1(ey - 1) + ' q' + n1(r * .78) + ' ' + n1(r * .82) + ' ' + n1(r * 1.56) + ' 0'
        : 'M' + n1(cx - r * .78) + ' ' + n1(ey + 2) + ' q' + n1(r * .78) + ' ' + n1(-r * .95) + ' ' + n1(r * 1.56) + ' 0';
      o += '<g class="cs-blink' + (i ? ' cs-blink-2' : '') + '">' + strk(d, garis, 2.6) + '</g>';
    }
    o += '<ellipse cx="' + n1(-ex - r * .75) + '" cy="' + n1(ey + r * .75) + '" rx="' + n1(r * .55) + '" ry="' + n1(r * .34) + '" fill="' + C.ear + '" opacity=".6"/>';
    o += '<ellipse cx="' + n1(ex + r * .75) + '" cy="' + n1(ey + r * .75) + '" rx="' + n1(r * .55) + '" ry="' + n1(r * .34) + '" fill="' + C.ear + '" opacity=".6"/>';
    return o;
  }
  var cemas = mode === 'cemas';
  for(i = 0; i < 2; i++){
    var sg = i ? 1 : -1, x = sg * ex;
    var pr = C.pupil === 'slit'
      ? '<ellipse cx="' + n1(x) + '" cy="' + n1(ey) + '" rx="' + n1(r * .2) + '" ry="' + n1(r * .68) + '" fill="#241F1D"/>'
      : '<ellipse cx="' + n1(x) + '" cy="' + n1(ey) + '" rx="' + n1(r * .38) + '" ry="' + n1(r * .5) + '" fill="#241F1D"/>';
    o += '<g class="cs-blink' + (i ? ' cs-blink-2' : '') + '">' +
      '<circle cx="' + n1(x) + '" cy="' + n1(ey) + '" r="' + n1(r) + '" fill="#FFFDF9" stroke="' + C.line + '" stroke-width="1.8"/>' +
      '<g class="cs-pupil"><circle cx="' + n1(x) + '" cy="' + n1(ey) + '" r="' + n1(r * .8) + '" fill="' + C.eye + '"/>' + pr + '</g>' +
      '<circle cx="' + n1(x + r * .3) + '" cy="' + n1(ey - r * .42) + '" r="' + n1(r * .27) + '" fill="#fff"/>' +
      '<circle cx="' + n1(x - r * .38) + '" cy="' + n1(ey + r * .34) + '" r="' + n1(r * .15) + '" fill="#fff" opacity=".85"/>' +
      (cemas ? strk('M' + n1(x - r * 1.05) + ' ' + n1(ey - r * .8) + ' q' + n1(r * .55) + ' ' + n1(-r * .45) + ' ' + n1(r * 1.1) + ' ' + n1(r * .1), C.line, 1.9) : '') +
      '</g>';
  }
  return o;
}

/* =========================================================
   KEPALA — satu fungsi untuk semua pose, jadi mukanya konsisten
   ========================================================= */
function catHead(C, U, eyes){
  var F = FACE[C.face] || FACE.round;
  var hd = blob(F.hw, F.hh, C.fluff > 1.6 ? 7 : 6, C.fluff * .8, 'round');
  var cid = 'hd' + U + (csSeq++);
  var o = catEars(C, F) + pth(hd, C.fur, C.line, 2.2);

  /* corak muka, dipotong mengikuti bentuk kepala */
  var m = '';
  if(C.mark === 'tabby'){
    m += strk('M' + n1(-F.hw * .34) + ' ' + n1(-F.hh * .96) + ' v' + n1(F.hh * .34) +
              ' M0 ' + n1(-F.hh * 1.02) + ' v' + n1(F.hh * .36) +
              ' M' + n1(F.hw * .34) + ' ' + n1(-F.hh * .96) + ' v' + n1(F.hh * .34), C.shade, 2.4);
    m += pth('M' + n1(-F.hw * .5) + ' ' + n1(F.hh * .18) + ' q' + n1(F.hw * .5) + ' ' + n1(F.hh * .42) + ' ' + n1(F.hw) + ' 0' +
             ' q' + n1(-F.hw * .12) + ' ' + n1(F.hh * .44) + ' ' + n1(-F.hw * .5) + ' ' + n1(F.hh * .44) +
             ' q' + n1(-F.hw * .38) + ' 0 ' + n1(-F.hw * .5) + ' ' + n1(-F.hh * .44) + ' Z', C.fur2, '', 0, ' opacity=".6"');
  } else if(C.mark === 'tuxedo'){
    m += pth('M' + n1(-F.hw * .56) + ' ' + n1(F.hh * .1) + ' q' + n1(F.hw * .56) + ' ' + n1(F.hh * .5) + ' ' + n1(F.hw * 1.12) + ' 0' +
             ' q' + n1(-F.hw * .1) + ' ' + n1(F.hh * .56) + ' ' + n1(-F.hw * .56) + ' ' + n1(F.hh * .56) +
             ' q' + n1(-F.hw * .46) + ' 0 ' + n1(-F.hw * .56) + ' ' + n1(-F.hh * .56) + ' Z', CAT_WHITE);
    m += pth('M' + n1(-F.hw * .14) + ' ' + n1(-F.hh * 1.02) + ' q' + n1(F.hw * .14) + ' -2 ' + n1(F.hw * .28) + ' 0' +
             ' L' + n1(F.hw * .1) + ' ' + n1(F.hh * .12) + ' q' + n1(-F.hw * .1) + ' 2 ' + n1(-F.hw * .2) + ' 0 Z', CAT_WHITE);
  } else if(C.mark === 'point'){
    m += '<ellipse cx="0" cy="' + n1(F.hh * .2) + '" rx="' + n1(F.hw * .86) + '" ry="' + n1(F.hh * .74) + '" fill="' + C.point + '" opacity=".92"/>';
    m += '<ellipse cx="0" cy="' + n1(-F.hh * .12) + '" rx="' + n1(F.hw * 1.05) + '" ry="' + n1(F.hh * .42) + '" fill="' + C.point + '" opacity=".55"/>';
  } else if(C.mark === 'calico'){
    m += pth('M' + n1(-F.hw * 1.1) + ' ' + n1(-F.hh * 1.1) + ' q' + n1(F.hw * .9) + ' ' + n1(-F.hh * .1) + ' ' + n1(F.hw * .95) + ' ' + n1(F.hh * .55) +
             ' q' + n1(-F.hw * .5) + ' ' + n1(F.hh * .5) + ' ' + n1(-F.hw * 1.05) + ' ' + n1(F.hh * .1) + ' Z', C.patchA, '', 0, ' opacity=".95"');
    m += pth('M' + n1(F.hw * .42) + ' ' + n1(-F.hh * 1.16) + ' q' + n1(F.hw * .8) + ' ' + n1(F.hh * .3) + ' ' + n1(F.hw * .55) + ' ' + n1(F.hh * .82) +
             ' q' + n1(-F.hw * .55) + ' ' + n1(-F.hh * .1) + ' ' + n1(-F.hw * .55) + ' ' + n1(-F.hh * .82) + ' Z', C.patchB, '', 0, ' opacity=".95"');
  } else if(C.mark === 'plain'){
    m += pth('M' + n1(-F.hw * .5) + ' ' + n1(F.hh * .16) + ' q' + n1(F.hw * .5) + ' ' + n1(F.hh * .44) + ' ' + n1(F.hw) + ' 0' +
             ' q' + n1(-F.hw * .12) + ' ' + n1(F.hh * .46) + ' ' + n1(-F.hw * .5) + ' ' + n1(F.hh * .46) +
             ' q' + n1(-F.hw * .38) + ' 0 ' + n1(-F.hw * .5) + ' ' + n1(-F.hh * .46) + ' Z', C.fur2, '', 0, ' opacity=".75"');
  } else {
    m += strk('M' + n1(-F.hw * .62) + ' ' + n1(-F.hh * .76) + ' q' + n1(F.hw * .5) + ' ' + n1(-F.hh * .26) + ' ' + n1(F.hw * .95) + ' ' + n1(F.hh * .06), C.shade, 3, ' opacity=".5"');
  }
  if(m) o += '<clipPath id="' + cid + '"><path d="' + hd + '"/></clipPath>' +
             '<g clip-path="url(#' + cid + ')">' + m + '</g>';

  o += pth(hd, 'none', C.line, 2.2);
  o += catEyes(C, F, eyes);

  /* hidung, mulut, kumis */
  var ny = F.hh * .36;
  o += pth('M' + n1(-2.6) + ' ' + n1(ny) + ' L2.6 ' + n1(ny) + ' L0 ' + n1(ny + 2.8) + ' Z', C.nose);
  o += strk('M0 ' + n1(ny + 2.8) + ' q-3.6 3.6 -7 .8 M0 ' + n1(ny + 2.8) + ' q3.6 3.6 7 .8',
        C.mark === 'point' ? '#F0E4D6' : C.nose, 1.6);
  var wl = C.face === 'wedge' ? 13 : 11, wy = F.hh * .3;
  var wc = (C.mark === 'solid' || C.mark === 'point') ? '#FFFDF9' : C.line;
  o += strk('M' + n1(-F.hw * .8) + ' ' + n1(wy) + ' q-6 -1.5 -' + wl + ' -3' +
            ' M' + n1(-F.hw * .8) + ' ' + n1(wy + 4) + ' q-6 1 -' + wl + ' 3' +
            ' M' + n1(F.hw * .8) + ' ' + n1(wy) + ' q6 -1.5 ' + wl + ' -3' +
            ' M' + n1(F.hw * .8) + ' ' + n1(wy + 4) + ' q6 1 ' + wl + ' 3', wc, 1.3, ' opacity=".66"');
  return o;
}

/* =========================================================
   EKOR — enam jenis, tebal & lengkungnya beda-beda
   ========================================================= */
function catTail(C, w, h, pose){
  var t = C.tail, col = tipCol(C), lw = { plume:15, bushy:13, ring:10, tipped:10, point:9, whip:7 }[t] || 10;
  var d, ex, ey;
  if(pose === 'sprawl'){
    ex = w * 1.12; ey = -h * 1.3;
    d = 'M' + n1(w * .84) + ' ' + n1(-h * .2) + ' C' + n1(w * 1.55) + ' ' + n1(-h * .38) +
        ' ' + n1(w * 1.66) + ' ' + n1(-h * 1.0) + ' ' + n1(ex) + ' ' + n1(ey);
  } else if(pose === 'loaf'){
    ex = w * .06; ey = h * .3;
    d = 'M' + n1(w * .8) + ' ' + n1(-h * .12) + ' C' + n1(w * 1.42) + ' ' + n1(h * .2) +
        ' ' + n1(w * .7) + ' ' + n1(h * .48) + ' ' + n1(ex) + ' ' + n1(ey);
  } else {
    ex = w * 1.32; ey = -h * .72;
    d = 'M' + n1(w * .72) + ' ' + n1(h * .04) + ' C' + n1(w * 1.95) + ' ' + n1(h * .14) +
        ' ' + n1(w * 2.1) + ' ' + n1(-h * .44) + ' ' + n1(ex) + ' ' + n1(ey);
  }
  var o = strk(d, C.line, lw + 4) + strk(d, col, lw);
  if(t === 'ring'){
    o += strk(pose === 'loaf'
      ? 'M' + n1(w * 1.16) + ' ' + n1(h * .18) + ' l1 4 M' + n1(w * .82) + ' ' + n1(h * .4) + ' l1 4'
      : 'M' + n1(w * 1.3) + ' ' + n1(-h * .28) + ' l4 1.5 M' + n1(w * 1.48) + ' ' + n1(-h * .7) + ' l4 1',
      C.shade, 3.4);
  }
  if(t === 'tipped' || t === 'point'){
    o += '<circle cx="' + n1(ex) + '" cy="' + n1(ey) + '" r="' + n1(lw * .58) + '" fill="' +
      (t === 'tipped' ? CAT_WHITE : C.point) + '" stroke="' + C.line + '" stroke-width="2"/>';
  }
  if(t === 'plume' || t === 'bushy'){
    o += '<circle cx="' + n1(ex) + '" cy="' + n1(ey) + '" r="' + n1(lw * .72) + '" fill="' + col + '" stroke="' + C.line + '" stroke-width="2.1"/>';
  }
  return o;
}

/* =========================================================
   CORAK BADAN — dipotong mengikuti siluet tiap pose
   ========================================================= */
function catMarks(C, U, pose, body, w, h){
  var id = 'bd' + U + pose + (csSeq++), o = '';
  if(C.mark === 'tabby'){
    var i, k = 4;
    for(i = 0; i < k; i++){
      var x = -w * .58 + i * (w * 1.16 / (k - 1));
      o += strk('M' + n1(x) + ' ' + n1(-h * 1.02) + ' q' + n1(w * .1) + ' ' + n1(h * .34) + ' ' + n1(w * .02) + ' ' + n1(h * .6), C.shade, 3.6, ' opacity=".85"');
    }
  } else if(C.mark === 'tuxedo'){
    o += pth('M' + n1(-w * .5) + ' ' + n1(-h * .5) + ' q' + n1(w * .52) + ' ' + n1(-h * .24) + ' ' + n1(w * 1.02) + ' ' + n1(h * .06) +
             ' q' + n1(-w * .06) + ' ' + n1(h * .66) + ' ' + n1(-w * .52) + ' ' + n1(h * .7) +
             ' q' + n1(-w * .46) + ' ' + n1(-h * .06) + ' ' + n1(-w * .5) + ' ' + n1(-h * .76) + ' Z', CAT_WHITE, '', 0, ' opacity=".96"');
  } else if(C.mark === 'calico'){
    o += pth('M' + n1(-w * 1.05) + ' ' + n1(-h * .5) + ' q' + n1(w * .6) + ' ' + n1(-h * .55) + ' ' + n1(w * .95) + ' ' + n1(-h * .05) +
             ' q' + n1(-w * .35) + ' ' + n1(h * .6) + ' ' + n1(-w * .95) + ' ' + n1(h * .5) + ' Z', C.patchA, '', 0, ' opacity=".95"');
    o += pth('M' + n1(w * .18) + ' ' + n1(-h * 1.12) + ' q' + n1(w * .66) + ' ' + n1(h * .16) + ' ' + n1(w * .72) + ' ' + n1(h * .72) +
             ' q' + n1(-w * .6) + ' ' + n1(h * .24) + ' ' + n1(-w * .78) + ' ' + n1(-h * .34) + ' Z', C.patchB, '', 0, ' opacity=".95"');
    o += pth('M' + n1(-w * .3) + ' ' + n1(h * .34) + ' q' + n1(w * .3) + ' ' + n1(-h * .3) + ' ' + n1(w * .56) + ' ' + n1(h * .06) +
             ' q' + n1(-w * .2) + ' ' + n1(h * .3) + ' ' + n1(-w * .56) + ' ' + n1(-h * .06) + ' Z', C.patchA, '', 0, ' opacity=".8"');
  } else if(C.mark === 'point'){
    o += strk('M' + n1(-w * .7) + ' ' + n1(h * .12) + ' q' + n1(w * .7) + ' ' + n1(h * .3) + ' ' + n1(w * 1.4) + ' 0', C.shade, 3, ' opacity=".35"');
  } else if(C.mark === 'plain'){
    o += strk('M' + n1(-w * .66) + ' ' + n1(-h * .06) + ' q' + n1(w * .66) + ' ' + n1(h * .34) + ' ' + n1(w * 1.3) + ' ' + n1(-h * .04), C.fur2, 3.4, ' opacity=".85"');
  } else {
    o += strk('M' + n1(-w * .5) + ' ' + n1(-h * .94) + ' q' + n1(w * .6) + ' ' + n1(-h * .12) + ' ' + n1(w * 1.05) + ' ' + n1(h * .18), C.shade, 3.6, ' opacity=".5"');
  }
  return '<clipPath id="' + id + '"><path d="' + body + '"/></clipPath>' +
         '<g clip-path="url(#' + id + ')">' + o + '</g>';
}

/* =========================================================
   POSE — ukuran badan & posisi kepala ikut anatomi kucingnya
   ========================================================= */
function bodyGeom(C, pose){
  var B = BUILD[C.build] || BUILD.medium;
  if(pose === 'sprawl') return { w:B.bw * 1.28, h:B.bh * .78, bot:'sag',  n:7 };
  if(pose === 'loaf')   return { w:B.bw * 1.02, h:B.bh * .84, bot:'flat', n:7 };
  return { w:B.bw * .76, h:B.bh * 1.06, bot:'flat', n:6 };
}
function paw(C, x, y, r){
  return pth('M' + n1(x - r) + ' ' + n1(y) + ' q' + n1(r) + ' ' + n1(-r * 1.5) + ' ' + n1(r * 2) + ' 0' +
             ' q' + n1(-r * .1) + ' ' + n1(r * .9) + ' ' + n1(-r) + ' ' + n1(r * .9) +
             ' q' + n1(-r * .9) + ' 0 ' + n1(-r) + ' ' + n1(-r * .9) + ' Z', pawCol(C), C.line, 1.9);
}

function poseSprawl(C, U){
  var g = bodyGeom(C, 'sprawl'), F = FACE[C.face] || FACE.round;
  var body = blob(g.w, g.h, g.n, C.fluff, g.bot);
  var hx = -g.w + F.hw * .5, hy = -g.h * .46;
  var o = '<g class="cs-tail-slow">' + catTail(C, g.w, g.h, 'sprawl') + '</g>';
  o += '<g class="cs-breathe">' + pth(body, C.fur, C.line, 2.2) + catMarks(C, U, 'sprawl', body, g.w, g.h);
  o += '<g class="cs-knead">' + paw(C, -g.w * .28, g.h * .16, 8) + '</g>';
  o += '<g class="cs-knead cs-knead-2">' + paw(C, g.w * .06, g.h * .2, 8) + '</g>';
  o += '</g>';
  o += '<g transform="translate(' + n1(hx) + ',' + n1(hy) + ')">' + catHead(C, U, 'tidur') + '</g>';
  o += '<g fill="' + C.line + '" font-family="Shantell Sans, Comic Sans MS, cursive" font-weight="700" opacity=".85">' +
    '<text class="cs-z" x="' + n1(hx + 14) + '" y="' + n1(hy - 26) + '" font-size="11">z</text>' +
    '<text class="cs-z cs-z-2" x="' + n1(hx + 25) + '" y="' + n1(hy - 34) + '" font-size="14">z</text>' +
    '<text class="cs-z cs-z-3" x="' + n1(hx + 37) + '" y="' + n1(hy - 42) + '" font-size="17">z</text></g>';
  return o;
}

function poseLoaf(C, U){
  var g = bodyGeom(C, 'loaf'), F = FACE[C.face] || FACE.round;
  var body = blob(g.w, g.h, g.n, C.fluff, g.bot);
  var hx = -g.w * .34, hy = -g.h * .82;
  var o = '<g class="cs-tail">' + catTail(C, g.w, g.h, 'loaf') + '</g>';
  o += '<g class="cs-breathe">' + pth(body, C.fur, C.line, 2.2) + catMarks(C, U, 'loaf', body, g.w, g.h);
  o += paw(C, -g.w * .34, g.h * .04, 8.5) + paw(C, g.w * .06, g.h * .04, 8.5);
  o += '<g transform="translate(' + n1(hx) + ',' + n1(hy) + ')"><g class="cs-groom">' + catHead(C, U, 'senang') + '</g></g>';
  o += '</g>';
  return o;
}

function poseSit(C, U){
  var g = bodyGeom(C, 'sit'), F = FACE[C.face] || FACE.round;
  var body = blob(g.w, g.h, g.n, C.fluff, g.bot);
  var hy = -g.h - F.hh * .48;
  var o = '<g class="cs-tail-flick">' + catTail(C, g.w, g.h, 'sit') + '</g>';
  o += '<g class="cs-breathe-fast">' + pth(body, C.fur, C.line, 2.2) + catMarks(C, U, 'sit', body, g.w, g.h);
  o += paw(C, -g.w * .42, g.h * .02, 8.5) + paw(C, g.w * .42, g.h * .02, 8.5);
  o += '<g transform="translate(0,' + n1(hy) + ')">' + catHead(C, U, 'melek') + '</g>';
  o += '</g>';
  o += motion(g.w * 1.5, -g.h * .5, 1, 3, C.line);
  o += '<path class="cs-drop" d="M' + n1(g.w * .9) + ' ' + n1(hy - 12) + ' q3.4 5.4 0 7.4 q-3.4 -2 0 -7.4 z" fill="#93AEC2"/>';
  o += '<g transform="translate(' + n1(-g.w * 1.12) + ',' + n1(hy - 14) + ')"><g class="cs-bob">' +
    strk('M0 -6 V4', '#FF8299', 3) + '<circle cy="8" r="1.9" fill="#FF8299"/></g></g>';
  return o;
}

function posePeek(C, U){
  return '<g class="cs-peek"><g class="cs-shiver">' +
    '<g transform="translate(0,-2)">' + catHead(C, U, 'cemas') + '</g></g>' +
    motion(20, -18, 1, 2, C.line) + motion(-26, -18, -1, 2, C.line) +
    '<path class="cs-drop" d="M20 -16 q3.4 5.4 0 7.4 q-3.4 -2 0 -7.4 z" fill="#93AEC2"/></g>';
}
function catPaws(C){ return paw(C, -11, 10, 7) + paw(C, 11, 10, 7); }

/* =========================================================
   KAMAR — latar, lantai, perabot, pernak-pernik
   ========================================================= */
var HOR = 118;                 /* batas dinding & lantai */

function floorLines(R, n, spread, w, op){
  var o = '', i;
  for(i = 0; i <= n; i++){
    var x = -40 + (i * (400 + spread) / n);
    o += strk('M' + (160 + (x - 160) * .34).toFixed(1) + ' ' + HOR + ' L' + x.toFixed(1) + ' 196', R.line, w || 1.3, ' opacity="' + (op || .3) + '"');
  }
  return o;
}

function roomSusu(R, st, U){
  var o = '';
  o += '<rect x="-12" y="-12" width="344" height="' + (HOR + 12) + '" fill="' + R.wall + '"/>';
  for(var i = 0; i < 13; i++) o += '<rect x="' + (-8 + i * 27) + '" y="-12" width="11" height="' + (HOR + 12) + '" fill="' + R.wall2 + '" opacity=".5"/>';
  o += '<rect x="-12" y="94" width="344" height="24" fill="' + R.wall2 + '"/>';
  o += strk('M-12 94 H332', R.line, 2, ' opacity=".4"');
  o += '<rect x="-12" y="' + HOR + '" width="344" height="74" fill="' + R.floor + '"/>';
  o += '<rect x="-12" y="' + HOR + '" width="344" height="74" fill="url(#tl' + U + ')"/>';
  o += strk('M-12 ' + HOR + ' H332', R.line, 2.6);
  if(st !== 'box'){
    o += '<g opacity=".92">' + strk('M-6 12 Q80 30 160 22 Q244 13 326 24', R.line, 1.8);
    var fl = ['#FFC0D3', '#F5D96B', '#A3C79B', '#FFC0D3', '#F5D96B', '#A3C79B', '#FFC0D3'];
    var sg = [[-6,12,80,30,160,22,.18],[-6,12,80,30,160,22,.5],[-6,12,80,30,160,22,.82],
              [160,22,244,13,326,24,.14],[160,22,244,13,326,24,.37],[160,22,244,13,326,24,.61],[160,22,244,13,326,24,.85]];
    for(var b = 0; b < sg.length; b++){
      var q = sg[b], t = q[6], u = 1 - t;
      var bx = u*u*q[0] + 2*u*t*q[2] + t*t*q[4], by = u*u*q[1] + 2*u*t*q[3] + t*t*q[5];
      o += pth('M' + (bx-7).toFixed(1) + ' ' + (by-1).toFixed(1) + ' L' + (bx+7).toFixed(1) + ' ' + (by+1).toFixed(1) +
               ' L' + bx.toFixed(1) + ' ' + (by+15).toFixed(1) + ' Z', fl[b], R.line, 1.6);
    }
    o += '</g>';
  }
  o += frameArt(R, 28, 36, '#FFC0D3');
  if(st === 'lux'){
    o += '<g transform="translate(240,0)"><g class="cs-bob-2">' +
      strk('M0 58 C5 70 -4 78 1 90', R.line, 1.6, ' opacity=".6"') +
      '<circle cy="40" r="17" fill="#F5D96B" stroke="' + R.line + '" stroke-width="2.4"/>' +
      '<circle cy="40" r="6" fill="' + R.wall + '" stroke="' + R.line + '" stroke-width="2"/>' +
      strk('M-14 34 q5 4 10 -1 q5 5 11 0', '#FFFDF9', 2) +
      strk('M-9 48 q4 4 9 0', '#FFFDF9', 1.8, ' opacity=".8"') + '</g></g>';
  } else o += wallClock(R, 240, 42);

/* =========================================================
   PERAKIT ADEGAN
   Latar kamar difilter (goyangan cat air), tapi kursi, kucing,
   dan mangkuk TIDAK — biar animasinya tetap ringan di iPhone.
   ========================================================= */
var ROOM_FN = { susu:roomSusu, loteng:roomLoteng, kayu:roomKayu, teras:roomTeras, teh:roomTeh, roti:roomRoti };

/* opt (semuanya opsional, dipakai saat SVG dirasterisasi ke canvas):
     xmlns       tulis atribut xmlns — WAJIB untuk data URL, kalau tidak
                 browser menolak memuatnya sebagai <img>
     w, h        ukuran eksplisit; di dalam data URL tidak ada CSS halaman,
                 jadi kelas .cs-svg tidak bisa dipakai untuk menentukan ukuran
     tanpaFilter lewati feTurbulence/feDisplacementMap. Goyangan tangannya
                 hilang, tapi ini jaring pengaman kalau filter tidak didukung */
function catScene(st, catId, opt){
  opt = opt || {};
  if(['lux','chill','watch','box'].indexOf(st) < 0) st = 'chill';
  var C = catId ? catKind(catId) : catPicked();
  var R = ROOMS[C.room] || ROOMS.susu;
  var U = 'cs' + (++csSeq);
  var W = 320, H = 180, bg = '', fg = '';

  bg += (ROOM_FN[C.room] || roomSusu)(R, st, U);

  if(C.room !== 'teras'){
    bg += '<ellipse cx="162" cy="150" rx="112" ry="19" fill="' + R.tile + '" opacity=".8"/>' +
      '<ellipse cx="162" cy="150" rx="112" ry="19" fill="none" stroke="' + R.line + '" stroke-width="2.2"/>' +
      '<ellipse cx="162" cy="150" rx="86" ry="13" fill="none" stroke="' + R.line +
      '" stroke-width="1.6" stroke-dasharray="5 5" opacity=".5"/>';
  }
  bg += '<ellipse cx="162" cy="141" rx="66" ry="9" fill="' + R.line + '" opacity=".14"/>';

  var seat, cx = 160, cy = 104;
  if(R.seat === 'papasan'){ seat = seatPapasan(R, st); cx = 160; cy = 102; }
  else if(R.seat === 'pouf'){ seat = seatPouf(R, st); cx = 160; cy = 106; }
  else { var s = seatFor(R, st, U); seat = s.svg; cx = s.cx; cy = s.cy; }
  if(st === 'box' && (R.seat === 'papasan' || R.seat === 'pouf')) seat = '<g transform="translate(-24,0)">' + seat + '</g>';
  fg += seat;

  if(st === 'box'){
    fg += boxWithCat(C, R, U);
  } else {
    var pose = st === 'lux' ? poseSprawl : (st === 'chill' ? poseLoaf : poseSit);
    fg += '<g transform="translate(' + cx + ',' + cy + ')">' + pose(C, U) + '</g>';
  }
  fg += bowl(R, st);

  if(st !== 'box'){
    fg += '<g fill="' + R.line + '" opacity=".4">' +
      '<circle class="cs-dust" cx="88" cy="86" r="1.6"/>' +
      '<circle class="cs-dust cs-dust-2" cx="216" cy="74" r="1.4"/>' +
      '<circle class="cs-dust cs-dust-3" cx="178" cy="50" r="1.2"/></g>';
  }

  var tint = '';
  if(st === 'watch') tint = '<rect x="-12" y="-12" width="344" height="204" fill="#E8A55A" opacity=".13" style="mix-blend-mode:multiply"/>';
  if(st === 'box')   tint = '<rect x="-12" y="-12" width="344" height="204" fill="#808080" opacity=".42" style="mix-blend-mode:saturation"/>' +
                            '<rect x="-12" y="-12" width="344" height="204" fill="#7A7068" opacity=".1" style="mix-blend-mode:multiply"/>';
  if(st === 'lux')   tint = '<rect x="-12" y="-12" width="344" height="204" fill="url(#wm' + U + ')" opacity=".5"/>';

  var grain = opt.tanpaFilter ? '' :
    '<rect x="-12" y="-12" width="344" height="204" filter="url(#gr' + U + ')" opacity="' +
    (R.dark ? '.22' : '.14') + '" style="mix-blend-mode:multiply"/>';

  var bgWrap = opt.tanpaFilter ? bg : '<g filter="url(#wb' + U + ')">' + bg + '</g>';

  return '<svg viewBox="0 0 ' + W + ' ' + H + '"' +
      (opt.xmlns ? ' xmlns="http://www.w3.org/2000/svg"' : '') +
      (opt.w ? ' width="' + opt.w + '" height="' + opt.h + '"' : '') +
      ' class="cs-svg" role="img" aria-label="' + esc(catQuote(st, C.id)) + '">' +
    '<defs>' +
      '<filter id="wb' + U + '" x="-8%" y="-8%" width="116%" height="116%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>' +
        '<feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter>' +
      '<filter id="gr' + U + '" x="0%" y="0%" width="100%" height="100%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3"/>' +
        '<feColorMatrix type="saturate" values="0"/></filter>' +
      '<pattern id="tl' + U + '" width="34" height="18" patternUnits="userSpaceOnUse">' +
        '<path d="M17 0 L34 9 L17 18 L0 9 Z" fill="' + R.tile + '" opacity=".6"/></pattern>' +
      '<radialGradient id="lg' + U + '">' +
        '<stop offset="0" stop-color="' + R.glow + '" stop-opacity="' + (R.dark ? '.85' : '.9') + '"/>' +
        '<stop offset="1" stop-color="' + R.glow + '" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="wm' + U + '" cx=".5" cy=".3" r=".8">' +
        '<stop offset="0" stop-color="#FFF6DE" stop-opacity=".55"/>' +
        '<stop offset="1" stop-color="#FFF6DE" stop-opacity="0"/></radialGradient>' +
      '<clipPath id="cp' + U + '"><rect x="0" y="0" width="' + W + '" height="' + H + '"/></clipPath>' +
    '</defs>' +
    '<g clip-path="url(#cp' + U + ')">' +
      /* Jaring pengaman: kalau filter gagal dirender, ruangan tidak jadi
         kotak kosong — warna dinding & lantai sudah ada di bawahnya. */
      '<rect x="-12" y="-12" width="344" height="' + (HOR + 12) + '" fill="' + R.wall + '"/>' +
      '<rect x="-12" y="' + HOR + '" width="344" height="80" fill="' + R.floor + '"/>' +
      bgWrap +
      fg + tint + grain +
    '</g></svg>';
}

/* =========================================================
   9b. RIWAYAT BERTINGKAT & CERITA BULANAN
   ========================================================= */
/* jendela riwayat: 0 = 3 hari terakhir, 1 = seminggu, 2 = sebulan penuh */
const HIST_WIN=[3,7,9999];
function histAnchor(hmk){ return hmk===mkNow() ? today() : hmk+'-'+pad2(daysIn(hmk)); }
function histDates(hmk,lvl){
  const M=MO(hmk), by={};
  /* filter dipasang di sumber, jadi seluruh turunannya ikut konsisten:
     daftar hari, total struk, dan tombol "lihat lebih" */
  M.tx.forEach(x=>{ if(txMatch(x)) (by[x.date]=by[x.date]||[]).push(x); });
  const all=Object.keys(by).sort().reverse();
  const hits=all.reduce((a,ds)=>a+by[ds].length,0);
  /* saat filter aktif, jendela 3/7 hari diabaikan — kalau tidak,
     hasil pencarian bisa "hilang" hanya karena tanggalnya lama */
  if(filterActive()) return { by, all, shown:all, hits, filtered:true };
  const win=HIST_WIN[clamp(lvl,0,2)], anchor=histAnchor(hmk);
  let shown=all.filter(ds=>dayDiff(ds,anchor)<win);
  if(!shown.length && all.length) shown=all.slice(0, win===9999?all.length:Math.min(win,all.length));
  return { by, all, shown, hits, filtered:false };
}
function prevMonthWithData(hmk){
  let y=num(hmk.slice(0,4)), m=num(hmk.slice(5,7));
  for(let i=0;i<24;i++){
    m--; if(m<1){ m=12; y--; }
    const k=y+'-'+pad2(m);
    if(db.months[k] && db.months[k].tx && db.months[k].tx.length) return k;
  }
  return null;
}
function storyItems(mk){
  const s=sums(mk), M=MO(mk);
  const per={}; M.tx.forEach(x=>{ if(x.cat==='celengan') return; per[x.cat]=(per[x.cat]||0)+num(x.amount); });
  const rows=Object.keys(per).map(k=>({k,v:per[k]})).sort((a,b)=>b.v-a.v);
  const dayTot={}; M.tx.forEach(x=>{ if(x.cat==='celengan') return; const d=num(x.date.slice(8,10)); dayTot[d]=(dayTot[d]||0)+num(x.amount); });
  const hariAda=Object.keys(dayTot).length, rata=hariAda?s.jajan/hariAda:0;
  const top=rows[0]?catOf(rows[0].k):null;
  const out=[];
  out.push({ i:s.sisa>=0?'glowing-star':'pensive-face', f:s.sisa>=0?'🌟':'🥲',
    h: s.sisa>=0 ? tf('Sisa dompet {0}, boleh banget dipindah ke celengan 💖',rpS(s.sisa))
                 : tf('Pengeluaran lebih gede {0} dari cuan masuk. Bulan depan kita fix ya 🥲',rpS(-s.sisa)) });
  if(top) out.push({ i:top.i, f:top.f, h:tf('Paling banyak kabur ke <b>{0}</b>, totalnya {1}.',esc(cName(top)),rpS(rows[0].v)) });
  out.push({ i:'spiral-calendar', f:'📅', h:tf('Kamu jajan di <b>{0} hari</b>, rata-rata {1} sekali jajan.',hariAda,rpS(rata)) });
  out.push({ i:'money-bag', f:'💰', h:tf('Yang masuk celengan {0} bulan ini.',rpS(s.nabung)) });
  return out;
}

  const H=histDates(hmk,ui.histLvl), byDate=H.by;
  let hist='';
  if(H.all.length){
    H.shown.forEach(ds=>{
      const list=byDate[ds];
      const tot=list.reduce((a,x)=>a+(x.cat==='celengan'?0:num(x.amount)),0);
      const dd=new Date(ds+'T00:00:00');
      const label=ds===today()?t('Hari ini'):HARI_S()[dd.getDay()]+', '+dd.getDate()+' '+BULAN_S()[dd.getMonth()];
      hist+=
      '<div class="mb-4 last:mb-0">'+
        '<div class="flex items-center gap-2 mb-1.5">'+
          '<span class="hand font-bold text-[13px] px-2.5 py-0.5 rounded-full" style="background:'+(ds===today()?'#FFEAF0':'#FDF5F8')+';color:'+(ds===today()?'#E4718A':'#7E7271')+'">'+esc(label)+'</span>'+
          '<span class="flex-1 border-b-2 border-dotted border-[#EEDEE4]"></span>'+
          '<span class="text-[11.5px] text-soft money font-bold">'+rpS(tot)+'</span>'+
        '</div>'+
        list.slice().reverse().map(x=>{
          const c=catOf(x.cat);
          return '<div class="flex items-center gap-2.5 py-2">'+
            stk(c.i,{size:38,ic:22,tone:c.c,fb:c.f})+
            '<div class="flex-1 min-w-0">'+
              '<p class="hand text-[14px] font-semibold truncate leading-tight">'+esc(x.note||cName(c))+'</p>'+
              '<p class="text-[10.5px] text-soft">'+esc(cName(c))+(x.rec?' · '+t('otomatis'):'')+'</p></div>'+
            '<span class="font-extrabold text-[14px] money shrink-0" style="color:'+(x.cat==='celengan'?'#5D7C58':'#5A4E4D')+'">'+(x.cat==='celengan'?'+':'−')+rpS(x.amount)+'</span>'+
            '<button data-act="del-tx" data-id="'+x.id+'" aria-label="Hapus" class="w-6 h-6 grid place-items-center text-[#CBBCC0] font-bold text-[15px] shrink-0">×</button>'+
          '</div>';
        }).join('')+
      '</div>';
    });
  } else if(filterActive()){
    hist='<div class="text-center py-7">'+
      '<div class="inline-block mb-3">'+stk('memo',{size:64,ic:38,tone:'#EFDFB4',rot:3,fb:'🔍'})+'</div>'+
      '<p class="hand text-[14.5px] font-bold mb-1">'+t('Tidak ada catatan yang cocok 🔍')+'</p>'+
      '<p class="text-[12.5px] text-soft px-6">'+t('Coba kata lain atau lepas filter kategorinya.')+'</p></div>';
  } else {
    hist='<div class="text-center py-8">'+
      '<div class="inline-block mb-3">'+stk('basket',{size:74,ic:44,tone:'#EFDCD1',rot:-4,fb:'🧺'})+'</div>'+
      '<p class="hand text-[15px] font-bold mb-1">'+esc(isCur?t('Masih bersih nih! Belum jajan apa-apa hari ini ✨'):tf('Belum ada catatan di {0} 🌱',mkLabel(hmk)))+'</p>'+
      '<p class="text-[12.5px] text-soft px-6">'+t('Ketuk tombol pink di bawah buat mulai nyatet.')+'</p></div>';
  }

  /* tingkat berikutnya yang benar-benar menambah hari */
  let nextLvl=-1, delta=0;
  for(let L=ui.histLvl+1; L<=2; L++){
    const n=histDates(hmk,L).shown.length;
    if(n>H.shown.length){ nextLvl=L; delta=n-H.shown.length; break; }
  }
  const capt=[t('3 hari terakhir'),t('Seminggu terakhir'),t('Sebulan penuh')][clamp(ui.histLvl,0,2)];
  let ctrl='';
  if(H.all.length){
    if(nextLvl>=0){
      const lab = nextLvl===1 ? tf('Lihat {0} hari sebelumnya',delta) : tf('Buka sisa bulan ini · {0} hari',delta);
      ctrl+='<button data-act="hist-more" data-l="'+nextLvl+'" class="mt-3 w-full py-2.5 rounded-2xl dashed hand text-[13px] font-bold text-soft flex items-center justify-center gap-1.5 active:scale-[.98] transition">'+
        '<span>'+esc(lab)+'</span><span class="text-[10px] opacity-70">▼</span></button>';
    }
    if(ui.histLvl>0){
      ctrl+='<button data-act="hist-less" class="mt-2 w-full py-2 hand text-[12px] font-bold text-soft/70 flex items-center justify-center gap-1.5">'+
        '<span class="text-[10px] opacity-70">▲</span><span>'+t('Tutup lagi')+'</span></button>';
    }
    /* halaman sebelumnya: muncul kalau bulan ini sudah kebuka semua */
    if(nextLvl<0){
      const prev=prevMonthWithData(hmk);
      if(prev||!isCur){
        ctrl+='<div class="mt-3 pt-3 border-t-2 border-dotted border-[#EEDEE4] flex gap-2">'+
          (prev?'<button data-act="hist-month" data-mk="'+prev+'" class="chip hand flex-1 text-center !text-[11.5px]">◀ '+esc(tf('Buka {0}',mkLabel(prev)))+'</button>':'')+
          (!isCur?'<button data-act="hist-now" class="chip hand flex-1 text-center !text-[11.5px]" style="background:#FFF6E2;border-color:#F7E6B6;color:#786557">'+t('Balik ke bulan ini')+'</button>':'')+
        '</div>';
      }
    }
  }

  const totShown=H.shown.reduce((a,ds)=>a+byDate[ds].reduce((b,x)=>b+(x.cat==='celengan'?0:num(x.amount)),0),0);
  html+='<section class="receipt tape mb-2" style="'+tapeStyle('main','30px',76,-4)+'">'+
    zig(1)+
    '<div class="receipt-body relative">'+
      '<div class="flex items-start gap-2 pt-1">'+
        '<div class="flex-1 text-center">'+
          '<p class="hand font-bold text-[15.5px] leading-tight">'+t('Struk Jajan Kamu 🧾')+'</p>'+
          '<p class="text-[8.5px] font-bold tracking-[.16em] text-soft mt-0.5">'+t('PASTELS · YOUR POCKET BESTIE')+'</p>'+
        '</div>'+
        (isCur?'':'<button data-act="hist-now" class="hand text-[10px] font-bold px-2 py-1 rounded-full whitespace-nowrap shrink-0" style="background:#FFF6E2;border:2px solid #F7E6B6;color:#786557">'+t('Balik ke bulan ini')+'</button>')+
      '</div>'+
      '<p class="text-center text-[10.5px] text-soft mt-1 mb-2">'+esc(mkLabel(hmk)+' · '+(H.filtered?t('Hasil pencarian'):capt)+' · '+tf('{0} hari tercatat',H.shown.length))+'</p>'+
      '<div class="dotline mb-2"></div>'+
      filterBar(H.hits)+
      hist +
      '<div class="dotline mt-1 mb-2"></div>'+
      '<div class="flex items-end justify-between pb-1">'+
        '<span class="text-[10.5px] font-extrabold tracking-[.14em] text-soft">'+t('TOTAL TERCATAT')+'</span>'+
        '<span class="font-extrabold text-[17px] money">'+rp(totShown)+'</span>'+
      '</div>'+
      '<p class="hand text-center text-[11.5px] text-soft pt-1.5 pb-0.5">'+t('Makasih udah rajin nyatet ya! 🌸')+'</p>'+
      ctrl+
      '<div class="stamp">'+pawStamp(46,'#A3C79B')+'</div>'+
      '<div class="pb-2"></div>'+
    '</div>'+
    zig(-1)+
  '</section>';
  /* tumpukan struk: petunjuk halus kalau masih ada catatan di bawahnya */
  if(nextLvl>=0){
    html+='<div class="mx-auto mb-1" style="width:90%;height:6px;background:#FFF7FA;box-shadow:0 3px 6px rgba(197,150,170,.14)"></div>'+
          '<div class="mx-auto mb-5" style="width:78%;height:6px;background:#FDF2F6;box-shadow:0 3px 6px rgba(197,150,170,.10)"></div>';
  } else { html+='<div class="mb-5"></div>'; }

  /* Cerita bulan ini — ditaruh persis di bawah riwayat sebagai pengingat */
  if(H.all.length){
    html+='<section class="paper tape p-4 pt-5 mb-5" style="'+tapeStyle('main','24px',72,4)+';background:linear-gradient(165deg,#FFFDFB,#FFFAEA)">'+
      cardHead(tf('Cerita {0}',mkLabel(hmk)),'notebook-with-decorative-cover','#FCE9B8','📔',
        '<button data-act="go-recap" data-mk="'+hmk+'" class="hand text-[11px] font-bold whitespace-nowrap" style="color:#786557">'+t('Rekap lengkap')+' ▸</button>')+
      storyList(storyItems(hmk).slice(0,3))+
    '</section>';
  }

  html+=
  '<section class="paper tape p-5 pt-6 mb-2 text-center" style="'+tapeStyle('goal','calc(50% - 44px)',88,3)+';background:linear-gradient(160deg,#FAF4F7,#EEF6F3)">'+
    '<div class="inline-block mb-2">'+stk('people-hugging',{size:60,ic:36,tone:'#DCD2E8',rot:-3,fb:'👭'})+'</div>'+
    '<h2 class="hand font-bold text-[16px] mb-1">'+(LANG==='en'?'Save-Off With Your Bestie':'Challenge Hemat Bareng Bestie')+'</h2>'+
    '<p class="text-[12.5px] text-[#66706D] leading-relaxed mb-3 px-2">'+
      (LANG==='en'?'A week-long saving duel, cheering each other on, racing for the winner sticker. Coming soon 💖'
                 :'Adu hemat seminggu, saling nyemangatin, rebutan stiker juara. Coming soon 💖')+'</p>'+
    '<button data-act="soon" class="chip hand">'+(LANG==='en'?'Notify me later':'Notify me nanti ya')+'</button>'+
  '</section>';

  return html;
}

function envCard(mk){
  const masuk=sums(mk).masuk, pctSum=envPctSum();
  let rows='';
  ENVS.forEach(e=>{
    const alloc=envNom(e.k,masuk), used=envSpent(mk,e.k);
    const p=alloc>0?clamp(used/alloc*100,0,100):(used>0?100:0);
    const over=alloc>0&&used>alloc;
    rows+=
    '<div class="py-2.5 border-b-2 border-dotted border-[#F6E8EE] last:border-0">'+
      '<div class="flex items-center gap-2.5 mb-2">'+
        stk(e.i,{size:36,ic:21,tone:e.tone,fb:e.f})+
        '<div class="flex-1 min-w-0">'+
          '<p class="hand font-bold text-[13.5px] leading-tight">'+esc(LANG==='en'?e.en:e.n)+'</p>'+
        '</div>'+
        '<div class="flex items-center gap-1 shrink-0">'+
          '<input type="text" inputmode="numeric" data-field="env:'+e.k+':pct" data-live="envpct:'+e.k+'" value="'+num(db.env[e.k].pct)+'" class="field !py-1 !px-1.5 !w-[44px] text-center font-extrabold text-[12.5px]">'+
          '<span class="text-[11px] text-soft font-bold">%</span>'+
        '</div>'+
        '<input type="text" inputmode="numeric" data-money="1" data-field="env:'+e.k+':nom" data-live="envnom:'+e.k+'" value="'+fmt(alloc)+'" class="field !py-1 !px-2 !w-[92px] text-right money font-extrabold text-[12.5px] shrink-0">'+
      '</div>'+
      '<div class="track" style="height:9px"><div class="fill" data-live="envbar:'+e.k+'" style="width:'+p+'%;background-color:'+(over?'#FF8299':e.solid)+'"></div></div>'+
      '<p class="text-[10.5px] text-soft mt-1" data-live="envused:'+e.k+'">'+esc(tf('Kepake {0} dari {1}',rpS(used),rpS(alloc)))+'</p>'+
    '</div>';
  });

  /* Dropdown: kategori jajan mana masuk amplop mana.
     Disembunyikan di belakang <details> supaya kartu tidak ramai. */
  const envOpts=k=>ENVS.map(e=>'<option value="'+e.k+'"'+(envOfCat(k)===e.k?' selected':'')+'>'+esc(LANG==='en'?e.en:e.n)+'</option>').join('');
  const peta=CATS.map(c=>
    '<div class="flex items-center gap-2 py-1.5 border-b border-dotted border-[#F6E8EE] last:border-0">'+
      stk(c.i,{size:30,ic:18,tone:c.c,fb:c.f})+
      '<span class="hand text-[12.5px] font-semibold flex-1 min-w-0 truncate">'+esc(cName(c))+'</span>'+
      '<select data-field="catenv:'+c.k+'" class="field !py-1 !px-2 text-[11.5px] !w-[124px] shrink-0">'+envOpts(c.k)+'</select>'+
    '</div>').join('');
  return '<section class="paper tape p-4 pt-5 mb-5" style="'+tapeStyle('main','24px',84,4)+'">'+
    cardHead(t('Amplop Bulan Ini 🧺'),'card-file-box','#F7E7B8','🧺',
      '<span class="hand text-[11px] font-bold '+(pctSum===100?'text-soft':'text-[#FF8299]')+'" data-live="envtotal">'+esc(tf('Total amplop {0}% dari cuan masuk',pctSum))+'</span>')+
    '<p class="text-[12px] text-soft mb-1 -mt-1">'+t('Bagi otomatis dari cuan masuk, atau ketik nominal sendiri.')+'</p>'+
    rows+
    '<button data-act="autosplit" class="mt-3 w-full py-2.5 rounded-2xl hand text-[13.5px] font-bold active:scale-[.98] transition" style="background:#FFF3CD;border:2.5px solid #F7E7B8;box-shadow:0 3px 0 #F7E7B8">'+t('Auto-Split 50/30/20')+'</button>'+
    '<details class="mt-3">'+
      '<summary class="hand text-[12.5px] font-bold text-soft cursor-pointer py-1">'+t('Atur kategori tiap amplop')+'</summary>'+
      '<p class="text-[11.5px] text-soft mt-1 mb-2">'+t('Yang masuk Jatah Jajan ikut menentukan limit harianmu.')+'</p>'+
      peta+
    '</details>'+
  '</section>';
}

function viewSave(){
  const tot=totalSaved();
  const target=db.goals.reduce((a,g)=>a+num(g.target),0);
  const pct=target>0?clamp(tot/target*100,0,100):0;
  const s=sums(mkNow());
  let html='';

  html+=
  '<section class="paper tape p-5 pt-6 mb-5 text-center" style="'+tapeStyle('goal','calc(50% - 50px)',100,-5)+';background:linear-gradient(165deg,#F1F8EC,#FFFAEA)">'+

    '<h2 class="hand font-bold text-[17px] mb-0.5">'+t('Celengan Impian 💰')+'</h2>'+
    '<p class="hand text-[12px] text-[#6E9668] mb-2 px-3 leading-snug">'+t('Biar jajan tetep aman, sambil nabung wishlist 💖')+'</p>'+
    '<p class="hand font-bold text-[12.5px] text-[#6E9668]">'+t('Total di semua celengan')+'</p>'+
