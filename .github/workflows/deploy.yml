name: Build & Deploy Pastels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tidak ada `npm install` di sini, dan itu disengaja.
      # tw.css sudah tersimpan di repositori, jadi build tidak
      # bergantung pada jaringan maupun paket yang harus diunduh.
      - name: Bangun index.html
        run: |
          node rewire.mjs
          node build.mjs

      # css-test.mjs tidak memakai paket apa pun. Dia memeriksa dua
      # hal yang paling sering rusak: kelas CSS yang hilang, dan
      # bundle yang terpotong karena '</script>' bocor.
      - name: Uji berkas hasil build
        run: node css-test.mjs

      - name: Siapkan folder situs
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
